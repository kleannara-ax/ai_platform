<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안전작업방식 매뉴얼</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="nav"></div>
  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="m-0"><i class="fas fa-shield-alt me-2 text-warning"></i>안전작업방식 매뉴얼</h4>
      <div>
        <a class="btn btn-outline-success btn-sm d-none" id="btn-upload-link" href="upload.html"><i class="fas fa-file-excel me-1"></i>엑셀 일괄업로드</a>
        <button class="btn btn-primary btn-sm d-none" id="btn-add-category" onclick="openCategoryModal()"><i class="fas fa-folder-plus me-1"></i>분류 추가</button>
        <button class="btn btn-success btn-sm d-none" id="btn-add-manual" onclick="openManualModal()"><i class="fas fa-plus me-1"></i>매뉴얼 추가</button>
      </div>
    </div>
    <div id="msg" class="alert d-none" role="alert"></div>

    <div class="row g-3">
      <!-- 좌측: 분류 트리 -->
      <div class="col-md-3">
        <div class="card">
          <div class="card-header py-2 fw-bold small">분류</div>
          <div class="list-group list-group-flush" id="categoryTree" style="max-height:70vh; overflow-y:auto;">
            <div class="p-3 text-muted small">불러오는 중...</div>
          </div>
        </div>
      </div>

      <!-- 우측: 매뉴얼 목록 / 상세 -->
      <div class="col-md-9">
        <div id="manualListPane">
          <div class="card">
            <div class="card-header py-2 fw-bold small" id="manualListTitle">분류를 선택하세요</div>
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light"><tr>
                  <th>매뉴얼명</th><th style="width:120px">출처</th><th style="width:150px">수정일</th><th style="width:80px">관리</th>
                </tr></thead>
                <tbody id="manualRows"><tr><td colspan="4" class="text-center text-muted py-4">좌측에서 분류를 선택하세요.</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 매뉴얼 상세 (원본 엑셀과 같은 레이아웃) -->
        <div id="manualDetailPane" style="display:none">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="closeDetail()"><i class="fas fa-arrow-left me-1"></i>목록으로</button>
            <div>
              <button class="btn btn-outline-primary btn-sm d-none" id="btn-add-step" onclick="openStepModal()"><i class="fas fa-plus me-1"></i>단계 추가</button>
              <button class="btn btn-outline-danger btn-sm d-none" id="btn-delete-manual" onclick="deleteManual()"><i class="fas fa-trash me-1"></i>매뉴얼 삭제</button>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <h5 id="detailTitle" class="mb-1"></h5>
              <div class="small text-muted mb-3" id="detailMeta"></div>
              <div class="table-responsive">
                <table class="table table-bordered align-middle" style="table-layout:fixed">
                  <colgroup>
                    <col style="width:50px"><col style="width:180px"><col><col style="width:16%"><col style="width:16%"><col style="width:14%"><col style="width:70px">
                  </colgroup>
                  <thead class="table-light text-center small">
                    <tr><th>No.</th><th>공정 순서(사진)</th><th>공정 순서(설명)</th><th>위험요인</th><th>안전 보호구</th><th>비고</th><th>관리</th></tr>
                  </thead>
                  <tbody id="stepRows"><tr><td colspan="7" class="text-center text-muted py-4">불러오는 중...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 분류 등록 모달 -->
  <div class="modal fade" id="categoryModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">분류 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-2"><label class="form-label small mb-0">분류명 *</label><input id="cat-name" class="form-control form-control-sm"></div>
      <div class="mb-2"><label class="form-label small mb-0">상위 분류</label>
        <select id="cat-parent" class="form-select form-select-sm"><option value="">(최상위)</option></select>
      </div>
      <div class="mb-2"><label class="form-label small mb-0">표시 순서</label><input id="cat-sort" type="number" class="form-control form-control-sm" value="0"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button><button class="btn btn-primary btn-sm" onclick="createCategory()">등록</button></div>
  </div></div></div>

  <!-- 매뉴얼 등록 모달 -->
  <div class="modal fade" id="manualModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">매뉴얼 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-2"><label class="form-label small mb-0">매뉴얼 제목(공정명) *</label><input id="man-title" class="form-control form-control-sm"></div>
      <div class="mb-2"><label class="form-label small mb-0">표시 순서</label><input id="man-sort" type="number" class="form-control form-control-sm" value="0"></div>
      <div class="small text-muted">등록 후 상세 화면에서 단계(공정 순서)를 추가할 수 있습니다.</div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button><button class="btn btn-primary btn-sm" onclick="createManual()">등록</button></div>
  </div></div></div>

  <!-- 단계 등록/사진 첨부 모달 -->
  <div class="modal fade" id="stepModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="stepModalTitle">단계 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="step-id">
      <div class="row g-2">
        <div class="col-2"><label class="form-label small mb-0">No. *</label><input id="step-no" type="number" class="form-control form-control-sm"></div>
        <div class="col-10"><label class="form-label small mb-0">표시 순서</label><input id="step-sort" type="number" class="form-control form-control-sm" value="0"></div>
      </div>
      <div class="mb-2 mt-1"><label class="form-label small mb-0">공정 순서(설명)</label><textarea id="step-desc" class="form-control form-control-sm" rows="2"></textarea></div>
      <div class="mb-2"><label class="form-label small mb-0">위험요인</label><textarea id="step-hazard" class="form-control form-control-sm" rows="2"></textarea></div>
      <div class="mb-2"><label class="form-label small mb-0">안전 보호구</label><textarea id="step-equip" class="form-control form-control-sm" rows="2"></textarea></div>
      <div class="mb-2"><label class="form-label small mb-0">비고</label><textarea id="step-remark" class="form-control form-control-sm" rows="2"></textarea></div>
      <div class="mb-2" id="step-photo-upload-wrap" style="display:none">
        <label class="form-label small mb-0">사진 첨부</label>
        <input type="file" id="step-photo-file" class="form-control form-control-sm" accept="image/*">
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button><button class="btn btn-primary btn-sm" onclick="saveStep()">저장</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
