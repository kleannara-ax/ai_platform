<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전작업 매뉴얼</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff;
  --accent:#0ea5e9;
  --bg:#f3f5fb;
  --surface:#ffffff;
  --text:#111827; --muted:#6b7280; --line:#e7e9f2;
  --radius:18px; --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  --shadow-md:0 4px 10px -2px rgba(17,24,39,.08), 0 12px 28px -10px rgba(17,24,39,.10);
  --shadow-lg:0 10px 25px -5px rgba(17,24,39,.12), 0 20px 45px -15px rgba(17,24,39,.14);
}
*{box-sizing:border-box}
body{
  font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
.safety-main{max-width:1480px; margin:0 auto; padding:18px 22px 60px;}
.page-header{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  margin-bottom:14px; flex-wrap:wrap;
}
.page-header h1{
  font-size:1.5rem; font-weight:800; margin:0; letter-spacing:-.3px;
  display:flex; align-items:center; gap:10px;
}
.page-header h1 .icon-badge{
  width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; font-size:1rem; box-shadow:var(--shadow-sm);
}
.header-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn-modern{
  border:none; border-radius:11px; padding:9px 16px; font-size:.86rem; font-weight:600;
  display:inline-flex; align-items:center; gap:7px; transition:.15s; box-shadow:var(--shadow-sm);
}
.btn-modern:active{transform:translateY(1px)}
.btn-primary-modern{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff}
.btn-primary-modern:hover{filter:brightness(1.06); color:#fff}
.btn-outline-modern{background:#fff; color:var(--brand); border:1.5px solid var(--brand-soft)}
.btn-outline-modern:hover{background:var(--brand-soft); color:var(--brand)}
.btn-success-modern{background:linear-gradient(135deg,#16a34a,#22c55e); color:#fff}
.btn-success-modern:hover{filter:brightness(1.06); color:#fff}
.btn-danger-soft{background:#fef2f2; color:#dc2626}
.btn-danger-soft:hover{background:#fee2e2; color:#b91c1c}
/* 관리(수정) 모드 토글 — 켜져 있을 때 확실히 구분되도록 */
.btn-edit-toggle{background:#fff; color:var(--muted); border:1.5px solid var(--line)}
.btn-edit-toggle:hover{background:#f8f9fd; color:var(--text)}
.btn-edit-toggle.on{background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff; border-color:transparent}
.btn-edit-toggle.on:hover{filter:brightness(1.06); color:#fff}

#msg{
  border:none; border-radius:12px; font-size:.86rem; font-weight:600; padding:12px 16px;
  box-shadow:var(--shadow-sm);
}
#msg.alert-success{background:#ecfdf5; color:#047857}
#msg.alert-danger{background:#fef2f2; color:#b91c1c}

/* ================= 본문 2단 레이아웃 ================= */
.safety-layout{display:grid; grid-template-columns:296px minmax(0,1fr); gap:18px; align-items:start}
@media (max-width: 991.98px){ .safety-layout{grid-template-columns:1fr} }

/* 좌측 컬럼 — 분류 트리 / 연락처 / 공지사항 카드가 세로로 쌓인다 */
.side-column{display:flex; flex-direction:column; gap:14px; position:sticky; top:18px}
@media (max-width: 991.98px){ .side-column{position:static} }
.side-card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden}
.side-card-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:12px 16px; border-bottom:1px solid var(--line);
}
.side-card-head h6{margin:0; font-size:.9rem; font-weight:800; display:flex; align-items:center; gap:7px}
.side-card-head h6 i{color:var(--brand)}
.side-card-head .btn-modern{padding:4px 10px; font-size:.76rem}
.side-photo{display:block; width:100%; height:auto; cursor:zoom-in; transition:.15s}
.side-photo:hover{filter:brightness(1.03)}

/* 공지사항 */
.notice-card #noticeList{max-height:300px; overflow-y:auto}
.notice-row{padding:11px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:.12s}
.notice-row:last-child{border-bottom:none}
.notice-row:hover{background:#f8f9fd}
.notice-row.pinned{background:#fffbeb}
.notice-row.pinned:hover{background:#fef7dd}
.notice-top{display:flex; align-items:center; gap:6px}
.notice-title{
  flex:1 1 auto; min-width:0; font-size:.85rem; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.notice-pin{color:#f59e0b; font-size:.72rem; flex:0 0 auto}
/* 날짜는 제목 줄 오른쪽 끝에 — 날짜만 표시하고 시간·작성자는 넣지 않는다 */
.notice-date{flex:0 0 auto; font-size:.72rem; color:var(--muted); white-space:nowrap}
.notice-tools{flex:0 0 auto; display:flex; gap:2px}
.notice-tools button{
  width:22px; height:22px; border-radius:6px; border:none; background:transparent; color:#9aa0b4; font-size:.66rem;
}
.notice-tools button:hover{background:#e9ebf5; color:var(--text)}
.notice-tools button.danger:hover{background:#fee2e2; color:#dc2626}
/* 목록에서는 두 줄까지만 — 전체 내용은 눌러서 모달로 본다 */
.notice-preview{
  font-size:.78rem; color:#6b7280; margin-top:5px; line-height:1.45; white-space:pre-wrap; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.notice-empty{padding:22px 14px; text-align:center; color:var(--muted); font-size:.8rem}
/* 전체 보기 모달 */
.notice-view-meta{font-size:.78rem; color:var(--muted); margin-top:3px}
.nf-item{border-bottom:1px solid var(--line)}
.nf-item:last-child{border-bottom:none}
/* 머리글은 항상 보이고, 본문은 펼친 항목만 보인다 */
.nf-head{
  display:flex; align-items:center; gap:12px; padding:14px 12px; cursor:pointer;
  border-radius:10px; transition:.12s;
}
.nf-head:hover{background:#f8f9fd}
.nf-title{font-size:1rem; font-weight:700; margin:0; display:flex; align-items:center; gap:7px; min-width:0; flex:1 1 auto}
.nf-title > span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nf-title .notice-pin{font-size:.8rem}
.nf-date{flex:0 0 auto; font-size:.8rem; color:var(--muted); white-space:nowrap}
.nf-caret{flex:0 0 auto; color:#9aa0b4; font-size:.75rem; transition:transform .15s}
.nf-item.open .nf-caret{transform:rotate(180deg)}
.nf-item.open .nf-title{color:var(--brand)}
.nf-body{
  font-size:.94rem; color:var(--text); line-height:1.75; white-space:pre-wrap; word-break:break-word;
  padding:2px 12px 16px;
}
.nf-body.empty{color:var(--muted); font-style:italic}

/* 페이지네이션 */
#noticeViewPager{justify-content:space-between; align-items:center; gap:10px}
.nf-range{font-size:.8rem; color:var(--muted)}
.nf-pages{display:flex; gap:4px; align-items:center}
.nf-page{
  min-width:30px; height:30px; padding:0 8px; border-radius:8px; border:1px solid var(--line);
  background:#fff; color:var(--text); font-size:.82rem; font-weight:600;
}
.nf-page:hover:not(:disabled){background:var(--brand-soft); border-color:var(--brand-soft); color:var(--brand)}
.nf-page.active{background:var(--brand); border-color:var(--brand); color:#fff}
.nf-page:disabled{color:#c7cad6; background:#fff}

/* ---- 좌측: 스택형 분류 트리 ---- */
.tree-panel{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.tree-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:14px 16px; border-bottom:1px solid var(--line);
}
.tree-head h6{margin:0; font-size:.9rem; font-weight:800; display:flex; align-items:center; gap:7px}
.tree-head h6 i{color:var(--brand)}
.tree-body{padding:8px; max-height:calc(100vh - 480px); min-height:190px; overflow-y:auto}
@media (max-width: 991.98px){ .tree-body{max-height:420px} }

.tree-row{
  display:flex; align-items:center; gap:4px; width:100%; border:none; background:transparent;
  border-radius:10px; padding:7px 8px; cursor:pointer; text-align:left; transition:.12s;
}
.tree-row:hover{background:#f5f6fb}
.tree-row.selected{background:var(--brand-soft)}
.tree-row.selected .tr-name{color:var(--brand); font-weight:700}
.tr-caret{
  width:20px; height:20px; flex:0 0 auto; border:none; background:transparent; color:#9aa0b4; font-size:.68rem;
  border-radius:6px; display:flex; align-items:center; justify-content:center; transition:transform .15s;
}
.tr-caret:hover{background:#e9ebf5; color:var(--text)}
.tr-caret.open{transform:rotate(90deg)}
.tr-caret.leaf{visibility:hidden}
.tr-icon{width:18px; flex:0 0 auto; text-align:center; font-size:.76rem; color:#9aa0b4}
.tree-row.selected .tr-icon{color:var(--brand)}
.tr-name{
  flex:1 1 auto; min-width:0; font-size:.855rem; font-weight:500; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tr-count{
  flex:0 0 auto; font-size:.68rem; font-weight:700; color:var(--muted);
  background:#f1f2f7; border-radius:20px; padding:1px 7px; min-width:24px; text-align:center;
}
.tree-row.selected .tr-count{background:#fff; color:var(--brand)}
.tr-tools{flex:0 0 auto; display:flex; gap:2px}
.tr-tools button{
  width:24px; height:24px; border-radius:7px; border:none; background:transparent; color:#9aa0b4; font-size:.68rem;
}
.tr-tools button:hover{background:#e9ebf5; color:var(--text)}
.tr-tools button.danger:hover{background:#fee2e2; color:#dc2626}
/* 단계별 들여쓰기 (대 > 중 > 소) */
.tree-children{margin-left:13px; border-left:1px dashed var(--line); padding-left:5px}
.tree-empty{padding:26px 14px; text-align:center; color:var(--muted); font-size:.82rem}

/* ---- 우측: 매뉴얼 목록 ---- */
.list-panel{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden}
.list-head{padding:16px 20px; border-bottom:1px solid var(--line)}
.list-head .lh-top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.list-head h5{font-size:1.02rem; font-weight:800; margin:0}
.list-head .lh-path{font-size:.76rem; color:var(--muted); margin-top:3px}
.lh-count{font-size:.78rem; color:var(--muted); font-weight:600; white-space:nowrap}
/* 검색 두 종류: 왼쪽은 매뉴얼명(화면에서 즉시 필터), 오른쪽은 내용(서버 조회) */
.search-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center}
.list-search{position:relative; flex:1 1 260px; min-width:220px; max-width:360px}
.list-search input{padding-left:34px; padding-right:30px; border-radius:10px; border-color:var(--line); font-size:.85rem}
.list-search > i{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9aa0b4; font-size:.8rem}
.search-clear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:none; background:transparent; color:#9aa0b4; font-size:.75rem; padding:4px 6px; border-radius:6px;
}
.search-clear:hover{background:#f1f2f7; color:var(--text)}
.search-hint{font-size:.76rem; color:var(--muted); margin-top:7px; min-height:1em}
.search-hint b{color:var(--brand)}

/* 내용 검색으로 걸린 부분 발췌 */
.mr-snippets{margin-top:5px; display:flex; flex-direction:column; gap:2px}
.mr-snippet{
  font-size:.75rem; color:#4b5563; background:#f8f9fd; border-left:3px solid var(--brand-soft);
  border-radius:0 6px 6px 0; padding:3px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mr-snippet mark{background:#fef08a; color:inherit; padding:0 1px; border-radius:2px}
.mr-match-more{font-size:.72rem; color:var(--muted); padding-left:8px}

.manual-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:13px 20px; border-bottom:1px solid var(--line);
  transition:.12s; text-decoration:none; color:var(--text); cursor:pointer;
}
.manual-row:last-child{border-bottom:none}
.manual-row:hover{background:#f8f9fd}
.mr-left{min-width:0; display:flex; align-items:center; gap:11px}
.mr-ico{
  width:32px; height:32px; flex:0 0 auto; border-radius:10px; background:var(--brand-soft); color:var(--brand);
  display:flex; align-items:center; justify-content:center; font-size:.82rem;
}
.mr-title{font-weight:600; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mr-path{font-size:.73rem; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mr-right{flex:0 0 auto; display:flex; align-items:center; gap:12px}
.mr-date{font-size:.75rem; color:var(--muted); white-space:nowrap}
.mr-chevron{color:#c7cad6; font-size:.75rem}

.empty-state{
  text-align:center; padding:56px 20px; color:var(--muted);
}
.empty-state i{font-size:2rem; opacity:.35; margin-bottom:10px; display:block}

/* ================= 매뉴얼 상세 모달 ================= */
.modal-content{border-radius:20px; border:none; box-shadow:var(--shadow-lg)}
.modal-header{border-bottom:1px solid var(--line); padding:18px 22px}
.modal-header .modal-title{font-weight:800; font-size:1.05rem}
.modal-body{padding:20px 22px}
.modal-footer{border-top:1px solid var(--line); padding:14px 22px}
.form-label-modern{font-size:.78rem; font-weight:700; color:#374151; margin-bottom:5px; display:block}
.form-control, .form-select{border-radius:10px; border-color:var(--line); font-size:.88rem}
.form-control:focus, .form-select:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}

/* 매뉴얼 상세 모달은 단계 표가 주인공이라 기본 modal-xl 보다 넓게 쓴다.
   플랫폼 SPA 안에서는 iframe 폭이 상한이므로 가용 폭을 거의 전부 쓰고,
   본문 여백도 줄여 표에 넓이를 몰아준다. */
#detailModal .modal-dialog{max-width:min(1900px, 98vw); margin:12px auto}
#detailModal .modal-body{padding:14px 12px}
#detailModal .modal-header{padding:16px 16px}
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; width:100%}
.detail-path{color:var(--muted); font-size:.78rem; font-weight:500; margin-top:3px}
.detail-tools{display:flex; gap:7px; flex-wrap:wrap}
/* 컬럼 폭은 px 절대값이고 표 전체 폭은 JS가 합계로 지정한다.
   합계가 화면보다 넓어지면 .table-responsive 가 가로 스크롤을 만든다. */
.step-table{border-collapse:separate; border-spacing:0; table-layout:fixed}
.step-table th{
  position:relative; background:#f8f9fd; color:var(--muted); font-size:.9rem; font-weight:700;
  padding:12px 10px; text-align:center; border-bottom:2px solid var(--line);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* 머리글 오른쪽 경계를 잡고 끌면 그 컬럼 폭이 바뀐다 */
.col-resizer{
  position:absolute; top:0; right:-4px; width:9px; height:100%; z-index:2; cursor:col-resize;
}
.col-resizer::after{
  content:''; position:absolute; top:7px; bottom:7px; left:3px; width:3px;
  border-radius:2px; background:transparent; transition:background .12s;
}
.col-resizer:hover::after{background:var(--brand)}
.step-table th:last-child .col-resizer{right:0; width:6px}
body.col-resizing, body.col-resizing *{cursor:col-resize !important; user-select:none !important}
body.col-resizing .col-resizer::after{background:var(--brand)}
.step-table td{padding:15px 12px; border-bottom:1px solid var(--line); font-size:1.06rem; line-height:1.6; vertical-align:top}
/* 위험요인은 이 화면에서 가장 중요한 항목이라 넓게 잡고 굵게 표시한다 (색 강조는 쓰지 않는다) */
.step-table td.col-hazard{font-size:1.14rem; font-weight:700}
.step-table th.col-hazard{color:var(--text)}
.step-table tr:hover td{background:#fafbff}
.step-no-badge{
  display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%;
  background:var(--brand-soft); color:var(--brand); font-weight:700; font-size:.78rem;
}
.step-manage{display:flex; gap:5px; justify-content:center}

/* 좁은 화면(표 영역 760px 미만): 표를 포기하고 단계별 카드로 쌓는다.
   가로 스크롤로 내용이 잘려 나가는 것보다 항목명을 붙여 세로로 쌓는 편이 읽기 쉽다. */
.step-table.stacked{width:100% !important; display:block}
.step-table.stacked thead{display:none}
.step-table.stacked tbody{display:block}
.step-table.stacked tr{
  display:block; border:1px solid var(--line); border-radius:14px;
  padding:10px 4px; margin-bottom:12px; background:var(--surface);
}
.step-table.stacked tr:hover td{background:transparent}
.step-table.stacked td{
  display:block; width:auto !important; border-bottom:none; padding:7px 12px;
}
.step-table.stacked td::before{
  content:attr(data-label); display:block; font-size:.76rem; font-weight:700;
  color:var(--muted); margin-bottom:3px;
}
.step-table.stacked td.text-center{text-align:left !important}
/* 카드형에서는 사진이 화면을 통째로 먹지 않도록 높이를 제한한다 (누르면 확대 뷰어로 크게 볼 수 있다) */
.step-table.stacked .step-photo{max-height:320px}
/* 클릭하면 확대되는 단계 사진 */
.step-photo{
  max-width:100%; max-height:130px; display:block; margin-bottom:5px; cursor:zoom-in;
  border:1px solid var(--line); border-radius:8px; transition:.15s;
}
.step-photo:hover{border-color:var(--brand); box-shadow:var(--shadow-md)}

/* ================= 이미지 확대 뷰어(라이트박스) ================= */
.lightbox{
  position:fixed; inset:0; z-index:20000; background:rgba(9,11,20,.92);
  display:none; flex-direction:column;
}
.lightbox.open{display:flex}
.lb-bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 18px; color:#e5e7eb; font-size:.82rem; flex:0 0 auto;
}
.lb-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600}
.lb-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.lb-actions button{
  border:none; background:rgba(255,255,255,.12); color:#fff; border-radius:9px;
  width:34px; height:34px; font-size:.82rem;
}
.lb-actions button.wide{width:auto; padding:0 12px; font-size:.78rem; font-weight:600}
.lb-actions button:hover{background:rgba(255,255,255,.24)}
.lb-zoom{min-width:52px; text-align:center; font-weight:700; color:#cbd5e1}
.lb-stage{flex:1 1 auto; overflow:auto; display:flex; align-items:center; justify-content:center; padding:0 18px 18px}
.lb-stage img{display:block; margin:auto; background:#fff; border-radius:8px; cursor:zoom-in}
.lb-stage img.fit{max-width:100%; max-height:100%}
.lb-stage img.zoomed{cursor:zoom-out; max-width:none; max-height:none}
.lb-hint{text-align:center; color:#94a3b8; font-size:.72rem; padding-bottom:12px; flex:0 0 auto}

/* ================= 엑셀 업로드 모달 ================= */
.eu-step{display:flex; align-items:center; gap:8px; font-size:.8rem; font-weight:700; color:var(--muted); margin-bottom:14px}
.eu-step .num{
  width:22px; height:22px; border-radius:50%; background:#f1f2f7; color:var(--muted); font-size:.72rem;
  display:flex; align-items:center; justify-content:center;
}
.eu-step.active .num{background:var(--brand); color:#fff}
.eu-step.active{color:var(--text)}
.eu-catrow{display:flex; align-items:flex-end; gap:6px; margin-bottom:10px}
.eu-catrow .flex-fill select{width:100%}
.eu-add-inline{display:flex; gap:6px; margin-top:6px}
.eu-add-btn{
  width:34px; height:34px; flex:0 0 auto; border-radius:9px; border:1.5px dashed var(--line);
  background:#fff; color:var(--brand); font-size:.8rem;
}
.eu-add-btn:hover{border-color:var(--brand); background:var(--brand-soft)}
.eu-sheet-table{width:100%; font-size:.8rem}
.eu-sheet-table th{background:#f8f9fd; padding:8px 6px; font-size:.72rem; color:var(--muted); font-weight:700; text-align:left}
.eu-sheet-table td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.eu-sheet-table tr.excluded{opacity:.5}
.badge-ok{background:#dcfce7; color:#15803d; font-weight:700; font-size:.7rem; padding:3px 9px; border-radius:20px}
.badge-no{background:#f1f2f7; color:var(--muted); font-weight:700; font-size:.7rem; padding:3px 9px; border-radius:20px}
.eu-summary{
  background:var(--brand-soft); color:#4338ca; border-radius:10px; padding:10px 14px; font-size:.82rem; font-weight:600;
  margin-bottom:10px;
}
.eu-note{font-size:.76rem; color:var(--muted); margin-top:6px}
/* 시트별 등록 분류 선택 — 기본값에서 바꾼 행은 눈에 띄게 표시한다 */
.eu-row-cat{font-size:.78rem; padding:4px 6px; border-radius:8px; border:1px solid var(--line); width:100%}
.eu-row-cat:focus{border-color:var(--brand); outline:none; box-shadow:0 0 0 3px var(--brand-soft)}
.eu-row-cat.changed{border-color:var(--brand); background:var(--brand-soft); font-weight:600}
.eu-row-cat:disabled{background:#f4f5fa; color:#aeb3c2}
.eu-cat-reset{
  border:none; background:transparent; color:var(--muted); font-size:.7rem; padding:2px 4px; border-radius:6px;
}
.eu-cat-reset:hover{background:#f1f2f7; color:var(--text)}
</style>
</head>
<body>
<div id="nav"></div>
<div class="safety-main">

  <div class="page-header">
    <div>
      <h1><span class="icon-badge"><i class="fas fa-shield-alt"></i></span>안전작업 매뉴얼</h1>
    </div>
    <div class="header-actions">
      <button class="btn-modern btn-edit-toggle d-none" id="btn-edit-mode" onclick="toggleEditMode()">
        <i class="fas fa-pen"></i><span id="btn-edit-mode-label">수정</span>
      </button>
      <button class="btn-modern btn-success-modern d-none" id="btn-excel-upload" onclick="openExcelModal()">
        <i class="fas fa-file-excel"></i>엑셀 일괄 업로드
      </button>
      <button class="btn-modern btn-primary-modern d-none" id="btn-add-manual" onclick="openManualCreateModal()">
        <i class="fas fa-plus"></i>내용 추가
      </button>
    </div>
  </div>

  <div id="msg" class="alert d-none mb-3" role="alert"></div>

  <div class="safety-layout">

    <!-- 좌측: 분류 트리 + 방재센터 연락처 + 공지사항 -->
    <div class="side-column">
    <aside class="tree-panel">
      <div class="tree-head">
        <h6><i class="fas fa-folder-tree"></i>분류</h6>
        <div class="d-flex gap-1">
          <button class="tr-caret d-none" id="btn-add-major" style="width:26px;height:26px" title="대분류 추가"
                  onclick="openCategoryCreateModal(null)"><i class="fas fa-plus"></i></button>
          <button class="tr-caret" style="width:26px;height:26px" title="모두 펼치기" onclick="expandAll(true)"><i class="fas fa-angles-down"></i></button>
          <button class="tr-caret" style="width:26px;height:26px" title="모두 접기" onclick="expandAll(false)"><i class="fas fa-angles-up"></i></button>
        </div>
      </div>
      <div class="tree-body" id="treeBody"></div>
    </aside>

    <!-- 방재센터 연락처 — 눌러서 크게 볼 수 있다 -->
    <section class="side-card">
      <img class="side-photo" src="img/emergency-contacts.jpg" alt="방재센터 전화번호"
           title="클릭하면 크게 볼 수 있습니다"
           onclick="openLightbox(this.getAttribute('src'), '방재센터 전화번호')">
    </section>

    <!-- 공지사항 -->
    <section class="side-card notice-card">
      <div class="side-card-head">
        <h6><i class="fas fa-bullhorn"></i>공지사항</h6>
        <button class="btn-modern btn-outline-modern d-none" id="btn-add-notice" onclick="openNoticeModal()">
          <i class="fas fa-plus"></i>등록
        </button>
      </div>
      <div id="noticeList"></div>
    </section>
    </div>

    <!-- 우측: 선택한 분류의 매뉴얼 목록 -->
    <section class="list-panel">
      <div class="list-head">
        <div class="lh-top">
          <div style="min-width:0">
            <h5 id="listTitle">전체 매뉴얼</h5>
            <div class="lh-path" id="listPath">모든 분류</div>
          </div>
          <div class="lh-count" id="listCount"></div>
        </div>
        <div class="search-row">
          <div class="list-search">
            <i class="fas fa-file-signature"></i>
            <input class="form-control" id="listFilter" placeholder="매뉴얼명으로 찾기" oninput="renderManualList()">
            <button class="search-clear" id="listFilterClear" style="display:none" title="지우기"
                    onclick="clearTitleFilter()"><i class="fas fa-xmark"></i></button>
          </div>
          <div class="list-search">
            <i class="fas fa-magnifying-glass"></i>
            <input class="form-control" id="contentFilter" placeholder="내용으로 찾기 (공정·위험요인·보호구·비고)"
                   onkeydown="if(event.key==='Enter') runContentSearch()" oninput="onContentFilterInput()">
            <button class="search-clear" id="contentFilterClear" style="display:none" title="내용 검색 해제"
                    onclick="clearContentSearch()"><i class="fas fa-xmark"></i></button>
          </div>
          <button class="btn-modern btn-outline-modern" onclick="runContentSearch()">
            <i class="fas fa-magnifying-glass"></i>내용 검색
          </button>
        </div>
        <div class="search-hint" id="searchHint"></div>
      </div>
      <div id="manualRows"></div>
    </section>

  </div>
</div>

<!-- 매뉴얼 상세 모달 (목록에서 선택 시 수칙 표시) -->
<div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header">
    <div class="detail-head">
      <div style="min-width:0">
        <h5 class="modal-title" id="detailTitle">매뉴얼</h5>
        <div class="detail-path" id="detailPath"></div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="detail-tools" id="detailTools"></div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
    </div>
  </div>
  <div class="modal-body">
    <div class="table-responsive">
      <table class="step-table">
        <colgroup id="stepCols"></colgroup>
        <thead id="stepHead"></thead>
        <tbody id="stepRows"></tbody>
      </table>
    </div>
  </div>
</div></div></div>

<!-- 이미지 확대 뷰어 -->
<div class="lightbox" id="lightbox">
  <div class="lb-bar">
    <div class="lb-name" id="lbName"></div>
    <div class="lb-actions">
      <button title="축소" onclick="lbZoom(-1)"><i class="fas fa-magnifying-glass-minus"></i></button>
      <span class="lb-zoom" id="lbZoomLabel">맞춤</span>
      <button title="확대" onclick="lbZoom(1)"><i class="fas fa-magnifying-glass-plus"></i></button>
      <button class="wide" onclick="lbFit()">화면 맞춤</button>
      <button title="새 탭에서 원본 보기" onclick="lbOpenRaw()"><i class="fas fa-up-right-from-square"></i></button>
      <button title="닫기 (Esc)" onclick="closeLightbox()"><i class="fas fa-xmark"></i></button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" class="fit" src="" alt=""></div>
  <div class="lb-hint">이미지를 클릭하면 확대/축소, 마우스 휠로 배율 조절, Esc로 닫기</div>
</div>

<!-- 공지사항 전체 보기 모달 — 목록에서 무엇을 누르든 전체 공지를 볼 수 있다 -->
<div class="modal fade" id="noticeViewModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header">
    <div style="min-width:0">
      <h5 class="modal-title"><i class="fas fa-bullhorn me-2"></i>공지사항</h5>
      <div class="notice-view-meta" id="noticeViewMeta"></div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body" id="noticeViewScroll"><div id="noticeViewList"></div></div>
  <div class="modal-footer" id="noticeViewPager"></div>
</div></div></div>

<!-- 공지사항 등록/수정 모달 -->
<div class="modal fade" id="noticeModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="noticeModalTitle">공지사항 등록</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="notice-id">
    <div class="mb-3"><label class="form-label-modern">제목 *</label><input id="notice-title" class="form-control" maxlength="200"></div>
    <div class="mb-3"><label class="form-label-modern">내용</label><textarea id="notice-content" class="form-control" rows="5"></textarea></div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="notice-pinned">
      <label class="form-check-label" for="notice-pinned" style="font-size:.85rem">상단 고정</label>
    </div>
  </div>
  <div class="modal-footer"><button class="btn-modern btn-outline-modern" data-bs-dismiss="modal">취소</button><button class="btn-modern btn-primary-modern" onclick="saveNotice()">저장</button></div>
</div></div></div>

<!-- 분류 등록/수정 모달 -->
<div class="modal fade" id="categoryModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="categoryModalTitle">분류 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="cat-id">
    <div class="mb-3" id="cat-context-wrap">
      <label class="form-label-modern">상위 분류</label>
      <div class="small text-muted" id="cat-context-text">-</div>
    </div>
    <div class="mb-3"><label class="form-label-modern">분류명 *</label><input id="cat-name" class="form-control" placeholder="예: 화장지, 4호기, 설비 등"></div>
    <div class="mb-1"><label class="form-label-modern">표시 순서</label><input id="cat-sort" type="number" class="form-control" value="0"></div>
  </div>
  <div class="modal-footer"><button class="btn-modern btn-outline-modern" data-bs-dismiss="modal">취소</button><button class="btn-modern btn-primary-modern" onclick="saveCategory()">저장</button></div>
</div></div></div>

<!-- 매뉴얼 등록 모달 -->
<div class="modal fade" id="manualModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="manualModalTitle">매뉴얼 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="man-id">
    <div class="mb-3">
      <label class="form-label-modern">등록할 분류(소분류) *</label>
      <select id="man-category" class="form-select"></select>
    </div>
    <div class="mb-3"><label class="form-label-modern">매뉴얼 제목(공정명) *</label><input id="man-title" class="form-control" placeholder="예: 독타 블레이드 교체"></div>
    <div class="mb-1"><label class="form-label-modern">표시 순서</label><input id="man-sort" type="number" class="form-control" value="0"></div>
    <div class="eu-note mt-2" id="man-context-note"></div>
  </div>
  <div class="modal-footer"><button class="btn-modern btn-outline-modern" data-bs-dismiss="modal">취소</button><button class="btn-modern btn-primary-modern" onclick="saveManual()">저장</button></div>
</div></div></div>

<!-- 단계 등록/사진 첨부 모달 -->
<div class="modal fade" id="stepModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="stepModalTitle">단계 추가</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="step-id">
    <div class="row g-2">
      <div class="col-3"><label class="form-label-modern">No. *</label><input id="step-no" type="number" class="form-control"></div>
      <div class="col-9"><label class="form-label-modern">표시 순서</label><input id="step-sort" type="number" class="form-control" value="0"></div>
    </div>
    <div class="mb-2 mt-2"><label class="form-label-modern">공정 순서(설명)</label><textarea id="step-desc" class="form-control" rows="2"></textarea></div>
    <div class="mb-2"><label class="form-label-modern">위험요인</label><textarea id="step-hazard" class="form-control" rows="2"></textarea></div>
    <div class="mb-2"><label class="form-label-modern">안전 보호구</label><textarea id="step-equip" class="form-control" rows="2"></textarea></div>
    <div class="mb-2"><label class="form-label-modern">비고</label><textarea id="step-remark" class="form-control" rows="2"></textarea></div>
    <div class="mb-1" id="step-photo-upload-wrap" style="display:none">
      <label class="form-label-modern">사진 첨부</label>
      <input type="file" id="step-photo-file" class="form-control" accept="image/*">
    </div>
  </div>
  <div class="modal-footer"><button class="btn-modern btn-outline-modern" data-bs-dismiss="modal">취소</button><button class="btn-modern btn-primary-modern" onclick="saveStep()">저장</button></div>
</div></div></div>

<!-- 엑셀 일괄 업로드 모달 -->
<div class="modal fade" id="excelModal" tabindex="-1"><div class="modal-dialog modal-xl"><div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title"><i class="fas fa-file-excel text-success me-2"></i>엑셀 일괄 업로드</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">

    <div class="eu-step active" id="eu-step1-label"><span class="num">1</span>엑셀 파일 선택 (선택하면 형식을 자동으로 확인합니다)</div>
    <div class="mb-2">
      <input type="file" id="eu-file" class="form-control" accept=".xlsx,.xls" onchange="euDoPreview()">
      <div class="eu-note" id="euFileStatus"></div>
    </div>

    <div id="euStep2" style="display:none">
      <hr class="my-3">
      <div class="eu-step active" id="eu-step2-label"><span class="num">2</span>등록할 분류 선택 (아래에서 시트마다 따로 바꿀 수 있어요)</div>

      <div class="row g-3 mb-2">
        <div class="col-md-4">
          <label class="form-label-modern">대분류</label>
          <div class="eu-catrow">
            <div class="flex-fill"><select id="eu-major" class="form-select" onchange="euOnMajorChange()"><option value="">선택</option></select></div>
            <button class="eu-add-btn" onclick="euToggleAdd('major')" title="대분류 추가"><i class="fas fa-plus"></i></button>
          </div>
          <div class="eu-add-inline d-none" id="eu-add-major-form">
            <input class="form-control form-control-sm" id="eu-add-major-name" placeholder="새 대분류명">
            <button class="btn btn-sm btn-primary" onclick="euCreateCategory('major')">추가</button>
          </div>
        </div>
        <div class="col-md-4">
          <label class="form-label-modern">중분류</label>
          <div class="eu-catrow">
            <div class="flex-fill"><select id="eu-middle" class="form-select" onchange="euOnMiddleChange()" disabled><option value="">대분류를 먼저 선택</option></select></div>
            <button class="eu-add-btn" onclick="euToggleAdd('middle')" title="중분류 추가"><i class="fas fa-plus"></i></button>
          </div>
          <div class="eu-add-inline d-none" id="eu-add-middle-form">
            <input class="form-control form-control-sm" id="eu-add-middle-name" placeholder="새 중분류명">
            <button class="btn btn-sm btn-primary" onclick="euCreateCategory('middle')">추가</button>
          </div>
        </div>
        <div class="col-md-4">
          <label class="form-label-modern">소분류</label>
          <div class="eu-catrow">
            <div class="flex-fill"><select id="eu-minor" class="form-select" onchange="euOnMinorChange()" disabled><option value="">중분류를 먼저 선택</option></select></div>
            <button class="eu-add-btn" onclick="euToggleAdd('minor')" title="소분류 추가"><i class="fas fa-plus"></i></button>
          </div>
          <div class="eu-add-inline d-none" id="eu-add-minor-form">
            <input class="form-control form-control-sm" id="eu-add-minor-name" placeholder="새 소분류명">
            <button class="btn btn-sm btn-primary" onclick="euCreateCategory('minor')">추가</button>
          </div>
        </div>
      </div>

      <div class="eu-summary" id="euSummary"></div>
      <div class="eu-note mb-2">인식된 시트는 기본적으로 모두 선택되어 있습니다. 필요 없는 시트만 체크 해제하세요.</div>

      <div class="table-responsive" style="max-height:320px; overflow-y:auto; border:1px solid var(--line); border-radius:12px">
        <table class="eu-sheet-table mb-0">
          <thead class="sticky-top"><tr>
            <th style="width:34px"><input type="checkbox" id="eu-check-all" checked onchange="euToggleAll(this)"></th>
            <th style="width:130px">시트명</th><th style="width:76px">인식결과</th><th>매뉴얼명(추정)</th>
            <th style="width:250px">등록 분류</th>
            <th style="width:54px">단계수</th><th style="width:54px">사진수</th><th style="width:180px">미리보기</th>
          </tr></thead>
          <tbody id="euPreviewRows"></tbody>
        </table>
      </div>
    </div>

    <div id="euStep3" style="display:none">
      <hr class="my-3">
      <div class="eu-step active"><span class="num"><i class="fas fa-check" style="font-size:.6rem"></i></span>업로드 결과</div>
      <div id="euResultBody"></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-modern btn-outline-modern" data-bs-dismiss="modal">닫기</button>
    <button class="btn-modern btn-success-modern d-none" id="eu-confirm-btn" onclick="euDoConfirm()"><i class="fas fa-upload"></i>확정 업로드</button>
  </div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/safety.js"></script>
<script src="js/index.js"></script>
</body>
</html>
