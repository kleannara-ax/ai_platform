<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안전작업방식 매뉴얼 - 엑셀 일괄업로드</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="nav"></div>
  <div class="container-fluid px-4">
    <h4 class="mb-3"><i class="fas fa-file-excel me-2 text-success"></i>엑셀 일괄업로드</h4>
    <div id="msg" class="alert d-none" role="alert"></div>

    <!-- 1단계: 파일 선택 + 형식 확인 -->
    <div class="card mb-3">
      <div class="card-header py-2 fw-bold small">1단계. 엑셀 파일 선택 &amp; 형식 확인</div>
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small mb-0">등록할 분류 *</label>
            <select id="up-category" class="form-select form-select-sm"><option value="">불러오는 중...</option></select>
          </div>
          <div class="col-md-5">
            <label class="form-label small mb-0">엑셀 파일 (.xlsx) *</label>
            <input type="file" id="up-file" class="form-control form-control-sm" accept=".xlsx">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary btn-sm w-100" onclick="doPreview()"><i class="fas fa-search me-1"></i>형식 확인</button>
          </div>
        </div>
        <div class="small text-muted mt-2">
          시트를 먼저 분석해 매뉴얼로 인식되는 시트만 보여줍니다. "초지"처럼 개요/범례 성격의 시트는 자동으로 제외됩니다.
          형식을 확인한 후 아래에서 가져올 시트를 선택하고 "확정 업로드"를 눌러야 실제로 저장됩니다.
        </div>
      </div>
    </div>

    <!-- 2단계: 미리보기 결과 + 시트 선택 + 확정 -->
    <div class="card" id="previewCard" style="display:none">
      <div class="card-header py-2 fw-bold small d-flex justify-content-between align-items-center">
        <span>2단계. 시트별 형식 확인 결과 — 가져올 시트를 선택하세요</span>
        <span class="small text-muted" id="previewSummary"></span>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:40px"><input type="checkbox" id="chkAll" onclick="toggleAll(this)"></th>
              <th>시트명</th><th>인식 결과</th><th>매뉴얼 제목(추정)</th><th style="width:70px">단계수</th><th style="width:70px">사진수</th><th>미리보기(앞부분)</th>
            </tr>
          </thead>
          <tbody id="previewRows"></tbody>
        </table>
      </div>
      <div class="card-body d-flex justify-content-between align-items-center">
        <span class="small text-muted">선택된 시트만 실제로 매뉴얼로 등록됩니다.</span>
        <button class="btn btn-success" onclick="doConfirm()"><i class="fas fa-check me-1"></i>확정 업로드</button>
      </div>
    </div>

    <!-- 결과 -->
    <div class="card mt-3" id="resultCard" style="display:none">
      <div class="card-header py-2 fw-bold small">업로드 결과</div>
      <div class="card-body" id="resultBody"></div>
    </div>
  </div>

  <script src="js/safety.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
