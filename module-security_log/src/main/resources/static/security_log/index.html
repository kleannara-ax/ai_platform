<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보안로그 업로드 목록</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/seclog.css" rel="stylesheet">
</head>
<body>
<main class="sl-main" id="listPage">
  <header class="page-header">
    <h1><span class="icon-badge"><i class="fas fa-shield-halved"></i></span>보안로그 이상징후 모니터링</h1>
    <div class="header-actions">
      <a href="upload.html" class="btn-m btn-primary-m hidden" id="btnNew"><i class="fas fa-upload"></i>로그 업로드</a>
    </div>
  </header>

  <nav class="sl-tabs">
    <a href="index.html" class="active"><i class="fas fa-list"></i> 로그 업로드 목록</a>
    <a href="rules.html"><i class="fas fa-sliders"></i> 탐지 룰셋 편집</a>
  </nav>

  <!-- 월 선택 + 필터 -->
  <section class="card-m" id="filterSection">
    <div class="filter-bar">
      <div class="f-item">
        <label>대상 연월</label>
        <div class="ym-nav">
          <button class="btn-m btn-gray-m btn-sm-m" id="btnPrevYm" title="이전 달"><i class="fas fa-chevron-left"></i></button>
          <span class="ym-label" id="ymLabel"></span>
          <button class="btn-m btn-gray-m btn-sm-m" id="btnNextYm" title="다음 달"><i class="fas fa-chevron-right"></i></button>
          <input type="month" class="form-control" id="ymPicker" style="width:150px">
        </div>
      </div>
      <div class="f-item">
        <label for="fSystem">시스템명</label>
        <input type="text" class="form-control" id="fSystem" placeholder="시스템명 검색" style="width:170px">
      </div>
      <div class="f-item">
        <label for="fLogType">로그 유형</label>
        <select class="form-select" id="fLogType" style="width:160px"><option value="">전체</option></select>
      </div>
      <div class="f-item">
        <label for="fStatus">검토 상태</label>
        <select class="form-select" id="fStatus" style="width:120px">
          <option value="">전체</option><option value="ANALYZED">검토대기</option><option value="REVIEWED">검토완료</option>
        </select>
      </div>
      <div class="f-item">
        <label for="fSeverity">최고 위험도</label>
        <select class="form-select" id="fSeverity" style="width:120px">
          <option value="">전체</option><option value="CRITICAL">심각</option><option value="HIGH">높음</option>
          <option value="MEDIUM">보통</option><option value="LOW">낮음</option>
        </select>
      </div>
      <button class="btn-m btn-primary-m" id="btnSearch"><i class="fas fa-search"></i>조회</button>
      <button class="btn-m btn-gray-m" id="btnReset"><i class="fas fa-rotate-left"></i>초기화</button>
    </div>
  </section>

  <!-- 월별 요약 -->
  <section class="kpi-grid" id="kpiGrid"></section>

  <section class="row g-3 mb-3">
    <div class="col-lg-12">
      <div class="card-m h-100 mb-0">
        <h2><i class="fas fa-ranking-star"></i>이번 달 많이 탐지된 룰 TOP 10</h2>
        <div id="topRules" class="text-muted-m" style="font-size:.85rem">-</div>
      </div>
    </div>
  </section>

  <!-- 목록 -->
  <section class="card-m">
    <h2><i class="fas fa-file-lines"></i>업로드 목록 <span class="text-muted-m" style="font-size:.8rem;font-weight:600" id="totalCount"></span></h2>
    <div class="tbl-wrap">
      <table class="tbl" id="uploadTable">
        <thead>
          <tr>
            <th class="center">No</th><th>시스템명</th><th>로그 유형</th><th>파일명</th>
            <th class="num">라인 수</th><th class="num">탐지</th><th>위험도 분포</th><th>최고 위험도</th>
            <th>상태</th><th>업로드 일시</th>
          </tr>
        </thead>
        <tbody id="uploadBody"><tr class="empty-row"><td colspan="10">불러오는 중...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<div class="loading" id="loading"><div class="spinner"></div><span>불러오는 중...</span></div>

<script src="js/seclog.js"></script>
<script>
(() => {
  if (!SECLOG.requireAuth()) return;
  const { api, esc, fmtDt, fmtNum, fmtYm, sevBadge, statusBadge, toast, LOG_TYPES } = SECLOG;
  const PAGE_SIZE = 20;
  const state = { ym: SECLOG.qs('ym') || sessionStorage.getItem('seclog_ym') || SECLOG.currentYm(), page: 0 };

  const $ = (id) => document.getElementById(id);
  LOG_TYPES.forEach(([v, l]) => $('fLogType').insertAdjacentHTML('beforeend', `<option value="${v}">${l}</option>`));
  if (SECLOG.canWrite()) $('btnNew').classList.remove('hidden');

  const loading = (on) => $('loading').classList.toggle('show', on);
  const shiftYm = (ym, d) => {
    let y = +ym.slice(0, 4), m = +ym.slice(4) + d;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    return y + String(m).padStart(2, '0');
  };
  const setYm = (ym) => {
    state.ym = ym; state.page = 0;
    sessionStorage.setItem('seclog_ym', ym);
    $('ymLabel').textContent = fmtYm(ym);
    $('ymPicker').value = ym.slice(0, 4) + '-' + ym.slice(4);
    load();
  };

  async function loadSummary() {
    const s = await api('/uploads/summary?targetYm=' + state.ym);
    const reviewRate = s.uploadCount ? Math.round(s.reviewedUploadCount / s.uploadCount * 100) : 0;
    $('kpiGrid').innerHTML = `
      <div class="kpi"><div class="k-label">업로드 건수</div><div class="k-value">${fmtNum(s.uploadCount)}</div><div class="k-sub">시스템 ${fmtNum(s.systemCount)}개</div></div>
      <div class="kpi"><div class="k-label">검토 진행률</div><div class="k-value">${reviewRate}%</div><div class="k-sub">완료 ${s.reviewedUploadCount} / 대기 ${s.pendingUploadCount}</div></div>
      <div class="kpi k-pending"><div class="k-label">미검토 탐지</div><div class="k-value">${fmtNum(s.pendingDetectionCount)}</div><div class="k-sub">전체 탐지 ${fmtNum(s.detectionCount)}건</div></div>
      <div class="kpi k-critical"><div class="k-label">심각</div><div class="k-value">${fmtNum(s.criticalCount)}</div><div class="k-sub">CRITICAL</div></div>
      <div class="kpi k-high"><div class="k-label">높음</div><div class="k-value">${fmtNum(s.highCount)}</div><div class="k-sub">HIGH</div></div>
      <div class="kpi k-medium"><div class="k-label">보통</div><div class="k-value">${fmtNum(s.mediumCount)}</div><div class="k-sub">MEDIUM</div></div>
      <div class="kpi k-low"><div class="k-label">낮음</div><div class="k-value">${fmtNum(s.lowCount)}</div><div class="k-sub">LOW</div></div>`;
    const top = s.topRules || [];
    $('topRules').innerHTML = top.length === 0 ? '이번 달 탐지 내역이 없습니다.' :
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="center">순위</th><th>룰 코드</th><th>룰명</th><th>위험도</th><th class="num">탐지 건수</th></tr></thead><tbody>' +
      top.map((r, i) => `<tr><td class="center">${i + 1}</td><td class="mono">${esc(r.ruleCode)}</td><td>${esc(r.ruleName)}</td><td>${sevBadge(r.severity)}</td><td class="num">${fmtNum(r.hitCount)}</td></tr>`).join('') +
      '</tbody></table></div>';
  }

  async function loadList() {
    const p = new URLSearchParams({ targetYm: state.ym, page: state.page, size: PAGE_SIZE });
    if ($('fSystem').value.trim()) p.set('systemName', $('fSystem').value.trim());
    if ($('fLogType').value) p.set('logType', $('fLogType').value);
    if ($('fStatus').value) p.set('status', $('fStatus').value);
    if ($('fSeverity').value) p.set('maxSeverity', $('fSeverity').value);
    const data = await api('/uploads?' + p.toString());
    const rows = data.content || [];
    $('totalCount').textContent = `(총 ${fmtNum(data.totalElements)}건)`;
    if (rows.length === 0) {
      $('uploadBody').innerHTML = `<tr class="empty-row"><td colspan="10"><i class="fas fa-inbox fa-2x mb-2" style="color:#cbd5e1"></i><br>${fmtYm(state.ym)}에 업로드된 로그가 없습니다.</td></tr>`;
    } else {
      $('uploadBody').innerHTML = rows.map((u, i) => {
        const tot = u.detectionCount || 0;
        const pct = (n) => tot ? (n / tot * 100) : 0;
        return `<tr class="clickable" data-id="${u.uploadId}">
          <td class="center">${data.totalElements - (state.page * PAGE_SIZE) - i}</td>
          <td><b>${esc(u.systemName)}</b></td>
          <td><span class="badge-type">${esc(u.logTypeLabel)}</span></td>
          <td class="mono">${esc(u.originalFileName)}</td>
          <td class="num">${fmtNum(u.totalLineCount)}</td>
          <td class="num"><b>${fmtNum(tot)}</b></td>
          <td><div class="sev-bar" title="심각 ${u.criticalCount} / 높음 ${u.highCount} / 보통 ${u.mediumCount} / 낮음 ${u.lowCount}">
            <span class="b-c" style="width:${pct(u.criticalCount)}%"></span><span class="b-h" style="width:${pct(u.highCount)}%"></span>
            <span class="b-m" style="width:${pct(u.mediumCount)}%"></span><span class="b-l" style="width:${pct(u.lowCount)}%"></span></div></td>
          <td>${sevBadge(u.maxSeverity)}</td>
          <td>${statusBadge(u.status)}</td>
          <td>${fmtDt(u.createdAt)}</td></tr>`;
      }).join('');
    }
    renderPager(data.totalPages || 0);
  }

  function renderPager(totalPages) {
    if (totalPages <= 1) { $('pager').innerHTML = ''; return; }
    const cur = state.page, start = Math.max(0, cur - 4), end = Math.min(totalPages, start + 9);
    let h = `<button ${cur === 0 ? 'disabled' : ''} data-p="${cur - 1}"><i class="fas fa-chevron-left"></i></button>`;
    for (let i = start; i < end; i++) h += `<button class="${i === cur ? 'active' : ''}" data-p="${i}">${i + 1}</button>`;
    h += `<button ${cur >= totalPages - 1 ? 'disabled' : ''} data-p="${cur + 1}"><i class="fas fa-chevron-right"></i></button>`;
    $('pager').innerHTML = h;
  }

  async function load() {
    loading(true);
    try { await Promise.all([loadSummary(), loadList()]); }
    catch (e) { toast(e.message, 'error'); $('uploadBody').innerHTML = `<tr class="empty-row"><td colspan="10">${esc(e.message)}</td></tr>`; }
    finally { loading(false); }
  }

  $('btnPrevYm').onclick = () => setYm(shiftYm(state.ym, -1));
  $('btnNextYm').onclick = () => setYm(shiftYm(state.ym, 1));
  $('ymPicker').onchange = (e) => { if (e.target.value) setYm(e.target.value.replace('-', '')); };
  $('btnSearch').onclick = () => { state.page = 0; loadList().catch(e => toast(e.message, 'error')); };
  $('fSystem').onkeydown = (e) => { if (e.key === 'Enter') $('btnSearch').click(); };
  $('btnReset').onclick = () => { ['fSystem', 'fLogType', 'fStatus', 'fSeverity'].forEach(id => $(id).value = ''); $('btnSearch').click(); };
  $('pager').onclick = (e) => { const b = e.target.closest('button[data-p]'); if (b && !b.disabled) { state.page = +b.dataset.p; loadList().catch(er => toast(er.message, 'error')); } };
  $('uploadBody').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) SECLOG.go('detail.html', { id: tr.dataset.id }); };

  setYm(state.ym);
})();
</script>
</body>
</html>
