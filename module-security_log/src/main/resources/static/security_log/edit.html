<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보안로그 수정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<link href="css/seclog.css" rel="stylesheet">
</head>
<body>
<main class="sl-main" style="max-width:900px">
  <header class="page-header">
    <h1><span class="icon-badge"><i class="fas fa-pen"></i></span>업로드 정보 수정</h1>
    <div class="header-actions">
      <a class="btn-m btn-gray-m" id="btnBack"><i class="fas fa-arrow-left"></i>상세로</a>
    </div>
  </header>

  <div class="alert-m alert-info">
    <i class="fas fa-circle-info mt-1"></i>
    <div>파일 자체는 교체할 수 없습니다 (증적 보존). 파일을 바꾸려면 관리자가 삭제한 뒤 다시 업로드하세요.<br>
      <b>로그 유형을 바꾸면</b> 적용 룰이 달라지므로 자동으로 재분석되며, 기존 검토 내용은 초기화됩니다.</div>
  </div>

  <form class="card-m" id="editForm" novalidate>
    <h2><i class="fas fa-file-pen"></i>기본 정보</h2>
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">원본 파일</label>
        <div class="file-chip mt-0" id="fileChip"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="targetYm">대상 연월<span class="req">*</span></label>
        <input type="month" class="form-control" id="targetYm" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="systemName">시스템명<span class="req">*</span></label>
        <input type="text" class="form-control" id="systemName" maxlength="100" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="logType">로그 유형<span class="req">*</span></label>
        <select class="form-select" id="logType" required></select>
        <div class="form-text hidden" id="logTypeWarn" style="color:#b45309"><i class="fas fa-triangle-exclamation"></i> 저장 시 재분석됩니다.</div>
      </div>
      <div class="col-12">
        <label class="form-label" for="remark">비고</label>
        <input type="text" class="form-control" id="remark" maxlength="1000">
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="reanalyze">
          <label class="form-check-label" for="reanalyze" style="font-size:.86rem">저장 후 현재 활성 룰셋으로 <b>재분석</b> (기존 탐지/검토 내용 초기화)</label>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-4">
      <a class="btn-m btn-gray-m" id="btnCancel">취소</a>
      <button type="submit" class="btn-m btn-primary-m" id="btnSave"><i class="fas fa-floppy-disk"></i>저장</button>
    </div>
  </form>
</main>

<div class="loading" id="loading"><div class="spinner"></div><span>저장 중...</span></div>

<script src="js/seclog.js"></script>
<script>
(() => {
  if (!SECLOG.requireAuth()) return;
  const { api, esc, fmtSize, toast, LOG_TYPES } = SECLOG;
  const $ = (id) => document.getElementById(id);
  const id = SECLOG.qs('id');
  if (!id) { location.href = 'index.html'; return; }
  const detailUrl = 'detail.html?id=' + id;
  $('btnBack').href = $('btnCancel').href = detailUrl;

  const block = (msg) => {
    document.querySelector('main').innerHTML = `<div class="card-m text-center" style="padding:50px"><i class="fas fa-lock fa-2x mb-3" style="color:#cbd5e1"></i>
      <h5>${msg}</h5><a href="${detailUrl}" class="btn-m btn-outline-m mt-2">상세로</a></div>`;
  };
  if (!SECLOG.canWrite()) { block('수정 권한이 없습니다.'); return; }

  LOG_TYPES.forEach(([v, l]) => $('logType').insertAdjacentHTML('beforeend', `<option value="${v}">${l}</option>`));
  let origLogType = null;

  (async () => {
    try {
      const d = await api('/uploads/' + id);
      const u = d.upload;
      if (u.status === 'REVIEWED') { block('검토완료된 건은 수정할 수 없습니다. 관리자가 검토취소한 뒤 수정하세요.'); return; }
      origLogType = u.logType;
      $('targetYm').value = u.targetYm.slice(0, 4) + '-' + u.targetYm.slice(4);
      $('systemName').value = u.systemName;
      $('logType').value = u.logType;
      $('remark').value = u.remark || '';
      $('fileChip').innerHTML = `<i class="fas fa-file-lines" style="color:var(--brand)"></i><b>${esc(u.originalFileName)}</b><span class="text-muted-m">${fmtSize(u.fileSize)}</span>`;
    } catch (e) { toast(e.message, 'error'); block(esc(e.message)); }
  })();

  $('logType').onchange = () => {
    const changed = $('logType').value !== origLogType;
    $('logTypeWarn').classList.toggle('hidden', !changed);
    if (changed) { $('reanalyze').checked = true; $('reanalyze').disabled = true; } else { $('reanalyze').disabled = false; }
  };

  $('editForm').onsubmit = async (e) => {
    e.preventDefault();
    const targetYm = $('targetYm').value.replace('-', '');
    if (!targetYm || !$('systemName').value.trim() || !$('logType').value) return toast('필수 항목을 입력하세요.', 'error');
    const willReanalyze = $('reanalyze').checked;
    if (willReanalyze && !confirm('재분석하면 기존 탐지 결과와 검토 내용이 초기화됩니다. 계속할까요?')) return;

    $('btnSave').disabled = true; $('loading').classList.add('show');
    try {
      await api('/uploads/' + id, {
        method: 'PUT',
        body: { targetYm, systemName: $('systemName').value.trim(), logType: $('logType').value,
                remark: $('remark').value.trim() || null, reanalyze: willReanalyze },
      });
      sessionStorage.setItem('seclog_ym', targetYm);
      toast(willReanalyze ? '저장 및 재분석이 완료되었습니다.' : '저장되었습니다.');
      setTimeout(() => location.href = detailUrl, 600);
    } catch (err) {
      toast(err.message, 'error');
      $('btnSave').disabled = false; $('loading').classList.remove('show');
    }
  };
})();
</script>
</body>
</html>
