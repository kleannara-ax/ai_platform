// ============================================================
// module-kims: KIMS (IT 운영 관리) 모듈
// 패키지: com.company.module.kims
// URL Prefix: /kims-api/** (업무 API), /qr-api/** (QR 공개 조회)
// 화면: /kims/**  (플랫폼 SPA 안에서 iframe 으로 로드)
// DB Table: ip_address, service_request, inventory_item … (플랫폼 DB 공용)
// ============================================================

dependencies {
    // core 공통 클래스 참조 (컴파일 전용: 순환 의존 방지)
    compileOnly project(':core')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 공통코드(KIMS_PERM) 조회용 JdbcTemplate
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Excel 다운로드(.xlsx)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // QR 코드(PNG) 생성
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// spring-boot 플러그인 미적용 서브모듈: plain jar만 생성
jar {
    enabled = true
}
