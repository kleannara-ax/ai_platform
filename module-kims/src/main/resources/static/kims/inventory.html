<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIMS - 소모품 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="nav"></div>
  <div class="container-fluid px-4">
    <h4 class="mb-3">소모품 관리</h4>
    <div id="msg" class="alert d-none" role="alert"></div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" id="tab-dash" onclick="showTab('dash')">대시보드</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-inbound" onclick="showTab('inbound')">입고 내역</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-issue" onclick="showTab('issue')">지급 내역</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-reqhist" onclick="showTab('reqhist')">소모품 업무요청 이력</button></li>
    </ul>

    <!-- ============ 대시보드 탭 ============ -->
    <div id="pane-dash">
      <!-- 재고 현황 (분류별) -->
      <div class="card mb-3"><div class="card-body py-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="m-0">재고 현황 (분류별 보유 수량)</h6>
          <div class="small">
            <span class="badge bg-secondary">총 품목 <span id="s-total">0</span></span>
            <span class="badge bg-danger">재고부족 <span id="s-low">0</span></span>
            <span class="badge bg-primary">총 재고수량 <span id="s-sum">0</span></span>
          </div>
        </div>
        <div class="row g-2" id="catCharts"></div>
      </div></div>

      <!-- 신규 지급 요청 목록 -->
      <div class="card"><div class="card-body py-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="m-0">신규 지급 요청 <span class="badge bg-warning text-dark" id="sr-cnt">0</span></h6>
          <span class="small text-muted">전산소모품 지급 요청 중 '접수' 상태</span>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-hover table-bordered bg-white align-middle mb-0">
            <thead class="table-light"><tr>
              <th>요청번호</th><th>요청자</th><th>부서</th><th>요청내용</th><th>요청일</th><th style="width:90px">처리</th>
            </tr></thead>
            <tbody id="supplyReqRows"><tr><td colspan="6" class="text-center text-muted">불러오는 중...</td></tr></tbody>
          </table>
        </div>
      </div></div>
    </div>

    <!-- ============ 입고 내역 탭 ============ -->
    <div id="pane-inbound" style="display:none">
      <div class="d-flex justify-content-between align-items-end mb-2">
        <div class="d-flex gap-2 align-items-end">
          <div><label class="form-label small mb-0">품목명 검색</label><input id="in-keyword" class="form-control form-control-sm"></div>
          <button class="btn btn-secondary btn-sm" onclick="loadInboundTab()">검색</button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openItemCreate()">+ 품목 등록</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover table-bordered bg-white align-middle">
          <thead class="table-light"><tr>
            <th>품목명</th><th>카테고리</th><th>현재재고</th><th>단위</th><th>최근 입고 내역</th><th style="width:150px">관리</th>
          </tr></thead>
          <tbody id="inboundRows"><tr><td colspan="6" class="text-center text-muted">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- ============ 지급 내역 탭 ============ -->
    <div id="pane-issue" style="display:none">
      <div class="d-flex justify-content-between align-items-end mb-2">
        <div class="d-flex gap-2 align-items-end">
          <div><label class="form-label small mb-0">품목명 검색</label><input id="is-keyword" class="form-control form-control-sm"></div>
          <button class="btn btn-secondary btn-sm" onclick="loadIssueTab()">검색</button>
        </div>
        <button class="btn btn-outline-success btn-sm" onclick="downloadIssueExcel()">Excel 다운로드</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover table-bordered bg-white align-middle">
          <thead class="table-light"><tr>
            <th>품목명</th><th>카테고리</th><th>현재재고</th><th>단위</th><th>최신 지급 내역</th><th style="width:150px">관리</th>
          </tr></thead>
          <tbody id="issueRows"><tr><td colspan="6" class="text-center text-muted">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- ============ 소모품 업무요청 이력 탭 (전산소모품 지급 요청만) ============ -->
    <div id="pane-reqhist" style="display:none">
      <div class="card mb-3"><div class="card-body py-2">
        <div class="row g-2 align-items-end">
          <div class="col-md-2"><label class="form-label small mb-0">기간(부터)</label><input id="rh-from" type="date" class="form-control form-control-sm"></div>
          <div class="col-md-2"><label class="form-label small mb-0">기간(까지)</label><input id="rh-to" type="date" class="form-control form-control-sm"></div>
          <div class="col-md-2"><label class="form-label small mb-0">처리상태</label><select id="rh-status" class="form-select form-select-sm"><option value="">전체</option></select></div>
          <div class="col-md-2"><label class="form-label small mb-0">요청자</label><input id="rh-requester" class="form-control form-control-sm"></div>
          <div class="col-md-2"><label class="form-label small mb-0">부서</label><input id="rh-dept" class="form-control form-control-sm"></div>
          <div class="col-md-2"><label class="form-label small mb-0">담당자</label><input id="rh-assignee" class="form-control form-control-sm"></div>
          <div class="col-12 mt-2"><button class="btn btn-secondary btn-sm" onclick="rhPage=0;loadReqHist()">검색</button>
            <button class="btn btn-light btn-sm" onclick="resetReqHist()">초기화</button>
            <span class="small text-muted ms-2">전산소모품 지급 요청만 표시됩니다.</span></div>
        </div>
      </div></div>
      <div class="table-responsive">
        <table class="table table-sm table-hover table-bordered bg-white align-middle">
          <thead class="table-light"><tr>
            <th>요청번호</th><th>요청일</th><th>요청자</th><th>부서</th><th>상태</th><th>담당자</th><th>요청 소모품</th><th style="width:70px">상세</th>
          </tr></thead>
          <tbody id="reqhistRows"><tr><td colspan="8" class="text-center text-muted">불러오는 중...</td></tr></tbody>
        </table>
      </div>
      <div id="reqhistPager" class="d-flex justify-content-center gap-2"></div>
    </div>
  </div>

  <!-- 품목 등록 모달 -->
  <div class="modal fade" id="itemModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">품목 등록</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="row g-2">
        <div class="col"><label class="form-label small mb-0">품목명 *</label><input id="it-name" class="form-control form-control-sm"></div>
        <div class="col"><label class="form-label small mb-0">카테고리 *</label>
          <input id="it-cat" class="form-control form-control-sm" list="catList" placeholder="PC소모품/PC/케이블">
          <datalist id="catList"><option>PC소모품</option><option>PC</option><option>케이블</option><option>기타 소모품</option><option>태블릿</option></datalist></div>
      </div>
      <div class="row g-2 mt-0">
        <div class="col"><label class="form-label small mb-0">현재재고 *</label><input id="it-stock" type="number" class="form-control form-control-sm" value="0"></div>
        <div class="col"><label class="form-label small mb-0">최소재고 *</label><input id="it-min" type="number" class="form-control form-control-sm" value="0"></div>
        <div class="col"><label class="form-label small mb-0">단위 *</label><input id="it-unit" class="form-control form-control-sm" value="개"></div>
      </div>
      <div class="mb-2 mt-1"><label class="form-label small mb-0">비고</label><input id="it-remark" class="form-control form-control-sm"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button><button class="btn btn-primary btn-sm" onclick="createItem()">등록</button></div>
  </div></div></div>

  <!-- 입고 모달 -->
  <div class="modal fade" id="inboundModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="inboundTitle">입고 등록</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="in-itemId">
      <div class="mb-2"><label class="form-label small mb-0">입고 수량 *</label><input id="in-qty" type="number" class="form-control form-control-sm"></div>
      <div class="mb-2"><label class="form-label small mb-0">입고 담당자 *</label><input id="in-by" class="form-control form-control-sm"></div>
      <div class="mb-2"><label class="form-label small mb-0">비고</label><input id="in-note" class="form-control form-control-sm"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button><button class="btn btn-primary btn-sm" onclick="inbound()">입고</button></div>
  </div></div></div>

  <!-- 지급 모달 -->
  <div class="modal fade" id="issueModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="issueTitle">소모품 지급</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="is-itemId">
      <div class="row g-2">
        <div class="col"><label class="form-label small mb-0">연결 요청 ID *</label><input id="is-req" type="number" class="form-control form-control-sm"></div>
        <div class="col"><label class="form-label small mb-0">지급 수량 *</label><input id="is-qty" type="number" class="form-control form-control-sm"></div>
      </div>
      <div class="row g-2 mt-0">
        <div class="col"><label class="form-label small mb-0">지급 대상자 *</label><input id="is-receiver" class="form-control form-control-sm"></div>
        <div class="col"><label class="form-label small mb-0">부서</label><input id="is-dept" class="form-control form-control-sm"></div>
      </div>
      <div class="row g-2 mt-0">
        <div class="col"><label class="form-label small mb-0">지급 담당자 *</label><input id="is-by" class="form-control form-control-sm"></div>
        <div class="col"><label class="form-label small mb-0">지급일</label><input id="is-at" type="date" class="form-control form-control-sm"></div>
      </div>
      <p class="text-muted small mt-2 mb-0">※ 지급 시 재고가 자동 차감됩니다. 재고 부족 시 등록이 거부됩니다.</p>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button><button class="btn btn-primary btn-sm" onclick="issue()">지급</button></div>
  </div></div></div>

  <!-- 이력 모달 -->
  <div class="modal fade" id="histModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="histTitle">이력</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="histBody"></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/kims.js"></script>
  <script>
    if (!KIMS.requireAuth()) { } else { KIMS.renderNav('inventory.html'); }
    const E = KIMS.escapeHtml;
    let itemModal, inboundModal, issueModal, histModal;
    let catCharts = [];
    // 분류 순서 / 색상
    const CAT_ORDER = ['PC소모품', 'PC', '케이블', '기타 소모품', '태블릿'];
    const CAT_COLOR = { 'PC소모품': '#0d6efd', 'PC': '#198754', '케이블': '#fd7e14', '기타 소모품': '#6f42c1', '태블릿': '#d63384' };

    // 재고 세부 구분(막대 색 분할): 신형/구형, 태블릿은 레노버/갤럭시/대여, 그 외 미구분
    const SEG_ORDER = ['신형', '구형', '레노버', '갤럭시', '대여', '미구분'];
    const SEG_COLOR = { '신형': '#0d6efd', '구형': '#adb5bd', '레노버': '#198754', '갤럭시': '#6f42c1', '대여': '#fd7e14', '미구분': '#20c997' };
    // 품목 비고에서 세부 수량 파싱 (예: "신형 5 / 구형 8", "레노버 1대 / 갤럭시 6대 / 대여 3대 ...")
    function itemBreakdown(it) {
      const r = it.remark || '';
      const sin = r.match(/신형\s*(\d+)/), gu = r.match(/구형\s*(\d+)/);
      if (sin || gu) return { '신형': sin ? +sin[1] : 0, '구형': gu ? +gu[1] : 0 };
      const le = r.match(/레노버\s*(\d+)/), ga = r.match(/갤럭시\s*(\d+)/), dae = r.match(/대여\s*(\d+)/);
      if (le || ga || dae) return { '레노버': le ? +le[1] : 0, '갤럭시': ga ? +ga[1] : 0, '대여': dae ? +dae[1] : 0 };
      return { '미구분': it.currentStock };
    }

    document.addEventListener('DOMContentLoaded', () => {
      itemModal = new bootstrap.Modal('#itemModal');
      inboundModal = new bootstrap.Modal('#inboundModal');
      issueModal = new bootstrap.Modal('#issueModal');
      histModal = new bootstrap.Modal('#histModal');
      showTab('dash');
    });

    // ---------- 탭 전환 ----------
    function showTab(t) {
      ['dash', 'inbound', 'issue', 'reqhist'].forEach(x => {
        document.getElementById('pane-' + x).style.display = (x === t) ? '' : 'none';
        document.getElementById('tab-' + x).classList.toggle('active', x === t);
      });
      if (t === 'dash') loadDashboard();
      if (t === 'inbound') loadInboundTab();
      if (t === 'issue') loadIssueTab();
      if (t === 'reqhist') loadReqHist();
    }

    const dateOnly = s => (s || '').substring(0, 10);

    // ================= 대시보드 =================
    async function loadDashboard() { loadStockChart(); loadSupplyRequests(); }

    // 대여 막대 클릭 → 배치처(대여처) 모달
    function showRentalDetail(it) {
      const r = it.remark || '';
      const m = r.match(/대여\s*(\d+)\s*대?\s*[(（]([^)）]*)[)）]/);
      const count = m ? m[1] : '';
      const dests = m ? m[2].split(/[,、]/).map(s => s.trim()).filter(Boolean) : [];
      const body = dests.length
        ? `<p class="mb-2"><b>${E(it.itemName)}</b> 대여 ${count}대 배치처</p>
           <ol class="mb-0 ps-3">${dests.map(d => `<li>${E(d)}</li>`).join('')}</ol>`
        : '<p class="mb-0 text-muted">대여 배치처 정보가 없습니다. (비고에 괄호로 기입하세요)</p>';
      KIMS.alertModal('🔗 대여 현황', body, 'info');
    }

    // 재고 현황 (분류별 3개 차트)
    async function loadStockChart() {
      try {
        const data = await KIMS.api('/kims-api/inventory-items?size=200');
        const items = (data.content || []).slice().sort((a, b) => a.itemId - b.itemId);
        document.getElementById('s-total').textContent = items.length;
        document.getElementById('s-low').textContent = items.filter(i => i.belowMinStock).length;
        document.getElementById('s-sum').textContent = items.reduce((a, i) => a + i.currentStock, 0);

        const box = document.getElementById('catCharts');
        box.innerHTML = '';
        catCharts.forEach(c => c.destroy()); catCharts = [];
        const cats = CAT_ORDER.concat([...new Set(items.map(i => i.category))].filter(c => !CAT_ORDER.includes(c)));

        cats.forEach((cat, idx) => {
          const its = items.filter(i => i.category === cat);
          if (!its.length) return;
          const catSum = its.reduce((a, i) => a + i.currentStock, 0);
          const h = Math.max(140, its.length * 32 + 20);
          const col = document.createElement('div');
          col.className = 'col-12 col-lg-4';
          col.innerHTML = `<div class="card h-100"><div class="card-body py-2">
            <h6 class="m-0 mb-1">${E(cat)} <span class="text-muted small">· ${its.length}종 / 재고 ${catSum}</span></h6>
            <div style="height:${h}px"><canvas id="cc${idx}"></canvas></div></div></div>`;
          box.appendChild(col);
          // 품목별 세부 구분 → 세그먼트별 누적 데이터셋 구성
          const bds = its.map(itemBreakdown);
          const present = SEG_ORDER.filter(k => bds.some(b => (b[k] || 0) > 0));
          const segs = present.length ? present : ['미구분'];
          const datasets = segs.map(k => ({
            label: k, data: bds.map(b => b[k] || 0),
            backgroundColor: SEG_COLOR[k] || (CAT_COLOR[cat] || '#6c757d'),
            stack: 'stock', borderWidth: 0, barThickness: 18
          }));
          const showLegend = !(segs.length === 1 && segs[0] === '미구분');   // 구분 없는 분류는 범례 숨김
          catCharts.push(new Chart(document.getElementById('cc' + idx), {
            type: 'bar',
            data: { labels: its.map(i => i.itemName), datasets },
            options: {
              indexAxis: 'y', maintainAspectRatio: false,
              interaction: { mode: 'index', axis: 'y', intersect: false },
              onClick: (evt, els) => {
                if (!els.length) return;
                const el = els.find(e => datasets[e.datasetIndex].label === '대여') || els[0];
                if (datasets[el.datasetIndex].label === '대여') showRentalDetail(its[el.index]);
              },
              onHover: (evt, els) => {
                const over = els.some(e => datasets[e.datasetIndex].label === '대여');
                evt.native.target.style.cursor = over ? 'pointer' : 'default';
              },
              plugins: {
                legend: { display: showLegend, position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } },
                tooltip: {
                  filter: (c) => c.parsed.x > 0,
                  callbacks: {
                    label: (c) => (c.dataset.label === '미구분' ? '재고' : c.dataset.label)
                                  + ' ' + c.parsed.x + (its[c.dataIndex].unit || ''),
                    footer: (items) => items.length ? ('합계 ' + items.reduce((a, i) => a + i.parsed.x, 0)) : ''
                  }
                }
              },
              scales: { x: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }, y: { stacked: true } }
            }
          }));
        });
      } catch (e) { /* 차트는 보조 정보 */ }
    }

    // 신규 지급 요청 목록 (전산소모품 지급 · 접수)
    async function loadSupplyRequests() {
      const tb = document.getElementById('supplyReqRows');
      try {
        const data = await KIMS.api('/kims-api/requests?requestType=SUPPLY&status=RECEIVED&size=100');
        const list = data.content || [];
        document.getElementById('sr-cnt').textContent = list.length;
        tb.innerHTML = list.length ? list.map(r => `
          <tr>
            <td><b>${E(r.requestNo)}</b> ${r.urgent ? '<span class="badge bg-danger">긴급</span>' : ''}</td>
            <td>${E(r.requesterName)}</td><td>${E(r.department)}</td>
            <td class="text-truncate" style="max-width:380px">${E(r.contentSummary)}</td>
            <td>${dateOnly((r.createdAt || '').replace('T', ' '))}</td>
            <td><a class="btn btn-outline-primary btn-sm py-0" href="request.html">처리</a></td>
          </tr>`).join('')
          : '<tr><td colspan="6" class="text-center text-muted">신규 지급 요청이 없습니다. 👍</td></tr>';
      } catch (e) { tb.innerHTML = '<tr><td colspan="6" class="text-center text-danger">불러오기 실패</td></tr>'; }
    }

    // ================= 공통: 품목 목록 =================
    async function fetchItems(keyword) {
      const p = new URLSearchParams(); p.set('size', '200');
      if (keyword) p.set('keyword', keyword);
      const data = await KIMS.api('/kims-api/inventory-items?' + p.toString());
      return (data.content || []).slice().sort((a, b) => a.itemId - b.itemId);
    }

    // ================= 입고 내역 탭 =================
    async function loadInboundTab() {
      const tb = document.getElementById('inboundRows');
      try {
        const items = await fetchItems(document.getElementById('in-keyword').value.trim());
        // 품목별 최근 입고(INBOUND) 1건
        const txLists = await Promise.all(items.map(i => KIMS.api('/kims-api/inventory-items/' + i.itemId + '/transactions').catch(() => [])));
        tb.innerHTML = items.length ? items.map((r, idx) => {
          const ins = (txLists[idx] || []).filter(t => t.transactionType === 'INBOUND')
            .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
          const last = ins[0];
          const lastTxt = last
            ? `${dateOnly(last.createdAt)} · <span class="text-success">+${last.quantity}</span> · ${E(last.createdBy || '')}`
            : '<span class="text-muted">입고 내역 없음</span>';
          return `<tr class="${r.belowMinStock ? 'table-danger' : ''}">
            <td><b>${E(r.itemName)}</b></td><td>${E(r.category)}</td>
            <td>${r.currentStock} ${r.belowMinStock ? '<span class="badge bg-danger">부족</span>' : ''}</td>
            <td>${E(r.unit)}</td><td>${lastTxt}</td>
            <td>
              <button class="btn btn-outline-success btn-sm py-0" onclick="openInbound(${r.itemId},'${E(r.itemName)}')">입고</button>
              <button class="btn btn-outline-secondary btn-sm py-0" onclick="showInboundHist(${r.itemId},'${E(r.itemName)}')">이력</button>
            </td></tr>`;
        }).join('') : '<tr><td colspan="6" class="text-center text-muted">데이터가 없습니다.</td></tr>';
      } catch (e) { tb.innerHTML = '<tr><td colspan="6" class="text-center text-danger">불러오기 실패</td></tr>'; }
    }

    // ================= 지급 내역 탭 =================
    async function loadIssueTab() {
      const tb = document.getElementById('issueRows');
      try {
        const [items, issuesData] = await Promise.all([
          fetchItems(document.getElementById('is-keyword').value.trim()),
          KIMS.api('/kims-api/supply-issues?size=500')
        ]);
        const issues = issuesData.content || [];
        // 품목별 최신 지급 1건
        const lastByItem = {};
        issues.forEach(s => {
          const cur = lastByItem[s.itemId];
          if (!cur || (s.issuedAt || '') > (cur.issuedAt || '')) lastByItem[s.itemId] = s;
        });
        tb.innerHTML = items.length ? items.map(r => {
          const last = lastByItem[r.itemId];
          const lastTxt = last
            ? `${E(last.issuedAt)} · <span class="text-primary">-${last.quantity}</span> · ${E(last.receiverName || '')}`
            : '<span class="text-muted">지급 내역 없음</span>';
          return `<tr class="${r.belowMinStock ? 'table-danger' : ''}">
            <td><b>${E(r.itemName)}</b></td><td>${E(r.category)}</td>
            <td>${r.currentStock} ${r.belowMinStock ? '<span class="badge bg-danger">부족</span>' : ''}</td>
            <td>${E(r.unit)}</td><td>${lastTxt}</td>
            <td>
              <button class="btn btn-outline-primary btn-sm py-0" onclick="openIssue(${r.itemId},'${E(r.itemName)}')">지급</button>
              <button class="btn btn-outline-secondary btn-sm py-0" onclick="showIssueHist(${r.itemId},'${E(r.itemName)}')">이력</button>
            </td></tr>`;
        }).join('') : '<tr><td colspan="6" class="text-center text-muted">데이터가 없습니다.</td></tr>';
      } catch (e) { tb.innerHTML = '<tr><td colspan="6" class="text-center text-danger">불러오기 실패</td></tr>'; }
    }

    // ================= 이력 모달 =================
    // 입고 이력 (INBOUND 만)
    async function showInboundHist(id, name) {
      try {
        const list = (await KIMS.api('/kims-api/inventory-items/' + id + '/transactions'))
          .filter(t => t.transactionType === 'INBOUND')
          .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        document.getElementById('histTitle').textContent = '입고 이력 - ' + name;
        document.getElementById('histBody').innerHTML = list.length ? `
          <table class="table table-sm table-bordered"><thead class="table-light"><tr>
            <th>일시</th><th>입고수량</th><th>변동전</th><th>변동후</th><th>입고담당자</th><th>비고</th></tr></thead><tbody>
          ${list.map(t => `<tr><td>${(t.createdAt || '').substring(0, 19).replace('T', ' ')}</td>
            <td class="text-success">+${t.quantity}</td><td>${t.beforeStock}</td><td>${t.afterStock}</td>
            <td>${E(t.createdBy)}</td><td>${E(t.note)}</td></tr>`).join('')}
          </tbody></table>` : '<p class="text-muted">입고 이력이 없습니다.</p>';
        histModal.show();
      } catch (e) { KIMS.toast(e.message, false); }
    }

    // 지급 이력 (해당 품목 지급 내역)
    async function showIssueHist(id, name) {
      try {
        const data = await KIMS.api('/kims-api/supply-issues?itemId=' + id + '&size=500');
        const list = (data.content || []).sort((a, b) => (b.issuedAt || '').localeCompare(a.issuedAt || ''));
        document.getElementById('histTitle').textContent = '지급 이력 - ' + name;
        document.getElementById('histBody').innerHTML = list.length ? `
          <table class="table table-sm table-bordered"><thead class="table-light"><tr>
            <th>지급일</th><th>수량</th><th>대상자</th><th>부서</th><th>지급담당자</th><th>요청번호</th></tr></thead><tbody>
          ${list.map(s => `<tr><td>${E(s.issuedAt)}</td><td class="text-primary">-${s.quantity}</td>
            <td>${E(s.receiverName)}</td><td>${E(s.department)}</td><td>${E(s.issuedBy)}</td><td>${E(s.requestNo)}</td></tr>`).join('')}
          </tbody></table>` : '<p class="text-muted">지급 이력이 없습니다.</p>';
        histModal.show();
      } catch (e) { KIMS.toast(e.message, false); }
    }

    // ================= 품목 등록 / 입고 / 지급 =================
    function openItemCreate() {
      ['it-name', 'it-cat', 'it-remark'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('it-stock').value = 0; document.getElementById('it-min').value = 0; document.getElementById('it-unit').value = '개';
      itemModal.show();
    }
    async function createItem() {
      const payload = { itemName: document.getElementById('it-name').value.trim(), category: document.getElementById('it-cat').value.trim(),
        currentStock: Number(document.getElementById('it-stock').value), minStock: Number(document.getElementById('it-min').value),
        unit: document.getElementById('it-unit').value.trim(), remark: document.getElementById('it-remark').value.trim() };
      if (!payload.itemName || !payload.category || !payload.unit) { KIMS.toast('품목명/카테고리/단위는 필수입니다.', false); return; }
      try { await KIMS.api('/kims-api/inventory-items', { method: 'POST', body: payload }); KIMS.toast('등록되었습니다.'); itemModal.hide(); loadInboundTab(); }
      catch (e) { KIMS.toast(e.message, false); }
    }

    function openInbound(id, name) {
      document.getElementById('inboundTitle').textContent = '입고 등록 - ' + name;
      document.getElementById('in-itemId').value = id;
      document.getElementById('in-qty').value = ''; document.getElementById('in-note').value = '';
      document.getElementById('in-by').value = KIMS.getUser() || '';
      inboundModal.show();
    }
    async function inbound() {
      const id = document.getElementById('in-itemId').value;
      const payload = { quantity: Number(document.getElementById('in-qty').value), createdBy: document.getElementById('in-by').value.trim(), note: document.getElementById('in-note').value.trim() };
      if (!payload.quantity || payload.quantity <= 0 || !payload.createdBy) { KIMS.toast('수량(1+)과 담당자는 필수입니다.', false); return; }
      try { await KIMS.api('/kims-api/inventory-items/' + id + '/inbound', { method: 'POST', body: payload }); KIMS.toast('입고되었습니다.'); inboundModal.hide(); loadInboundTab(); }
      catch (e) { KIMS.toast(e.message, false); }
    }

    function openIssue(id, name) {
      document.getElementById('issueTitle').textContent = '소모품 지급 - ' + name;
      document.getElementById('is-itemId').value = id;
      ['is-req', 'is-qty', 'is-receiver', 'is-dept'].forEach(x => document.getElementById(x).value = '');
      document.getElementById('is-by').value = KIMS.getUser() || '';
      document.getElementById('is-at').value = new Date().toISOString().substring(0, 10);
      issueModal.show();
    }
    async function issue() {
      const payload = { itemId: Number(document.getElementById('is-itemId').value), requestId: Number(document.getElementById('is-req').value),
        quantity: Number(document.getElementById('is-qty').value), receiverName: document.getElementById('is-receiver').value.trim(),
        department: document.getElementById('is-dept').value.trim(), issuedBy: document.getElementById('is-by').value.trim(),
        issuedAt: document.getElementById('is-at').value || null };
      if (!payload.requestId || !payload.quantity || !payload.receiverName || !payload.issuedBy) { KIMS.toast('요청ID/수량/대상자/담당자는 필수입니다.', false); return; }
      try {
        // 재고 사전 검사 — 부족하면 지급하지 않고 모달로 안내
        const item = await KIMS.api('/kims-api/inventory-items/' + payload.itemId);
        if (payload.quantity > item.currentStock) { showShortage(item, payload.quantity); return; }
        await KIMS.api('/kims-api/supply-issues', { method: 'POST', body: payload });
        KIMS.toast('지급되었습니다. (재고 차감)'); issueModal.hide(); loadIssueTab(); loadStockChart && loadStockChart();
      } catch (e) {
        if ((e.message || '').includes('재고가 부족')) KIMS.alertModal('⚠ 재고 부족', E(e.message));
        else KIMS.toast(e.message, false);
      }
    }

    // 재고 부족 안내 모달 (부족 수량 명시)
    function showShortage(item, requested) {
      const short = requested - item.currentStock;
      KIMS.alertModal('⚠ 재고 부족',
        `<b>${E(item.itemName)}</b> 재고가 부족하여 지급할 수 없습니다.<br><br>` +
        `<table class="table table-sm mb-0"><tbody>` +
        `<tr><td>현재 재고</td><td class="text-end fw-bold">${item.currentStock} ${E(item.unit||'')}</td></tr>` +
        `<tr><td>요청 수량</td><td class="text-end fw-bold">${requested} ${E(item.unit||'')}</td></tr>` +
        `<tr class="table-danger"><td>부족 수량</td><td class="text-end fw-bold text-danger">${short} ${E(item.unit||'')}</td></tr>` +
        `</tbody></table>`);
    }

    async function downloadIssueExcel() {
      try { await KIMS.download('/kims-api/supply-issues/excel', 'supply_issues.xlsx'); }
      catch (e) { KIMS.toast(e.message, false); }
    }

    // ================= 소모품 업무요청 이력 탭 =================
    // 업무요청 목록과 동일한 스타일 + '요청 소모품' 컬럼(지급된 품목) — 전산소모품 지급(SUPPLY)만
    let rhPage = 0; const rhSize = 20;
    const RH_STATUS = { RECEIVED:'접수', IN_PROGRESS:'처리중', ON_HOLD:'보류', COMPLETED:'완료', REJECTED:'반려', CANCELED:'취소' };
    const RH_SB = { RECEIVED:'bg-secondary', IN_PROGRESS:'bg-info', ON_HOLD:'bg-warning text-dark', COMPLETED:'bg-success', REJECTED:'bg-danger', CANCELED:'bg-dark' };
    let rhStatusFilled = false;

    function resetReqHist() {
      ['rh-from','rh-to','rh-requester','rh-dept','rh-assignee'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('rh-status').value = '';
      rhPage = 0; loadReqHist();
    }

    async function loadReqHist() {
      if (!rhStatusFilled) {
        document.getElementById('rh-status').innerHTML = '<option value="">전체</option>' +
          Object.entries(RH_STATUS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
        rhStatusFilled = true;
      }
      const tb = document.getElementById('reqhistRows');
      try {
        const p = new URLSearchParams();
        const g = id => document.getElementById(id).value.trim();
        p.set('requestType', 'SUPPLY');                       // 소모품 지급 요청만
        if (g('rh-from')) p.set('from', g('rh-from') + 'T00:00:00');
        if (g('rh-to'))   p.set('to',   g('rh-to')   + 'T23:59:59');
        if (document.getElementById('rh-status').value) p.set('status', document.getElementById('rh-status').value);
        if (g('rh-requester')) p.set('requester', g('rh-requester'));
        if (g('rh-dept'))      p.set('department', g('rh-dept'));
        if (g('rh-assignee'))  p.set('assignee', g('rh-assignee'));
        p.set('page', rhPage); p.set('size', rhSize);

        // 요청 목록 + 지급내역(요청별 품목) 동시 조회
        const [reqData, issuesData] = await Promise.all([
          KIMS.api('/kims-api/requests?' + p.toString()),
          KIMS.api('/kims-api/supply-issues?size=500')
        ]);
        // 요청ID -> "품목 수량" 목록
        const itemsByReq = {};
        (issuesData.content || []).forEach(s => {
          (itemsByReq[s.requestId] = itemsByReq[s.requestId] || []).push(`${s.itemName} ${s.quantity}`);
        });

        const list = reqData.content || [];
        tb.innerHTML = list.length ? list.map(r => {
          const items = itemsByReq[r.requestId];
          const itemsTxt = items && items.length
            ? items.map(E).join(', ')
            : '<span class="text-muted">미지급</span>';
          return `<tr>
            <td><b>${E(r.requestNo)}</b> ${r.urgent?'<span class="badge bg-danger">긴급</span>':''}</td>
            <td>${dateOnly(r.createdAt)}</td><td>${E(r.requesterName)}</td><td>${E(r.department)}</td>
            <td><span class="badge ${RH_SB[r.status]||'bg-secondary'}">${E(r.statusLabel)}</span></td>
            <td>${E(r.assignee)}</td>
            <td>${itemsTxt}</td>
            <td><a class="btn btn-outline-secondary btn-sm py-0" href="request.html?open=${r.requestId}">상세</a></td>
          </tr>`;
        }).join('') : '<tr><td colspan="8" class="text-center text-muted">해당 조건의 소모품 요청이 없습니다.</td></tr>';
        renderReqHistPager(reqData);
      } catch (e) { tb.innerHTML = '<tr><td colspan="8" class="text-center text-danger">불러오기 실패</td></tr>'; }
    }

    function renderReqHistPager(d) {
      const pg = document.getElementById('reqhistPager'); const cur = d.page, total = d.totalPages;
      pg.innerHTML = `<button class="btn btn-sm btn-outline-secondary" ${cur<=0?'disabled':''} onclick="rhPage=${cur-1};loadReqHist()">이전</button>
        <span class="align-self-center small">${total===0?0:cur+1} / ${total} (총 ${d.totalElements}건)</span>
        <button class="btn btn-sm btn-outline-secondary" ${cur>=total-1?'disabled':''} onclick="rhPage=${cur+1};loadReqHist()">다음</button>`;
    }
  </script>
</body>
</html>
