<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIMS - 관리자 대시보드</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 오늘 접수 건이 있을 때 카드 강조 (빨간 테두리 펄스) */
    @keyframes kimsPulse {
      0%   { box-shadow: 0 0 0 0 rgba(220,53,69,.65); }
      70%  { box-shadow: 0 0 0 10px rgba(220,53,69,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,53,69,0); }
    }
    #card-today.today-alert { outline: 3px solid #dc3545; animation: kimsPulse 1.5s ease-out infinite; cursor: pointer; }
    #card-today.today-alert:hover { filter: brightness(1.08); }
    #today-bang { display: inline-block; animation: kimsBang .8s ease-in-out infinite; }
    @keyframes kimsBang { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>
</head>
<body class="bg-light">
  <div id="nav"></div>
  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="m-0">관리자 대시보드</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadDashboard()">새로고침</button>
    </div>

    <div id="msg" class="alert d-none" role="alert"></div>

    <!-- 상단 카드 -->
    <div class="row g-3 mb-3">
      <div class="col-6 col-md"><div class="card text-bg-primary" id="card-today" onclick="openTodayModal()"><div class="card-body py-3">
        <div class="small">오늘 접수 <span id="today-bang" class="d-none fw-bold">❗</span></div>
        <div class="fs-3 fw-bold" id="c-today">-</div>
        <div class="small opacity-75" id="today-hint" style="display:none">클릭하여 접수 내역 보기 ›</div></div></div></div>
      <div class="col-6 col-md"><div class="card text-bg-info"><div class="card-body py-3">
        <div class="small">처리중</div><div class="fs-3 fw-bold" id="c-prog">-</div></div></div></div>
      <div class="col-6 col-md"><div class="card text-bg-warning"><div class="card-body py-3">
        <div class="small">보류</div><div class="fs-3 fw-bold" id="c-hold">-</div></div></div></div>
      <div class="col-6 col-md"><div class="card text-bg-success"><div class="card-body py-3">
        <div class="small">완료</div><div class="fs-3 fw-bold" id="c-done">-</div></div></div></div>
      <div class="col-6 col-md"><div class="card text-bg-dark"><div class="card-body py-3">
        <div class="small">전체 요청</div><div class="fs-3 fw-bold" id="c-total">-</div></div></div></div>
    </div>

    <!-- 차트 -->
    <div class="row g-3 mb-3">
      <div class="col-md-7"><div class="card h-100"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <h6 class="card-title m-0">월별 접수 건수
            <small class="text-muted">(막대를 클릭하면 우측 유형 차트가 해당 월로 바뀝니다)</small></h6>
          <select id="yearSel" class="form-select form-select-sm" style="width:auto" onchange="onYearChange()"></select>
        </div>
        <canvas id="chartMonthly" height="110"></canvas>
      </div></div></div>
      <div class="col-md-5"><div class="card h-100"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <h6 class="card-title m-0">요청유형별 건수</h6>
          <span class="badge bg-secondary" id="typeScope">전체</span>
        </div>
        <canvas id="chartType" height="110"></canvas>
      </div></div></div>
    </div>

    <!-- 알림 -->
    <div class="row g-3 mb-3">
      <div class="col-md-6"><div class="card h-100 border-danger"><div class="card-body">
        <h6 class="card-title text-danger">⚠ 소모품 재고 부족 <span class="badge bg-danger" id="c-low">0</span></h6>
        <div id="lowStock" class="small"></div>
      </div></div></div>
      <div class="col-md-6"><div class="card h-100 border-warning"><div class="card-body">
        <h6 class="card-title text-warning">⚠ 미품의 IP 변경 <span class="badge bg-warning text-dark" id="c-unapp">0</span></h6>
        <div id="unapproved" class="small"></div>
      </div></div></div>
    </div>

    <!-- 최근 요청 -->
    <div class="card mb-4"><div class="card-body">
      <h6 class="card-title">최근 요청 목록</h6>
      <div class="table-responsive">
        <table class="table table-sm table-bordered align-middle mb-0">
          <thead class="table-light"><tr>
            <th>요청번호</th><th>요청일</th><th>요청자</th><th>부서</th><th>유형</th><th>상태</th><th>담당자</th>
          </tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </div></div>
  </div>

  <!-- 오늘 접수 내역 모달 -->
  <div class="modal fade" id="todayModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">오늘 접수 내역 <span class="badge bg-primary" id="today-modal-cnt">0</span></h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body" id="today-modal-body" style="max-height:65vh; overflow-y:auto"></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/kims.js"></script>
  <script>
    if (!KIMS.requireAuth()) { /* redirect */ } else { KIMS.renderNav('dashboard.html'); }
    const E = KIMS.escapeHtml;
    let monthlyChart, typeChart;
    let currentYear = null;            // 현재 선택된 연도
    let lastMonthly = [];              // 현재 연도의 월별 데이터(라벨용)
    let todayModal, todayCount = 0;    // 오늘 접수 모달 / 건수

    document.addEventListener('DOMContentLoaded', () => {
      todayModal = new bootstrap.Modal('#todayModal');
      loadDashboard();
    });
    // 뒤로가기/bfcache 복원 시 최신 집계 재조회
    window.addEventListener('pageshow', (e) => { if (e.persisted) loadDashboard(); });
    // 다른 탭/화면에서 처리 후 홈 탭으로 돌아오면 자동 갱신
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadDashboard(); });

    async function loadDashboard() {
      try {
        const d = await KIMS.api('/kims-api/dashboard');
        // 카드
        document.getElementById('c-today').textContent = d.todayReceived;
        // 오늘 접수가 1건 이상이면 카드 강조(느낌표 + 펄스 + 클릭 안내)
        todayCount = (d.todayReceived || 0);
        const hasToday = todayCount > 0;
        document.getElementById('card-today').classList.toggle('today-alert', hasToday);
        document.getElementById('today-bang').classList.toggle('d-none', !hasToday);
        document.getElementById('today-hint').style.display = hasToday ? '' : 'none';
        document.getElementById('c-prog').textContent = d.inProgress;
        document.getElementById('c-hold').textContent = d.onHold;
        document.getElementById('c-done').textContent = d.completed;
        document.getElementById('c-total').textContent = d.totalRequests;
        // 연도 셀렉트 채우기
        currentYear = d.year;
        const sel = document.getElementById('yearSel');
        sel.innerHTML = (d.years || [d.year]).map(y => `<option value="${y}" ${y===d.year?'selected':''}>${y}년</option>`).join('');
        // 차트
        drawMonthly(d.monthly);
        drawType(d.byType);
        setTypeScope(currentYear + '년 전체');
        // 알림
        renderLowStock(d.lowStockItems, d.lowStockCount);
        renderUnapproved(d.unapprovedIpChanges, d.unapprovedIpCount);
        // 최근 요청
        renderRecent(d.recentRequests);
      } catch (e) {
        KIMS.toast(e.message + ' (대시보드는 ADMIN/STAFF 권한이 필요합니다)', false);
      }
    }

    function setTypeScope(text) { document.getElementById('typeScope').textContent = text; }

    // ---- 오늘 접수 내역 모달 ----
    // 유형별 이동 대상: 소모품→소모품탭, IP→IP관리, 그 외→업무요청 상세
    const WORK_ROUTE = {
      SUPPLY:   { label: '소모품 지급', go: () => location.href = 'inventory.html' },
      IP:       { label: 'IP 관리',    go: () => location.href = 'ip.html' },
      PROGRAM:  { label: '요청 처리',  go: (id) => location.href = 'request.html?open=' + id },
      INTERNET: { label: '요청 처리',  go: (id) => location.href = 'request.html?open=' + id },
      DEFAULT:  { label: '요청 처리',  go: (id) => location.href = 'request.html?open=' + id },
    };
    function goToWork(type, id) {
      const r = WORK_ROUTE[type] || WORK_ROUTE.DEFAULT;
      r.go(id);
    }
    async function openTodayModal() {
      if (!todayCount) return;                     // 접수 0건이면 무시
      const n = new Date();
      const ymd = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
      try {
        const data = await KIMS.api('/kims-api/requests?from=' + ymd + 'T00:00:00&to=' + ymd + 'T23:59:59&size=100');
        const list = data.content || [];
        document.getElementById('today-modal-cnt').textContent = list.length;
        const body = document.getElementById('today-modal-body');
        if (!list.length) { body.innerHTML = '<p class="text-muted mb-0">오늘 접수된 요청이 없습니다.</p>'; }
        else {
          body.innerHTML = `<table class="table table-sm table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>시간</th><th>요청번호</th><th>요청자</th><th>유형</th><th>상태</th><th style="width:110px">바로가기</th></tr></thead>
            <tbody>${list.map(r => {
              const t = (r.createdAt||'').substring(11,16);
              const route = WORK_ROUTE[r.requestType] || WORK_ROUTE.DEFAULT;
              return `<tr>
                <td>${t}</td>
                <td><b>${E(r.requestNo)}</b> ${r.urgent?'<span class="badge bg-danger">긴급</span>':''}</td>
                <td>${E(r.requesterName)}<div class="small text-muted">${E(r.department)}</div></td>
                <td>${E(r.requestTypeLabel)}</td>
                <td>${statusBadge(r.status, r.statusLabel)}</td>
                <td><button class="btn btn-sm btn-primary py-0" onclick="goToWork('${r.requestType}',${r.requestId})">${route.label} ›</button></td>
              </tr>`;
            }).join('')}</tbody></table>`;
        }
        todayModal.show();
      } catch (e) { KIMS.toast(e.message, false); }
    }

    // 연도 변경 → 월별 차트 + 도넛(해당 연도 전체) 갱신
    async function onYearChange() {
      currentYear = parseInt(document.getElementById('yearSel').value, 10);
      try {
        const monthly = await KIMS.api('/kims-api/dashboard/monthly?year=' + currentYear);
        drawMonthly(monthly);
        const byType = await KIMS.api('/kims-api/dashboard/by-type?year=' + currentYear);
        drawType(byType);
        setTypeScope(currentYear + '년 전체');
      } catch (e) { KIMS.toast(e.message, false); }
    }

    // 월 막대 클릭 → 도넛을 해당 월의 유형 분포로 갱신
    async function onMonthClick(index) {
      const month = index + 1;
      try {
        const byType = await KIMS.api('/kims-api/dashboard/by-type?year=' + currentYear + '&month=' + month);
        drawType(byType);
        setTypeScope(currentYear + '-' + String(month).padStart(2, '0'));
      } catch (e) { KIMS.toast(e.message, false); }
    }

    function drawMonthly(monthly) {
      lastMonthly = monthly;
      const labels = monthly.map(m => (parseInt(m.month.substring(5,7),10)) + '월');
      const data = monthly.map(m => m.count);
      if (monthlyChart) monthlyChart.destroy();
      monthlyChart = new Chart(document.getElementById('chartMonthly'), {
        type: 'bar',
        data: { labels, datasets: [{ label: '접수 건수', data, backgroundColor: '#0d6efd' }] },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          onClick: (evt, elements) => { if (elements && elements.length) onMonthClick(elements[0].index); }
        }
      });
    }

    function drawType(byType) {
      const labels = byType.map(t => t.label);
      const data = byType.map(t => t.count);
      if (typeChart) typeChart.destroy();
      typeChart = new Chart(document.getElementById('chartType'), {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: ['#0d6efd','#6610f2','#20c997','#fd7e14','#dc3545','#6c757d'] }] },
        options: { plugins: { legend: { position: 'right' } } }
      });
    }

    function renderLowStock(items, count) {
      document.getElementById('c-low').textContent = count;
      const box = document.getElementById('lowStock');
      box.innerHTML = (items && items.length)
        ? '<ul class="mb-0">' + items.map(i => `<li>${E(i.itemName)} — 현재 ${i.currentStock} / 최소 ${i.minStock} ${E(i.unit)}</li>`).join('') + '</ul>'
        : '<span class="text-success">재고 부족 품목이 없습니다. 👍</span>';
    }

    function renderUnapproved(list, count) {
      document.getElementById('c-unapp').textContent = count;
      const box = document.getElementById('unapproved');
      box.innerHTML = (list && list.length)
        ? '<ul class="mb-0">' + list.slice(0,8).map(h => `<li>${E(h.ipAddress)} — ${E(h.changeTypeLabel)} (${E(h.changedBy)})</li>`).join('') + '</ul>'
        : '<span class="text-success">미품의 변경 내역이 없습니다. 👍</span>';
    }

    function statusBadge(s, label) {
      const m = { RECEIVED:'bg-secondary', IN_PROGRESS:'bg-info', ON_HOLD:'bg-warning text-dark', COMPLETED:'bg-success', REJECTED:'bg-danger', CANCELED:'bg-dark' };
      return `<span class="badge ${m[s]||'bg-secondary'}">${E(label)}</span>`;
    }

    function renderRecent(list) {
      const tb = document.getElementById('recent');
      tb.innerHTML = (list && list.length) ? list.map(r => `
        <tr>
          <td>${E(r.requestNo)}</td><td>${(r.createdAt||'').substring(0,10)}</td>
          <td>${E(r.requesterName)}</td><td>${E(r.department)}</td>
          <td>${E(r.requestTypeLabel)}</td><td>${statusBadge(r.status, r.statusLabel)}</td><td>${E(r.assignee)}</td>
        </tr>`).join('') : '<tr><td colspan="7" class="text-center text-muted">요청이 없습니다.</td></tr>';
    }
  </script>
</body>
</html>
