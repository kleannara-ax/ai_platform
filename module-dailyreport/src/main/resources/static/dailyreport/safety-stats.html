<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세부공장일보 — 사고 통계</title>
  <style>
    :root {
      --bg:#eef2f7;
      --panel:#ffffff;
      --text:#111827;
      --muted:#64748b;
      --line:#cbd5e1;
      --blue:#2563eb;
      --blue-soft:#dbeafe;
      --blue-hover:#e9f2ff;
      --yellow-soft:#fef9c3;
      --yellow-hover:#fef3c7;
      --ok:#16a34a;
      --warn:#b45309;
      --disabled:#f3f4f6;
      --shadow:0 14px 36px rgba(15,23,42,.08);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Malgun Gothic",sans-serif; }

    /* ── 앱 쉘 (index.html과 동일 패턴 재사용) ── */
    .app-shell { min-height:100vh; display:flex; flex-direction:column; }
    /* ★★ 2026-09 — index.html과 동일하게 이 iframe 내부 topbar는 화면에 그리지 않는다.
       툴바는 부모(AI Platform App Shell)의 상단 타이틀 옆으로 이동되어 그곳에서
       렌더링된다. 요소 id/로직은 그대로 유지한 채 화면에서만 숨긴다. */
    .topbar { display:none; }
    .topbar-title { font-size:18px; font-weight:800; }
    .topbar-subtitle { font-size:12px; color:var(--muted); margin-top:2px; }
    .topbar-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .user-chip { border:1px solid #bfdbfe; background:#eff6ff; color:#1d4ed8; border-radius:999px; padding:8px 12px; font-size:13px; font-weight:700; }
    .date-chip { border:1px solid #e2e8f0; background:#fff; color:#334155; border-radius:999px; padding:8px 12px; font-size:12px; font-weight:700; }
    .save-chip.idle { background:#fff; color:#475569; border-color:#cbd5e1; }
    .save-chip.dirty { background:#fff7ed; color:#9a3412; border-color:#fdba74; }
    .save-chip.saved { background:#ecfdf5; color:#166534; border-color:#86efac; }
    .toolbar-btn { border:1px solid #cbd5e1; background:#fff; color:#0f172a; border-radius:10px; padding:9px 12px; font-size:13px; font-weight:800; cursor:pointer; transition:background .15s; }
    .toolbar-btn:hover { background:#f1f5f9; }
    .toolbar-btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    .toolbar-btn.primary:hover { background:#1d4ed8; }
    .toolbar-btn.refresh { background:#f0fdf4; color:#166534; border-color:#86efac; }
    .toolbar-btn.refresh:hover { background:#dcfce7; }
    .toolbar-btn:disabled { opacity:.6; cursor:wait; }
    .btn-spinner { display:inline-block; width:11px; height:11px; margin-right:5px; border:2px solid rgba(15,23,42,.25); border-top-color:currentColor; border-radius:50%; vertical-align:middle; animation:btn-spin .6s linear infinite; }
    @keyframes btn-spin { to { transform:rotate(360deg); } }

    /* ── 커스텀 확인 모달 (index.html과 동일, 라디오 그룹 없이 단순 확인만 사용) ── */
    .confirm-modal-overlay { position:fixed; inset:0; z-index:10000; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .15s; }
    .confirm-modal-overlay.show { opacity:1; pointer-events:auto; }
    .confirm-modal-box { background:#fff; border-radius:16px; padding:28px 26px 20px; width:min(360px, calc(100vw - 40px)); box-shadow:0 20px 50px rgba(15,23,42,.25); text-align:center; transform:translateY(-10px) scale(.97); transition:transform .15s; }
    .confirm-modal-overlay.show .confirm-modal-box { transform:translateY(0) scale(1); }
    .confirm-modal-message { font-size:15px; font-weight:700; color:#0f172a; line-height:1.6; white-space:pre-line; }
    .confirm-modal-actions { display:flex; gap:10px; margin-top:22px; }
    .confirm-modal-btn { flex:1; min-height:42px; border-radius:10px; font-size:14px; font-weight:800; cursor:pointer; border:1px solid #cbd5e1; background:#fff; color:#334155; }
    .confirm-modal-btn:hover { background:#f1f5f9; }
    .confirm-modal-btn.confirm { background:var(--blue); color:#fff; border-color:var(--blue); }
    .confirm-modal-btn.confirm:hover { background:#1d4ed8; }

    /* ── 알림/범례 ── */
    .notice { width:min(1551px, calc(100vw - 32px)); margin:14px auto 0; padding:12px 14px; border-radius:14px; background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8; font-size:13px; font-weight:700; }
    .notice small { display:block; margin-top:4px; color:#4f6fb8; font-weight:600; line-height:1.55; }
    .legend { width:min(1551px, calc(100vw - 32px)); margin:12px auto 0; display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#475569; }
    .legend-item { display:flex; align-items:center; gap:8px; }
    .swatch { width:18px; height:18px; border-radius:6px; border:1px solid #cbd5e1; }
    .swatch.mine { background:var(--blue-soft); border-color:#60a5fa; }
    .swatch.auto { background:var(--yellow-soft); border-color:#eab308; }
    .swatch.locked { background:#f3f4f6; border-color:#d1d5db; }

    /* ── 리포트 테이블 (index.html과 동일) ── */
    .page-wrap { width:min(1551px, calc(100vw - 32px)); margin:14px auto 32px; }
    .sections-stack { display:flex; flex-direction:column; gap:16px; }
    .report-section { background:#fff; border:1px solid #d7dee8; border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
    .section-title { padding:12px 16px; border-bottom:1px solid #e5e7eb; background:linear-gradient(180deg,#ffffff 0%, #f8fafc 100%); font-size:18px; font-weight:800; color:#0f172a; white-space:normal; word-break:keep-all; }
    .section-table-wrap { padding:10px 12px 14px; overflow-x:auto; }
    .report-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    .cell { line-height:1.3; word-break:keep-all; }
    .table-cell { min-height:28px; }
    .wrap-cell { white-space:normal !important; word-break:keep-all; overflow-wrap:break-word; }
    .nowrap-cell { white-space:nowrap !important; }
    .cell.mine { background:var(--blue-soft) !important; box-shadow:inset 0 0 0 1px #60a5fa; }
    .cell.mine.auto-cell { background:var(--yellow-soft) !important; box-shadow:inset 0 0 0 1px #eab308; }
    .cell.locked { background:#f3f4f6 !important; color:#64748b !important; }
    .cell.hover-own:hover { background:var(--blue-hover) !important; }
    .cell.hover-own.auto-cell:hover { background:var(--yellow-hover) !important; }
    .cell-editor { width:100%; height:100%; display:flex; align-items:center; }
    .cell-input { width:100%; min-height:28px; line-height:1.3; border:0; outline:none; background:transparent; padding:0; margin:0; font:inherit; color:inherit; text-align:inherit; vertical-align:middle; box-sizing:border-box; }
    .cell-input:disabled { color:#94a3b8; cursor:not-allowed; }
    .cell-input:not(:placeholder-shown) { font-weight:800; }
    .cell-value { width:100%; min-height:28px; line-height:1.3; display:flex; align-items:center; box-sizing:border-box; }

    /* ── 로딩/에러 ── */
    .error-banner { width:min(1400px, calc(100vw - 32px)); margin:14px auto 0; padding:14px 18px; border-radius:14px; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; font-size:13px; font-weight:600; }

    /* ── 권한 없음 페이지 ── */
    .no-access { min-height:60vh; display:flex; align-items:center; justify-content:center; padding:32px; }
    .no-access-panel { text-align:center; max-width:500px; padding:40px; background:#fff; border-radius:18px; border:1px solid #d7dee8; box-shadow:var(--shadow); }
    .no-access-icon { font-size:48px; margin-bottom:16px; }
    .no-access-title { font-size:22px; font-weight:800; margin-bottom:12px; }
    .no-access-desc { font-size:14px; color:var(--muted); line-height:1.65; }

    /* ── 토스트 ── */
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff; padding:12px 16px; border-radius:999px; font-size:13px; font-weight:700; box-shadow:0 12px 24px rgba(15,23,42,.18); opacity:0; pointer-events:none; transition:all .18s ease; z-index:40; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── 날짜 선택 ── */
    .date-picker-wrap { display:flex; align-items:center; gap:8px; }
    .date-picker-wrap input[type="date"] { padding:8px 12px; border:1px solid #cbd5e1; border-radius:10px; font-size:13px; font-weight:700; background:#fff; outline:none; color:#334155; }
    .date-picker-wrap input[type="date"]:focus { border-color:#93c5fd; box-shadow:0 0 0 3px rgba(37,99,235,.12); }

    /* ── 자동 새로고침 표시 ── */
    .auto-refresh-indicator { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; }
    .auto-refresh-indicator .dot { width:6px; height:6px; border-radius:50%; background:#86efac; display:inline-block; }
    .auto-refresh-indicator.paused .dot { background:#fbbf24; }

    /* ── 특이사항표 (표9/10, 2026-09 신규 — index.html 특이사항 UI 패턴 재사용) ── */
    .special-table { border-collapse:collapse; border:1px solid #000; width:100%; }
    .special-head-left, .special-head-mid, .special-head-right { height:30px; background:#fff; font-size:12px; font-weight:700; text-align:center; border:1px solid #000; }
    .special-side-label { background:#fff; text-align:center; vertical-align:middle; font-size:14px; font-weight:700; border:1px solid #000; }
    .special-division-label { background:#f8fafc; text-align:center; vertical-align:middle; font-size:13px; font-weight:700; color:#0f172a; border:1px solid #000; padding:8px 6px; }
    .special-note-wrap { padding:0; background:#fff; border:1px solid #000; }
    .special-note-input { display:block; width:calc(100% - 10px); min-height:64px; resize:vertical; border:0; outline:none; padding:10px 14px; font:inherit; line-height:1.5; color:#111827; background:#fff; box-shadow:none; text-align:left; }
    .special-note-input:focus { box-shadow:none; background:#fff; }
    .special-note-input[disabled] { background:#f3f4f6; color:#94a3b8; cursor:not-allowed; opacity:1; }
    /* 저장자/담당자 정보 캡션 — "누가 언제 저장했는지" 화면 표시 */
    .special-note-meta { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 14px 8px; font-size:11px; color:#64748b; border-top:1px dashed #e2e8f0; background:#fff; }
    .special-note-meta .special-note-owner { font-weight:700; color:#334155; }
    .special-note-meta .special-note-saved { color:#64748b; }
    /* 담당자 미배정 등으로 잠긴 행 — 셀 시스템의 .cell.locked와 동일한 회색조 */
    .special-row-locked .special-note-wrap { background:#f3f4f6; }
    .special-row-locked .special-note-meta { background:#f3f4f6; }
    /* 특이사항표 전체(행 합산) 줄바꿈/글자수 사용량 표시 — 섹션 타이틀 바 우측 */
    .section-title.with-counter { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .special-note-counter { font-size:12px; font-weight:700; color:#64748b; white-space:nowrap; }
    .special-note-counter .counter-warn { color:#dc2626; }

    @media (max-width:980px) {
      .topbar { flex-direction:column; align-items:flex-start; }
      .page-wrap, .notice, .legend { width:calc(100vw - 24px); }
      .section-title { font-size:16px; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════
       앱 메인 쉘 (AI 플랫폼 로그인 후 진입)
  ═══════════════════════════════════════════════════ -->
  <section class="app-shell" id="appShell">
    <div class="topbar">
      <div class="topbar-actions">
        <div class="date-picker-wrap">
          <input type="date" id="reportDateInput" />
          <button class="toolbar-btn" type="button" id="loadReportBtn" onclick="loadReportByDate()">조회</button>
        </div>
        <div class="user-chip" id="userChip">인증 확인중...</div>
        <div class="date-chip save-chip idle" id="saveChip">저장 전</div>
        <button class="toolbar-btn refresh" type="button" onclick="refreshData()" title="다른 사용자가 입력한 값을 최신으로 갱신합니다">&#8635; 새로고침</button>
        <button class="toolbar-btn primary" type="button" id="saveBtn" onclick="saveInputs()">저장</button>
        <div class="auto-refresh-indicator" id="autoRefreshIndicator" style="display:none">
          <span class="dot"></span>
          <span id="autoRefreshLabel">자동 갱신 3분</span>
        </div>
      </div>
    </div>

    <div class="notice">입력 안내<small id="noticeDetail">로그인 인증 확인중...</small></div>
    <div class="legend">
      <div class="legend-item"><span class="swatch mine"></span> 파란색: 사람이 수기로 입력하는 셀 (본인 담당)</div>
      <div class="legend-item"><span class="swatch locked"></span> 잠금 또는 비담당 셀</div>
    </div>

    <div id="errorBanner" class="error-banner" style="display:none"></div>

    <div class="page-wrap">
      <div class="sections-stack" id="sectionsStack">
        <!-- 4개 표(사고 통계): JS에서 동적 렌더링 -->
      </div>
    </div>
  </section>

  <!-- 권한 없음 화면 (필요 시 표시) -->
  <section class="no-access" id="noAccessShell" style="display:none">
    <div class="no-access-panel">
      <div class="no-access-icon">&#128274;</div>
      <div class="no-access-title">접근 권한이 없습니다</div>
      <div class="no-access-desc" id="noAccessDesc">
        세부공장일보 사고 통계 페이지에 대한 접근 권한이 없습니다.<br>
        관리자에게 권한 부여를 요청해 주세요.
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- 커스텀 확인 모달 (브라우저 기본 confirm() 대체) -->
  <div class="confirm-modal-overlay" id="confirmModalOverlay">
    <div class="confirm-modal-box">
      <div class="confirm-modal-message" id="confirmModalMessage"></div>
      <div class="confirm-modal-actions">
        <button class="confirm-modal-btn cancel" type="button" id="confirmModalCancelBtn">취소</button>
        <button class="confirm-modal-btn confirm" type="button" id="confirmModalOkBtn">확인</button>
      </div>
    </div>
  </div>

  <!-- 특이사항표(표9/10) 분량 제한 초과 시 표시되는 알림 전용 팝업 (index.html과 동일 패턴) -->
  <div class="confirm-modal-overlay" id="limitAlertOverlay">
    <div class="confirm-modal-box">
      <div class="confirm-modal-message" id="limitAlertMessage"></div>
      <div class="confirm-modal-actions">
        <button class="confirm-modal-btn confirm" type="button" id="limitAlertOkBtn" style="flex:1;">확인</button>
      </div>
    </div>
  </div>

  <!-- 다른 모듈(소방/설비 점검 등)과 동일한 세션 만료 처리를 위한 공용 유틸 -->
  <script src="/js/csrf.js"></script>

  <!-- ═══════════════════════════════════════════════════
       JavaScript — 세부공장일보 사고 통계 (index.html 패턴 재사용, 2026-08 신규)
       - 로그인: AI 플랫폼이 처리 (Spring Security)
       - 권한: /view/my-permissions → 페이지 접근 여부 확인 (기존 입력 페이지와 동일 기준)
       - 셀 편집: 서버에서 editable 계산 (OWNER_IDS + CellAuth) — index.html과 100% 동일 로직 재사용
       - 자동/수동 새로고침: 다른 사용자 입력 값 갱신
       - 특이사항/이미지 첨부/게시판 재업로드(배치잡)/PPT 캡처 기능은 이 페이지에는 없음
  ═══════════════════════════════════════════════════ -->
  <script>
    // ── 설정 ──
    const API_BASE = '/dailyreport-api';
    const AUTO_REFRESH_INTERVAL_MS = 180000; // 3분마다 자동 새로고침

    // ── 부모 iframe에서 전달한 파라미터 추출 ──
    const _urlParams = new URLSearchParams(window.location.search);
    const _previewLoginId = _urlParams.get('_loginId') || '';
    let _jwtToken = _urlParams.get('_t') || '';

    async function handleAuthExpired() {
      if (window.FireWebCsrf?.refreshJwtToken) {
        const refreshed = await window.FireWebCsrf.refreshJwtToken();
        if (refreshed) {
          const newToken = window.FireWebCsrf.getJwtToken();
          if (newToken) {
            _jwtToken = newToken;
            return true;
          }
        }
      }
      if (window.FireWebCsrf?.isInIframe?.()) {
        window.FireWebCsrf.goLogin();
      } else {
        window.location.href = '/index.html?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search);
      }
      return false;
    }

    // ── 상태 ──
    let currentUser = null;        // { userId, loginId, permissions }
    let currentReportId = null;
    let currentReportDate = null;
    let reportData = null;         // /view/safety-render 응답 전체
    let dirtyCoords = new Set();   // 변경된 셀 좌표
    let autoRefreshTimer = null;
    let isRefreshing = false;

    // ── 특이사항표(표9/표10, 2026-09 신규) 설정 ──
    // index.html의 특이사항(TBL_SPECIAL_NOTE) UI/검증 패턴을 그대로 재사용하되,
    // 표별로 독립된 tableCode/카테고리/분량 한도를 갖도록 설정 객체로 일반화했다.
    // ★★ 백엔드 DailyReportService.SPECIAL_NOTE_SPECS의 동일 tableCode 항목과
    //   반드시 값이 일치해야 한다(프론트 검증은 UX용, 서버가 최종 재검증).
    const NOTE_TABLES = {
      amount: {
        tableCode: 'TBL_SAFETY_AMOUNT_NOTE',
        categories: [
          { code: 'PAPER',  label: '제지' },
          { code: 'TISSUE', label: '화장지' },
          { code: 'PAD',    label: '패드' },
        ],
        maxTotalNewlines: 9,
        maxTotalChars: 804,
        maxLineLength: 67,
        title: '9. 사고 금액 특이사항',
        sideLabel: '사고 금액 특이사항',
        sectionId: 'noteAmount',
        counterId: 'noteAmountCounter',
        remarksKey: 'amountNoteRemarks',
        remarkIds: {},
        lastValue: {},
      },
      trend: {
        tableCode: 'TBL_SAFETY_TREND_NOTE',
        categories: [
          { code: 'ALL', label: '전체' },
        ],
        hideDivisionColumns: true,
        maxTotalNewlines: 6,
        maxTotalChars: 469,
        maxLineLength: 67,
        title: '10. 안전사고 발생추이 특이사항',
        sideLabel: '안전사고 발생추이 특이사항',
        sectionId: 'noteTrend',
        counterId: 'noteTrendCounter',
        remarksKey: 'trendNoteRemarks',
        remarkIds: {},
        lastValue: {},
      },
    };

    // ── 유틸리티 ──
    function escapeHtml(v) {
      return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getYesterdayStr() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ★★★ 입력 주기: index.html과 동일 기준 — daily/event 둘 다 항상 활성화
    function canEditByFrequency(freqCode) {
      return !!freqCode;
    }

    /**
     * 숫자 셀 서식 — 천 단위 콤마 적용, 정수부 자릿수에 따라 소수점 표시 여부 결정
     * (index.html의 formatNumber()와 동일 규칙. 단, 사고 통계 표에는 연료행/표2 등
     *  기존 표 전용 예외 좌표가 없으므로 그 부분은 생략한다)
     *
     * ★ 2026-09 요청: 표6(손실금액, TBL_SAFETY_INCIDENT_AMOUNT)만 기존처럼 소수점을
     *   유지하고, 표5(발생건수)/표7(연도별 추이)/표8(월별 추이)는 tableCode가 넘어오면
     *   항상 정수로만 표시한다 (소수점 표시 없음, 천 단위 콤마는 유지).
     */
    function formatNumber(v, tableCode) {
      if (v === null || v === undefined) return v;
      const raw = String(v);
      const trimmed = raw.trim();
      if (trimmed === '') return raw;
      const cleaned = trimmed.replace(/,/g, '');
      if (!/^-?\d+(\.\d+)?$/.test(cleaned)) return raw; // 숫자 형식이 아니면 그대로
      const num = Number(cleaned);
      if (isNaN(num)) return raw;

      // ★ 표5/7/8(사고 금액 표 제외)는 항상 정수로만 표시
      if (tableCode && tableCode !== 'TBL_SAFETY_INCIDENT_AMOUNT') {
        return Math.round(num).toLocaleString('ko-KR');
      }

      // 0은 예외적으로 그냥 "0"만 표시
      if (num === 0) return '0';

      // 정수부(부호 제외) 자릿수로 소수점 표시 여부 결정
      const integerDigits = Math.trunc(Math.abs(num)).toString().length;
      if (integerDigits >= 4) {
        const roundedInt = Math.round(num);
        return roundedInt.toLocaleString('ko-KR');
      }
      const rounded = Math.round(num * 10) / 10; // 소수점 1자리까지 반올림
      return rounded.toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    function formatDateDots(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = String(isoDateStr).split('-');
      if (parts.length !== 3) return isoDateStr;
      return parts.join('.');
    }

    function formatSavedAt(dateTimeStr) {
      if (!dateTimeStr) return '';
      const d = new Date(dateTimeStr);
      if (isNaN(d.getTime())) return String(dateTimeStr);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}.${dd} ${hh}:${mi}`;
    }

    /**
     * ★ 매월 말일 판정 — reportDate(YYYY-MM-DD 문자열)가 그 달의 마지막 날인지 확인.
     * (index.html의 isLastDayOfMonthStr()와 동일 기준)
     */
    function isLastDayOfMonthStr(reportDate) {
      if (!reportDate) return false;
      const parts = reportDate.split('-').map(Number);
      const year = parts[0], month = parts[1], day = parts[2];
      if (!year || !month || !day) return false;
      const lastDay = new Date(year, month, 0).getDate();
      return day === lastDay;
    }

    /**
     * 커스텀 확인 모달 — index.html과 동일(라디오 옵션 없이 단순 확인만 사용)
     */
    function showConfirmModal(message) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('confirmModalOverlay');
        const msgEl = document.getElementById('confirmModalMessage');
        const okBtn = document.getElementById('confirmModalOkBtn');
        const cancelBtn = document.getElementById('confirmModalCancelBtn');

        msgEl.textContent = message;
        overlay.classList.add('show');

        function cleanup(result) {
          overlay.classList.remove('show');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          overlay.removeEventListener('click', onOverlayClick);
          document.removeEventListener('keydown', onKeydown);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        function onOverlayClick(e) { if (e.target === overlay) onCancel(); }
        function onKeydown(e) {
          if (e.key === 'Escape') onCancel();
          if (e.key === 'Enter') onOk();
        }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        overlay.addEventListener('click', onOverlayClick);
        document.addEventListener('keydown', onKeydown);
      });
    }

    /**
     * 특이사항표(표9/10) 분량 제한 초과 시 표시되는 알림 팝업 (index.html과 동일 패턴)
     */
    let _limitAlertHandler = null;
    function showLimitAlert(message, isHtml) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('limitAlertOverlay');
        const msgEl = document.getElementById('limitAlertMessage');
        const okBtn = document.getElementById('limitAlertOkBtn');

        if (isHtml) { msgEl.innerHTML = message; } else { msgEl.textContent = message; }
        overlay.classList.add('show');

        if (_limitAlertHandler) {
          okBtn.removeEventListener('click', _limitAlertHandler);
          overlay.removeEventListener('click', _limitAlertHandler.overlayFn);
        }
        function cleanup() {
          overlay.classList.remove('show');
          okBtn.removeEventListener('click', onOk);
          overlay.removeEventListener('click', onOverlayClick);
          document.removeEventListener('keydown', onKeydown);
          resolve();
        }
        function onOk() { cleanup(); }
        function onOverlayClick(e) { if (e.target === overlay) cleanup(); }
        function onKeydown(e) { if (e.key === 'Escape' || e.key === 'Enter') cleanup(); }

        okBtn.addEventListener('click', onOk);
        overlay.addEventListener('click', onOverlayClick);
        document.addEventListener('keydown', onKeydown);
        _limitAlertHandler = onOk;
        _limitAlertHandler.overlayFn = onOverlayClick;
      });
    }

    // ── API 호출 (index.html의 apiFetch()와 동일 로직) ──
    async function apiFetch(path, options = {}) {
      let url = API_BASE + path;
      if (_previewLoginId) {
        const sep = url.includes('?') ? '&' : '?';
        url += sep + '_loginId=' + encodeURIComponent(_previewLoginId);
      }
      const doFetch = () => {
        const hdrs = { 'Content-Type': 'application/json', ...options.headers };
        if (_jwtToken) hdrs['Authorization'] = 'Bearer ' + _jwtToken;
        return fetch(url, { headers: hdrs, credentials: 'same-origin', ...options });
      };
      let res = await doFetch();
      if (res.status === 401) {
        const refreshed = await handleAuthExpired();
        if (refreshed) {
          res = await doFetch();
        }
        if (!refreshed || res.status === 401) {
          throw new Error('인증이 만료되었습니다.');
        }
      }
      if (res.status === 403) {
        throw new Error('접근 권한이 없습니다.');
      }
      if (!res.ok) {
        const err = await res.text().catch(() => res.statusText);
        throw new Error(`API 오류 (${res.status}): ${err}`);
      }
      const json = await res.json();
      if (json && typeof json.success === 'boolean' && json.data !== undefined) {
        return json.data;
      }
      return json;
    }

    async function refreshData() {
      if (isRefreshing) return;
      if (!currentReportDate) { showToast('먼저 조회해 주세요.'); return; }

      isRefreshing = true;
      const refreshBtn = document.querySelector('.toolbar-btn.refresh');
      if (refreshBtn) refreshBtn.textContent = '갱신중...';

      try {
        const myDirtyValues = collectMyDirtyValues();
        await loadReport(currentReportDate, true /* silent */);
        restoreMyDirtyValues(myDirtyValues);
        showToast('최신 데이터로 갱신되었습니다.');
      } catch (err) {
        console.error('새로고침 실패:', err);
        showToast('갱신 실패: ' + err.message);
      } finally {
        isRefreshing = false;
        if (refreshBtn) refreshBtn.innerHTML = '&#8635; 새로고침';
      }
    }

    function collectMyDirtyValues() {
      const values = {};
      if (dirtyCoords.size === 0) return values;

      document.querySelectorAll('td.mine .cell-input').forEach(input => {
        const coord = input.dataset.coord;
        if (coord && dirtyCoords.has(coord)) {
          const tableCode = input.dataset.tableCode || '';
          values[`${tableCode}__${coord}`] = input.value;
        }
      });
      return values;
    }

    function restoreMyDirtyValues(savedValues) {
      if (Object.keys(savedValues).length === 0) return;

      document.querySelectorAll('td.mine .cell-input').forEach(input => {
        const coord = input.dataset.coord;
        const tableCode = input.dataset.tableCode || '';
        const key = `${tableCode}__${coord}`;
        if (savedValues[key] !== undefined) {
          input.value = savedValues[key];
          dirtyCoords.add(coord);
        }
      });

      if (dirtyCoords.size > 0) {
        setSaveState('저장 필요', 'dirty');
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      const indicator = document.getElementById('autoRefreshIndicator');
      indicator.style.display = 'flex';

      autoRefreshTimer = setInterval(async () => {
        if (dirtyCoords.size > 0) {
          indicator.classList.add('paused');
          document.getElementById('autoRefreshLabel').textContent = '수정중 — 일시정지';
          return;
        }
        indicator.classList.remove('paused');
        document.getElementById('autoRefreshLabel').textContent = '자동 갱신중...';

        try {
          await loadReport(currentReportDate, true);
          document.getElementById('autoRefreshLabel').textContent = '자동 갱신 3분';
        } catch (err) {
          console.warn('자동 갱신 실패:', err);
          document.getElementById('autoRefreshLabel').textContent = '갱신 실패';
        }
      }, AUTO_REFRESH_INTERVAL_MS);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    /**

     * daily_report_cell 구조를 그대로 쓰되, 사고 통계 4개 표(표5~8)만 반환하는
     * 전용 엔드포인트(/view/safety-render)를 호출한다.
     * @param reportDate 날짜 문자열
     * @param silent true면 에러 배너를 표시하지 않음 (자동 새로고침 시)
     */
    async function loadReport(reportDate, silent = false) {

      if (!silent) dirtyCoords.clear();

      try {

        }

      } catch (err) {

        if (!silent) {
          showError(`사고 통계를 불러올 수 없습니다: ${err.message}`);

    }

    // ── 특이사항표(표9/표10, 2026-09 신규) 분량 제한 헬퍼 ──
    // index.html의 특이사항 헬퍼(countNewlines/getSpecialNoteTotals/updateSpecialNoteCounter/
    // trimToSpecialNoteBudget/checkSpecialNoteLineLength/onSpecialNoteInput)를 NOTE_TABLES[key]
    // 기준으로 일반화한 버전. 표9/표10은 서로 독립된 공유 총량을 가지므로 절대 섞이지 않는다.

    /** 문자열의 개행(\n) 개수 */
    function countNewlines(s) {
      if (!s) return 0;
      const m = s.match(/\n/g);
      return m ? m.length : 0;
    }

    /**
     * 지정된 특이사항표(key)의 모든 textarea(현재 DOM 값 기준) 줄바꿈/글자수 합계를 구한다.
     * - excludeCode를 지정하면 해당 카테고리는 합산에서 제외(그 자리에 override 값을 더함).
     */
    function getNoteTotals(key, excludeCode, overrideValue) {
      const cfg = NOTE_TABLES[key];
      let totalNewlines = 0;
      let totalChars = 0;
      cfg.categories.forEach(({ code }) => {
        const textarea = document.getElementById(`noteInput_${key}_${code}`);
        if (!textarea) return;
        const value = (code === excludeCode) ? (overrideValue ?? '') : textarea.value;
        totalNewlines += countNewlines(value);
        totalChars += value.length;
      });
      return { totalNewlines, totalChars };
    }

    /** 특이사항표(key) 섹션 타이틀 바의 "(줄바꿈: n/N회) (글자 수: nnn/N자)" 카운터를 갱신한다. */
    function updateNoteCounter(key) {
      const cfg = NOTE_TABLES[key];
      const el = document.getElementById(cfg.counterId);
      if (!el) return;
      const { totalNewlines, totalChars } = getNoteTotals(key);
      const nlWarn = totalNewlines >= cfg.maxTotalNewlines ? ' counter-warn' : '';
      const chWarn = totalChars >= cfg.maxTotalChars ? ' counter-warn' : '';
      el.innerHTML =
        `<span class="${nlWarn}">(줄바꿈: ${totalNewlines}/${cfg.maxTotalNewlines}회)</span> ` +
        `<span class="${chWarn}">(글자 수: ${totalChars}/${cfg.maxTotalChars}자)</span>`;
    }

    /**
     * 특이사항표(key) textarea 입력값을 분량 제한(공유 총량)에 맞게 다듬는다.
     * (index.html의 trimToSpecialNoteBudget()과 동일 원리)
     */
    function trimToNoteBudget(key, code, newValue) {
      const cfg = NOTE_TABLES[key];
      const before = cfg.lastValue[code] || '';

      const others = getNoteTotals(key, code, '');
      const remainingNewlines = cfg.maxTotalNewlines - others.totalNewlines;
      const remainingChars = cfg.maxTotalChars - others.totalChars;

      let text = newValue;
      let newlineBlocked = false;
      let charBlocked = false;

      // 1) 글자수 예산 초과 — 예산만큼만 남기고 뒷부분 절단
      if (remainingChars >= 0 && text.length > remainingChars) {
        text = text.slice(0, Math.max(0, remainingChars));
        charBlocked = true;
      } else if (remainingChars < 0) {
        text = before;
        charBlocked = true;
      }

      // 2) 줄바꿈 예산 초과 — 허용된 줄바꿈 개수까지만 남기고, 그 뒤는 이어붙임
      if (remainingNewlines >= 0) {
        const parts = text.split('\n');
        if (parts.length - 1 > remainingNewlines) {
          const head = parts.slice(0, remainingNewlines + 1).join('\n');
          const tail = parts.slice(remainingNewlines + 1).join('');
          text = head + tail;
          newlineBlocked = true;
        }
      } else {
        text = before;
        newlineBlocked = true;
      }

      return { text, newlineBlocked, charBlocked };
    }

    /**
     * 특이사항표(key) textarea 한 줄(개행 기준) 길이 검사 — maxLineLength 초과 시 하드 블록.
     * @returns {number} 초과한 줄의 길이(0이면 정상)
     */
    function checkNoteLineLength(key, value) {
      const cfg = NOTE_TABLES[key];
      const lines = value.split('\n');
      for (const line of lines) {
        if (line.length > cfg.maxLineLength) {
          return line.length;
        }
      }
      return 0;
    }

    /**
     * 특이사항표(key) textarea input 이벤트 핸들러 — 공유 총량 초과분은 잘라내고,
     * 한 줄 길이 초과는 하드 블록 + 팝업으로 되돌린다. (index.html의 onSpecialNoteInput()과 동일 원리)
     */
    function onNoteInput(key, code, textarea) {
      const cfg = NOTE_TABLES[key];
      const isComposing = textarea.dataset.composing === '1';
      const before = cfg.lastValue[code] !== undefined ? cfg.lastValue[code] : textarea.value;

      if (isComposing) {
        autoGrowTextarea(textarea);
        updateNoteCounter(key);
        return;
      }

      const raw = textarea.value;
      const caretAtEnd = textarea.selectionStart === raw.length;

      // 1) 한 줄 길이 초과 — 하드 블록(되돌리기) + 팝업
      const overLen = checkNoteLineLength(key, raw);
      if (overLen > 0) {
        textarea.value = before;
        cfg.lastValue[code] = before;
        autoGrowTextarea(textarea);
        updateNoteCounter(key);
        showLimitAlert(
          `한 줄에 입력 가능한 최대 글자수는 ${cfg.maxLineLength}자입니다. ` +
          `<span class="count-current">${overLen}</span>/${cfg.maxLineLength}`,
          true
        );
        return;
      }

      // 2) 공유 총량 초과 — 넘치는 부분만 잘라서 반영
      const { text, newlineBlocked, charBlocked } = trimToNoteBudget(key, code, raw);
      if (text !== raw) {
        textarea.value = text;
        if (caretAtEnd) {
          textarea.selectionStart = textarea.selectionEnd = text.length;
        }
      }
      cfg.lastValue[code] = textarea.value;
      autoGrowTextarea(textarea);
      updateNoteCounter(key);

      if (newlineBlocked) {
        showLimitAlert(`줄바꿈 ${cfg.maxTotalNewlines}회를 모두 사용했습니다.`);
      } else if (charBlocked) {
        showLimitAlert(`글자수 ${cfg.maxTotalChars}자 이상 기재할 수 없습니다.`);
      }
    }

    // ── 특이사항표(표9/표10) 섹션 생성 (index.html의 createSpecialNoteSection()과 동일 원리) ──
    function createNoteSection(key) {
      const cfg = NOTE_TABLES[key];
      const section = document.createElement('section');
      section.className = 'report-section';
      section.dataset.section = cfg.sectionId;

      const remarks = reportData?.[cfg.remarksKey] || [];
      const remarksByCategory = {};
      remarks.forEach(r => { if (r.category) remarksByCategory[r.category] = r; });

      // 기존 레코드 ID를 카테고리별로 기억해 둔다 — 저장 시 이 값이 있으면 PUT(수정),
      // 없으면 POST(신규)로 분기한다.
      cfg.remarkIds = {};
      cfg.categories.forEach(({ code }) => {
        const r = remarksByCategory[code];
        cfg.remarkIds[code] = r ? r.remarkId : null;
      });

      const canWrite = currentUser?.permissions?.canWriteInput !== false;
      const isEditableDate = isNoteEditableDate(currentReportDate);
      // ★ 표10(안전사고 발생추이 특이사항)처럼 카테고리가 'ALL' 하나뿐인 표는
      // "구분값" 열이 의미가 없으므로, hideDivisionColumns가 true인 경우
      // "구분값" 열만 제거하고 구분(사이드 라벨) + 비고, 2열 구조로 렌더링한다.
      const hideDivision = cfg.hideDivisionColumns === true;

      const rowsHtml = cfg.categories.map(({ code, label }, idx) => {
        const r = remarksByCategory[code] || {};
        const content = r.content || '';
        const serverEditable = r.editable === true;
        const canEditRow = canWrite && isEditableDate && serverEditable;
        const isLockedRow = !serverEditable;

        const ownerNames = r.ownerNames || '';
        const ownerLabel = ownerNames ? `담당자: ${ownerNames}` : '담당자 미배정';
        const savedLabel = r.savedByName && r.savedAt
          ? `${escapeHtml(r.savedByName)} · ${formatSavedAt(r.savedAt)} 저장`
          : '저장 이력 없음';

        let helpMsg = '';
        if (isLockedRow) {
          helpMsg = '이 항목은 담당자가 배정되지 않아 편집할 수 없습니다.';
        } else if (!isEditableDate) {
          helpMsg = '특이사항은 어제 이후(어제·오늘·미래) 또는 매월 말일 일보에서만 등록/수정할 수 있습니다.';
        } else if (!canWrite) {
          helpMsg = '쓰기 권한이 없습니다.';
        }

        const rowSpanAttr = idx === 0 ? ` rowspan="${cfg.categories.length}"` : '';
        const sideLabelCell = idx === 0
          ? `<td class="special-side-label"${rowSpanAttr}>${escapeHtml(cfg.sideLabel)}</td>`
          : '';
        const divisionCell = hideDivision
          ? ''
          : `<td class="special-division-label">${escapeHtml(label)}</td>`;

        return `
              <tr class="${isLockedRow ? 'special-row-locked' : ''}">
                ${sideLabelCell}
                ${divisionCell}
                <td class="special-note-wrap">
                  <textarea id="noteInput_${key}_${code}" class="special-note-input"
                    data-category="${code}"
                    placeholder="${escapeHtml(label)} 특이사항 입력"
                    title="${escapeHtml(ownerLabel)}"
                    ${canEditRow ? '' : 'disabled'}>${escapeHtml(content)}</textarea>
                  <div class="special-note-meta">
                    <span class="special-note-owner">${escapeHtml(ownerLabel)}</span>
                    <span class="special-note-saved">${savedLabel}</span>
                  </div>
                  ${helpMsg ? `<div class="upload-help" style="padding:0 14px 8px;">${escapeHtml(helpMsg)}</div>` : ''}
                </td>
              </tr>`;
      }).join('');

      const colgroupHtml = hideDivision
        ? `<col style="width:14%">
              <col style="width:86%">`
        : `<col style="width:9%">
              <col style="width:12%">
              <col style="width:79%">`;
      const headerRowHtml = hideDivision
        ? `<tr>
                <td class="special-head-left">구분</td>
                <td class="special-head-right">비고</td>
              </tr>`
        : `<tr>
                <td class="special-head-left">구분</td>
                <td class="special-head-mid">구분값</td>
                <td class="special-head-right">비고</td>
              </tr>`;

      section.innerHTML = `
        <div class="section-title with-counter">
          <span>${escapeHtml(cfg.title)}</span>
          <span class="special-note-counter" id="${cfg.counterId}"></span>
        </div>
        <div class="section-table-wrap">
          <table class="report-table special-table" id="noteTable_${key}">
            <colgroup>
              ${colgroupHtml}
            </colgroup>
            <tbody>
              ${headerRowHtml}
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;

      setTimeout(() => {
        cfg.lastValue = {};
        cfg.categories.forEach(({ code }) => {
          const textarea = document.getElementById(`noteInput_${key}_${code}`);
          if (textarea) {
            cfg.lastValue[code] = textarea.value;
            textarea.addEventListener('compositionstart', () => { textarea.dataset.composing = '1'; });
            textarea.addEventListener('compositionend', () => {
              textarea.dataset.composing = '0';
              onNoteInput(key, code, textarea);
              setSaveState('저장 필요', 'dirty');
            });
            textarea.addEventListener('input', () => {
              onNoteInput(key, code, textarea);
              setSaveState('저장 필요', 'dirty');
            });
            autoGrowTextarea(textarea);
          }
        });
        updateNoteCounter(key);
      }, 0);

      return section;
    }

    // ── 4개 표(사고 통계) + 특이사항표 2개(표9/10) 렌더링 ──
    function renderAllSections() {
      const stack = document.getElementById('sectionsStack');
      stack.innerHTML = '';

      const tableConfig = [
        { code: 'TBL_SAFETY_INCIDENT_COUNT',  title: '5. 안전사고 발생건수', id: 'table5' },
        { code: 'TBL_SAFETY_INCIDENT_AMOUNT', title: '6. 안전사고 손실금액', id: 'table6' },
        { code: 'TBL_SAFETY_YEARLY_TREND',    title: '7. 안전사고 연도별 추이', id: 'table7' },
        { code: 'TBL_SAFETY_MONTHLY_TREND',   title: '8. 안전사고 월별 추이', id: 'table8' },
      ];

      const tables = reportData?.tables || {};

      // 4개 표 모두 세로로 한 줄씩 전체 폭 배치 (표5/6은 18열로 넓어 나란히 배치 시
      // 가로 폭이 지나치게 좁아지므로, 기존 표3/4 같은 dual 배치는 적용하지 않는다)
      for (const cfg of tableConfig) {
        const tableData = tables[cfg.code];
        if (!tableData) continue;
        const section = createTableSection(cfg, tableData, false);
        stack.appendChild(section);
      }

      // ★★ 2026-09 신규 — 특이사항표 2개(표9: 사고 금액 특이사항, 표10: 안전사고
      // 발생추이 특이사항)를 표5~8 다음, 맨 아래에 몰아서 배치 (사용자 요청)
      stack.appendChild(createNoteSection('amount'));
      stack.appendChild(createNoteSection('trend'));
    }

    // ── 표 섹션 생성 (index.html의 createTableSection()과 동일 로직) ──
    function createTableSection(cfg, tableData, isDual) {
      const section = document.createElement('section');
      section.className = 'report-section';
      section.dataset.section = cfg.id;

      const cells = tableData.cells || [];

      const occupiedCells = new Set();
      cells.sort((a, b) => a.rowIndex !== b.rowIndex ? a.rowIndex - b.rowIndex : a.colIndex - b.colIndex);

      let minRow = Infinity, maxRow = -Infinity;
      let minCol = Infinity, maxCol = -Infinity;
      for (const c of cells) {
        minRow = Math.min(minRow, c.rowIndex);
        maxRow = Math.max(maxRow, c.rowIndex);
        minCol = Math.min(minCol, c.colIndex);
        maxCol = Math.max(maxCol, c.colIndex);
      }

      const cellMap = {};
      for (const c of cells) {
        cellMap[`${c.rowIndex}_${c.colIndex}`] = c;
      }

      const colCount = tableData.colCount || (maxCol - minCol + 1);

      let html = `
        <div class="section-title">${escapeHtml(cfg.title)}</div>
        <div class="section-table-wrap">
          <table class="report-table" id="${cfg.id}">
            <colgroup>`;

      const colWidths = getColWidths(cfg.code, colCount);
      for (const w of colWidths) {
        const widthCss = typeof w === 'string' ? w : `${w}%`;
        html += `<col style="width:${widthCss}">`;
      }

      html += `</colgroup><tbody>`;

      for (let r = minRow; r <= maxRow; r++) {
        html += `<tr style="height:26px">`;
        for (let c = minCol; c <= maxCol; c++) {
          if (occupiedCells.has(`${r}_${c}`)) continue;

          const cell = cellMap[`${r}_${c}`];
          if (!cell) {
            html += `<td class="cell table-cell" style="border:1px solid #000000;padding:6px 8px">&nbsp;</td>`;
            continue;
          }

          const rs = cell.rowSpan || 1;
          const cs = cell.colSpan || 1;
          if (rs > 1 || cs > 1) {
            for (let dr = 0; dr < rs; dr++) {
              for (let dc = 0; dc < cs; dc++) {
                if (dr === 0 && dc === 0) continue;
                occupiedCells.add(`${r + dr}_${c + dc}`);
              }
            }
          }

          // ★ 2026-09 요청 — 표5/6 "기저귀" 대분류 바로 아래 "6호기" 세부행은
          // 구조적으로는 별도 행(각자 실측값 보유)이지만, 시각적으로는 위쪽(기저귀)
          // 셀과 왼쪽 구분칸이 이어붙어 보이도록 경계선만 제거한다.
          // border-collapse:collapse 특성상 한쪽(아래 칸의 top)만 지워도 위쪽
          // (기저귀 칸의 bottom, colSpan=2 전체에 적용됨)이 그 선을 계속 그리므로,
          // 두 셀 모두에서 해당 구간의 테두리를 제거해야 완전히 사라진다.
          // - "기저귀" 칸(colSpan=2): bottom 테두리 전체 제거
          // - 그 아래 빈 구분칸(col0, 1×1): top 테두리 제거
          // - 그 아래 "6호기" 칸(col1)은 그대로 두어 우측에만 경계선이 남는다
          //   (첨부 이미지와 동일하게 — 좌측은 이어지고 우측만 구분선 유지)
          let extraCellStyle = '';
          if (c === minCol && (!cell.cellValue || cell.cellValue.trim() === '')) {
            const rightSibling = cellMap[`${r}_${c + 1}`];
            if (rightSibling && rightSibling.cellValue && rightSibling.cellValue.trim() === '6호기') {
              extraCellStyle = 'border-top:none;';
            }
          } else if (cs === 2 && cell.cellValue && cell.cellValue.trim() !== '') {
            const belowLeft = cellMap[`${r + 1}_${c}`];
            const belowRight = cellMap[`${r + 1}_${c + 1}`];
            const belowLeftEmpty = belowLeft && (!belowLeft.cellValue || belowLeft.cellValue.trim() === '');
            const belowRightIs6ho = belowRight && belowRight.cellValue && belowRight.cellValue.trim() === '6호기';
            if (belowLeftEmpty && belowRightIs6ho) {
              extraCellStyle = 'border-bottom:none;';
            }
          }

          // ★ 2026-09 요청 — 표7 "청주공장"(rowSpan7) 범위 안에서 "협력사"(rowSpan3)
          // 블록이 끝난 뒤 남는 1×1 빈 칸(= "청주공장 총 발생건수" 행의 col1, 구조상
          // 자회사가 시작되기 전 남는 여백)은 구조적으로 별도 셀이지만, 시각적으로는
          // 왼쪽 "청주공장" 칸과 이어붙어 보이도록 좌측 테두리만 제거한다.
          // 조건: 1×1(rowSpan/colSpan 없음) + 빈 값 + 왼쪽 칸이 위쪽에서 내려온
          // rowSpan 셀에 의해 점유(occupied)된 경우 → 표7의 해당 빈 칸만 정확히 매칭됨
          // (표5/6의 기저귀 아래 빈 칸은 c===minCol이라 이 조건에 안 걸림, 표8은
          // 애초에 이런 여백 칸이 구조상 존재하지 않음).
          // border-style:hidden은 border-collapse 충돌 해소 규칙에서 최고 우선순위이므로
          // 이 셀 한쪽에만 적용해도 인접한 "청주공장" 칸의 우측 테두리까지 함께 사라진다
          // (기저귀/6호기 fix처럼 양쪽에 none을 걸 필요가 없음 — border_test로 검증됨).
          if (!extraCellStyle && cfg.code === 'TBL_SAFETY_YEARLY_TREND' &&
              cs === 1 && rs === 1 && c > minCol &&
              occupiedCells.has(`${r}_${c - 1}`) &&
              (!cell.cellValue || cell.cellValue.trim() === '')) {
            extraCellStyle = 'border-left:hidden;';
          }

          html += renderCellTd(cell, rs, cs, minRow, maxRow, isDual, extraCellStyle);
        }
        html += `</tr>`;
      }

      html += `</tbody></table></div>`;
      section.innerHTML = html;
      return section;
    }

    // ── 개별 셀 <td> 렌더링 (index.html의 renderCellTd()와 동일 로직 재사용) ──
    // ※ 사고 통계 4개 표에는 비고(remark) 열, 자동입력(AUTO_FILLED) 셀,
    //   계획/실적 강조박스(getHighlightColRange)가 없으므로 해당 분기는 항상
    //   기본값(false/null)으로 떨어진다 — index.html과 동일한 함수를 그대로 써도 무방.
    function renderCellTd(cell, rowSpan, colSpan, minRow, maxRow, isDual, extraCellStyle) {
      const serverEditable = cell.isEditable !== undefined ? cell.isEditable
                           : cell.editable !== undefined   ? cell.editable
                           : undefined;
      const isAssignable = cell.ownerIds && cell.ownerIds.trim().length > 0;
      const isMyCell = serverEditable !== undefined ? serverEditable : (isAssignable && currentUser && isOwnedBy(cell.ownerIds, currentUser.loginId));
      const freqEditable = isMyCell ? canEditByFrequency(cell.freqCode || '') : false;
      const isEditable = serverEditable !== undefined
        ? serverEditable
        : (isMyCell && freqEditable && !cell.isLocked);

      const canWrite = currentUser?.permissions?.canWriteInput !== false;
      const finalEditable = isEditable && canWrite;

      let bg = '#ffffff';
      let color = '#000000';
      let fontWeight = '700';
      const isDataLike = cell.cellType === 'DATA' || isAssignable;

      let fontSize = '12.0pt';
      let cellPadding = '6px 8px';
      let textAlign = 'center';

      if (isDataLike) {
        fontWeight = '500';
        if (!isAssignable) {
          textAlign = 'right';
        }
      }

      const forceNoWrap = false;

      let displayValue = cell.cellValue || '';
      const formattedDisplayValue = formatNumber(displayValue, cell.tableCode);
      let cellClasses = 'cell table-cell ' + (forceNoWrap ? 'nowrap-cell' : 'wrap-cell');

      if (isAssignable) {
        cellClasses += ' assignable';
      }

      if (isMyCell && finalEditable) {
        cellClasses += ' mine hover-own';
      } else if (isMyCell && !finalEditable) {
        cellClasses += ' locked';
      }

      let dataAttrs = '';
      dataAttrs += ` data-coord="${escapeHtml(cell.excelCoord || '')}"`;
      dataAttrs += ` data-row="${cell.rowIndex}"`;
      dataAttrs += ` data-col="${cell.colIndex}"`;
      dataAttrs += ` data-original-text="${escapeHtml(displayValue)}"`;
      if (cell.ownerIds) {
        dataAttrs += ` data-owners="${escapeHtml(cell.ownerIds)}"`;
        dataAttrs += ` data-owner-names="${escapeHtml(cell.ownerNames || '')}"`;
        dataAttrs += ` data-freq-code="${escapeHtml(cell.freqCode || '')}"`;
        dataAttrs += ` data-freq-label="${escapeHtml(cell.freqLabel || '')}"`;
      }

      let spanAttrs = '';
      if (rowSpan > 1) spanAttrs += ` rowspan="${rowSpan}"`;
      if (colSpan > 1) spanAttrs += ` colspan="${colSpan}"`;

      const whiteSpaceRule = forceNoWrap ? 'nowrap' : 'normal';
      const style = `background:${bg};color:${color};font-weight:${fontWeight};font-size:${fontSize};text-align:${textAlign};vertical-align:center;white-space:${whiteSpaceRule};border:1px solid #000000;padding:${cellPadding};position:relative;${extraCellStyle || ''}`;

      let innerHtml;
      if (isMyCell) {
        const savedVal = cell.cellValue || '';
        const disabledAttr = finalEditable ? '' : 'disabled';
        const displayVal = formatNumber(savedVal, cell.tableCode);
        innerHtml = `<div class="cell-editor"><input class="cell-input" data-coord="${escapeHtml(cell.excelCoord || '')}" data-row="${cell.rowIndex}" data-col="${cell.colIndex}" data-table-code="${escapeHtml(cell.tableCode || '')}" value="${escapeHtml(displayVal)}" placeholder="값 입력" ${disabledAttr} oninput="onCellInput(this)" onfocus="onCellFocus(this)" onblur="onCellBlur(this)" /></div>`;
      } else {
        const justify = textAlign === 'right' ? 'flex-end' : textAlign === 'left' ? 'flex-start' : 'center';
        const valueText = formattedDisplayValue ? escapeHtml(formattedDisplayValue).replace(/\n/g, '<br>') : '&nbsp;';
        innerHtml = `<div class="cell-value" style="justify-content:${justify};text-align:${textAlign};">${valueText}</div>`;
      }

      let titleAttr = '';
      if (cell.displayEditorName) {
        const savedAtText = cell.displayEditedAt ? ` ${formatSavedAt(cell.displayEditedAt)} 저장` : '';
        titleAttr = ` title="${escapeHtml(cell.displayEditorName)}${escapeHtml(savedAtText)}"`;
      }

      return `<td class="${cellClasses}" style="${style}"${dataAttrs}${spanAttrs}${titleAttr}>${innerHtml}</td>`;
    }

    function isOwnedBy(ownerIds, loginId) {
      if (!ownerIds || !loginId) return false;
      return ownerIds.split(/\s+/).some(id => id.toLowerCase() === loginId.toLowerCase());
    }

    function onCellInput(inputEl) {
      const coord = inputEl.dataset.coord;
      if (coord) dirtyCoords.add(coord);
      setSaveState('저장 필요', 'dirty');

      const indicator = document.getElementById('autoRefreshIndicator');
      if (indicator) {
        indicator.classList.add('paused');
        document.getElementById('autoRefreshLabel').textContent = '수정중 — 일시정지';
      }
    }

    function onCellFocus(inputEl) {
      const cleaned = String(inputEl.value || '').replace(/,/g, '');
      if (/^-?\d+(\.\d+)?$/.test(cleaned.trim())) {
        inputEl.value = cleaned;
      }
    }

    function onCellBlur(inputEl) {
      inputEl.value = formatNumber(inputEl.value, inputEl.dataset.tableCode);
    }

    // ── 표 코드 추론 (data-table-code가 항상 붙으므로 방어적 fallback 용도) ──
    function guessTableCode() {
      return 'UNKNOWN';
    }

    // ── 컬럼 폭 (표5/6: 18열 균등, 표7: 12열 균등, 표8: 19열 —
    //    "총 발생건수" 라벨(col2) 줄바꿈 방지를 위해 부분 조정) ──
    function getColWidths(tableCode, colCount) {
      // ★ 2026-09 요청 — 표8(TBL_SAFETY_MONTHLY_TREND)은 19열 균등 배분(각 5.263%)
      // 시 col2("재해자수"/"사망자수"/"총 발생건수" 소분류 라벨) 폭이 너무 좁아
      // "총 발생건수"만 "총"/"발생건수" 두 줄로 줄바꿈된다("총 발생건수"가 6글자로
      // 다른 라벨(4글자)보다 길기 때문). col2만 넓혀 한 줄로 들어가게 하고, 그만큼을
      // 16개 월별 데이터 컬럼(col3~18, 숫자/"-"만 표시되어 폭 여유가 있음)에서
      // 균등하게 나눠 줄여 전체 100%를 유지한다.
      // col0(청주공장/자회사/합계)·col1(공장/협력사)은 기존 폭에서 이미 줄바꿈
      // 없이 들어가므로 그대로 둔다.
      if (tableCode === 'TBL_SAFETY_MONTHLY_TREND' && colCount === 19) {
        const col0 = 5.5, col1 = 5.5, col2 = 9.0;
        const monthCol = (100 - col0 - col1 - col2) / 16; // = 5.0
        return [col0, col1, col2, ...Array(16).fill(monthCol)];
      }

      const w = 100 / colCount;
      return Array(colCount).fill(w);
    }

    // ═══════════════════════════════════════════════
    //  저장 — 셀 그룹 POST만 수행 (특이사항/이미지/게시판 재업로드 없음)
    // ═══════════════════════════════════════════════
    async function saveInputs() {
      if (!currentUser) { showToast('인증되지 않은 상태입니다.'); return; }
      if (!currentUser.permissions.canWriteInput) { showToast('쓰기 권한이 없습니다.'); return; }
      if (!currentReportId) { showToast('데이터가 로드되지 않았습니다.'); return; }

      const dateLabel = formatDateDots(currentReportDate);
      const confirmed = await showConfirmModal(`${dateLabel} 일자로 저장하시겠습니까?`);
      if (!confirmed) return;

      try {
        // 실제로 손댄(dirtyCoords에 담긴) 셀만 표별로 그룹핑해서 전송
        const cellInputs = document.querySelectorAll('td.mine .cell-input:not(:disabled)');
        const tableGroups = {};
        cellInputs.forEach(input => {
          const coord = input.dataset.coord;
          if (!coord || !dirtyCoords.has(coord)) return;
          const row = parseInt(input.dataset.row);
          const col = parseInt(input.dataset.col);
          const tableCode = input.dataset.tableCode || guessTableCode();
          if (!tableGroups[tableCode]) tableGroups[tableCode] = [];
          const rawValue = String(input.value || '').replace(/,/g, '');
          tableGroups[tableCode].push({ rowIndex: row, colIndex: col, cellValue: rawValue });
        });

        let totalSaved = 0;
        const failedGroups = [];
        for (const [tableCode, cells] of Object.entries(tableGroups)) {
          if (cells.length === 0) continue;
          try {
            await apiFetch(`/reports/${currentReportId}/cells`, {
              method: 'POST',
              body: JSON.stringify({ tableCode, cells })
            });
            totalSaved += cells.length;
          } catch (err) {
            console.warn(`표 ${tableCode} 저장 실패:`, err);
            failedGroups.push({ tableCode, count: cells.length, message: err.message || '알 수 없는 오류' });
          }
        }

        // ★★ 2026-09 신규 — 특이사항표 2개(표9: 사고 금액 특이사항, 표10: 안전사고
        // 발생추이 특이사항) 저장 — index.html의 특이사항 저장 로직과 동일 원리를
        // NOTE_TABLES 순회로 일반화. 카테고리별로 기존 레코드(remarkIds[code])가
        // 있으면 PUT(수정), 없으면 POST(신규 생성).
        let noteSaveCount = 0;
        let noteSaveFailed = false;
        for (const [key, cfg] of Object.entries(NOTE_TABLES)) {
          for (const { code } of cfg.categories) {
            const noteInput = document.getElementById(`noteInput_${key}_${code}`);
            if (!noteInput || noteInput.disabled) continue;
            const existingId = cfg.remarkIds[code];
            // 아직 한 번도 저장된 적 없고 값도 비어있는 칸은 저장 시도 자체를 건너뛴다
            // (index.html과 동일한 방어 로직 — @NotBlank 400 오탐 방지)
            if (!existingId && !noteInput.value.trim()) continue;
            try {
              if (existingId) {
                await apiFetch(`/reports/${currentReportId}/remarks/${existingId}`, {
                  method: 'PUT',
                  body: JSON.stringify({
                    tableCode: cfg.tableCode,
                    category: code,
                    content: noteInput.value
                  })
                });
              } else {
                const created = await apiFetch(`/reports/${currentReportId}/remarks`, {
                  method: 'POST',
                  body: JSON.stringify({
                    tableCode: cfg.tableCode,
                    category: code,
                    content: noteInput.value
                  })
                });
                cfg.remarkIds[code] = created?.remarkId ?? existingId;
              }
              noteSaveCount++;
            } catch (err) {
              console.warn(`특이사항표(${cfg.tableCode}/${code}) 저장 실패:`, err);
              noteSaveFailed = true;
            }
          }
        }

        dirtyCoords.clear();
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        if (failedGroups.length > 0 || noteSaveFailed) {
          setSaveState(`저장 실패 있음 ${timeStr}`, 'dirty');
          const cellDetail = failedGroups.length > 0
            ? failedGroups.map(f => `${f.tableCode}(${f.count}개): ${f.message}`).join(' / ')
            : '';
          const noteDetail = noteSaveFailed ? '특이사항표 저장 실패' : '';
          const detail = [cellDetail, noteDetail].filter(Boolean).join(' / ');
          showToast(`⚠️ 저장 실패 · ${totalSaved}개 셀 + ${noteSaveCount}건 특이사항 저장됨 - ${detail}`);
        } else {
          setSaveState(`저장됨 ${timeStr}`, 'saved');
          showToast(`저장 완료 · ${totalSaved}개 담당 셀 + 특이사항 ${noteSaveCount}건 반영`);
        }

        const indicator = document.getElementById('autoRefreshIndicator');
        if (indicator) {
          indicator.classList.remove('paused');
          document.getElementById('autoRefreshLabel').textContent = '자동 갱신 3분';
        }

      } catch (err) {
        console.error('저장 실패:', err);
        showToast('저장 중 오류가 발생했습니다: ' + err.message);
      }
    }

    // ═══════════════════════════════════════════════
    //  초기화 — AI 플랫폼 인증 기반
    // ═══════════════════════════════════════════════
    async function init() {
      document.getElementById('reportDateInput').value = getTodayStr();
      await checkPermissionsAndInit();
    }

    init();
  </script>
