<!DOCTYPE html>
<html lang="ko">
<head>
<style>body{opacity:0!important;transition:none!important;}</style>
<link rel="stylesheet" href="/css/spa-theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR 코드 관리 - FireWeb</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f7fb; color:#111827; }
    .fireweb-navbar { position:relative; z-index:1030; }
    .fireweb-navbar .nav-link.account-link { color:#fff !important; }
    .fireweb-navbar .brand-logos { display:flex; align-items:center; gap:8px; }
    .fireweb-navbar .brand-logos img { height:32px !important; width:auto !important; display:block; object-fit:contain !important; }
    .qr-shell { display:grid; grid-template-columns:280px minmax(0,1fr); gap:20px; padding:20px; }
    .side-card, .content-card { background:#fff; border:0; border-radius:22px; box-shadow:0 18px 40px rgba(15,23,42,.08); }
    .side-card { padding:18px; position:sticky; top:20px; height:fit-content; }
    .content-card { padding:20px; }
    .menu-title { font-size:13px; font-weight:800; color:#64748b; letter-spacing:.04em; text-transform:uppercase; margin-bottom:10px; }
    .equip-menu { display:grid; gap:8px; }
    .equip-btn {
      width:100%; border:1px solid rgba(148,163,184,.24); border-radius:16px; background:#f8fafc; padding:14px 16px;
      display:flex; justify-content:space-between; align-items:center; font-weight:800; color:#0f172a; text-align:left;
    }
    .equip-btn.active { background:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%); color:#fff; border-color:transparent; box-shadow:0 14px 26px rgba(79,70,229,.24); }
    .equip-btn .count { font-size:12px; opacity:.82; }
    .filter-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .filter-box label { display:block; font-size:13px; font-weight:800; color:#475569; margin-bottom:6px; }
    .filter-box select, .filter-box input { width:100%; min-height:44px; border:1px solid rgba(148,163,184,.28); border-radius:14px; padding:10px 12px; }
    .filter-box[hidden] { display:none !important; }
    .filter-actions { display:flex; gap:10px; align-items:flex-end; }
    .summary-bar { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:18px; }
    .summary-title { display:none; }
    .summary-sub { display:none; }
    .section-block + .section-block { margin-top:24px; }
    .section-head { display:none; }
    /* 소화기 QR: 화면/출력 모두 가로 한 줄 4개 고정 */
    .qr-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .qr-grid[data-equip-key="ext"] { grid-template-columns:repeat(4,minmax(0,1fr)); }
    /* 소화전/수신기/소방펌프: 2x3 grid */
    .qr-grid.large { grid-template-columns:repeat(2,1fr); gap:8px; }
    .qr-card {
      background:#fff; border:1px solid rgba(148,163,184,.18); border-radius:14px; padding:8px;
      display:flex; align-items:center; justify-content:center;
    }
    .qr-card-row { display:flex; flex-direction:column; align-items:center; }
    .qr-img {
      border-radius:8px; background:#fff;
      display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
    }
    /* 소화기 QR 이미지: 작게 */
    .qr-grid:not(.large) .qr-img { width:100px; height:100px; }
    /* 소화전/수신기/소방펌프 QR 이미지 – 화면에서도 카드에 맞게 */
    .qr-grid.large .qr-img { width:260px; height:260px; }
    .qr-img img { width:100%; height:100%; object-fit:contain; display:block; }
    .qr-meta {
      margin-top:6px; font-size:12px; font-weight:700; color:#334155; text-align:center;
      width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .qr-grid.large .qr-meta { font-size:14px; margin-top:8px; }
    .qr-meta .meta-blank {
      display:inline-block; border-bottom:1px solid #94a3b8; min-width:80px;
      font-weight:400; color:#94a3b8;
    }
    .qr-grid.large .qr-meta .meta-blank { min-width:140px; }
    .empty-state { padding:22px; border-radius:18px; background:#f8fafc; color:#64748b; text-align:center; }
    body.modal-open { overflow:hidden !important; padding-right:0 !important; }
    #spkQrDetailModal .modal-header { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; border-bottom:0; }
    #spkQrDetailModal .btn-close { filter:invert(1) grayscale(100%) brightness(200%); }
    #spkQrDetailModal .modal-body { background:#f8fafc; }
    .spk-qr-section { background:#fff; border:1px solid rgba(148,163,184,.18); border-radius:18px; padding:16px; box-shadow:0 14px 28px rgba(15,23,42,.06); }
    .spk-qr-section + .spk-qr-section { margin-top:14px; }
    .spk-qr-section-title { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:12px; }
    .spk-qr-section-title strong { font-weight:900; color:#1e293b; }
    .spk-qr-section-title span { font-size:.82rem; font-weight:800; color:#64748b; }
    .spk-qr-detail-grid { display:grid; gap:10px; }
    .spk-qr-detail-item { display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:#f8fbff; }
    .spk-qr-detail-label { width:96px; flex:0 0 96px; font-size:.82rem; font-weight:900; color:#64748b; }
    .spk-qr-detail-value { min-width:0; font-weight:800; color:#0f172a; word-break:break-word; }
    .spk-qr-media-box { border:1px solid rgba(148,163,184,.18); border-radius:16px; background:#fff; padding:12px; min-height:120px; display:flex; align-items:center; justify-content:center; }
    .spk-qr-media-box img { max-width:100%; object-fit:contain; display:block; }
    .spk-qr-equipment-img { width:100%; max-height:300px; border-radius:12px; background:#fff; }
    .spk-qr-map-canvas { position:relative; width:100%; height:320px; overflow:hidden; border:1px solid rgba(148,163,184,.28); border-radius:14px; background:#f1f5f9; }
    .spk-qr-map-canvas img { width:100%; height:100%; object-fit:fill; display:block; }
    .spk-qr-map-marker { position:absolute; width:28px; height:28px; transform:translate(-50%,-50%); border-radius:50%; background:rgba(102,126,234,.18); border:3px solid rgba(102,126,234,.85); box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 6px 16px rgba(37,99,235,.35); }
    .spk-qr-status { display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:.78rem; font-weight:900; }
    .spk-qr-ok { background:#dcfce7; color:#166534; }
    .spk-qr-bad { background:#fee2e2; color:#991b1b; }
    .spk-qr-warn { background:#fef3c7; color:#92400e; }
    .spk-qr-muted { background:#e5e7eb; color:#475569; }
    @media (max-width: 991px) {
      .qr-shell { grid-template-columns:1fr; }
      .side-card { position:static; }
      .filter-grid { grid-template-columns:1fr 1fr; }
      .summary-bar { flex-direction:column; align-items:flex-start; }
    }
    @media (max-width: 767px) {
      .filter-grid { grid-template-columns:1fr; }
      .qr-grid { grid-template-columns:repeat(2,1fr); }
      .qr-grid.large { grid-template-columns:1fr; }
    }
    /* 페이지별 높이 맞춤 (인쇄 최적화) */
    .qr-grid.large .qr-card { min-height:auto; padding:4px; }
    .qr-grid:not(.large) .qr-card { min-height:140px; }

    /* === 인쇄 모드 === */
    @media print {
      @page { size:A4 portrait; margin:8mm; }
      body { background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin:0; }
      header, .side-card, .summary-bar, .filter-grid, .section-head,
      .fireweb-navbar, #btnPrint, #btnApply { display:none !important; }
      .qr-shell { display:block !important; padding:0 !important; }
      .content-card { box-shadow:none !important; border-radius:0 !important; padding:0 !important; }
      .section-block { margin:0 !important; }
      /* 소화기 QR 출력: 가로 한 줄 4개 고정 */
      .qr-grid,
      .qr-grid[data-equip-key="ext"] { grid-template-columns:repeat(4,minmax(0,1fr)) !important; gap:6px !important; }
      /* 소화전/수신기/소방펌프: 2열 고정, 3행이 한 페이지에 들어가도록 */
      .qr-grid.large { grid-template-columns:repeat(2,1fr) !important; gap:2px 6px !important; }
      .qr-grid.large .qr-card {
        break-inside:avoid; page-break-inside:avoid;
        padding:2px !important; border:1px solid #cbd5e1 !important;
        height:calc((100vh - 16mm) / 3 - 2px);
        box-sizing:border-box;
        display:flex; align-items:center; justify-content:center;
      }
      .qr-grid.large .qr-card .qr-card-row { align-items:center; }
      .qr-grid.large .qr-img { width:calc((100vh - 16mm) / 3 - 18px) !important; height:calc((100vh - 16mm) / 3 - 18px) !important; max-width:92mm !important; max-height:92mm !important; }
      .qr-grid.large .qr-meta { font-size:9px !important; margin-top:0px !important; line-height:1.1; }
      /* 6개마다 페이지 나눔 */
      .qr-grid.large .qr-card:nth-child(6n+1) { break-before:page; }
      .qr-grid.large .qr-card:nth-child(1) { break-before:auto; }
      /* 소화기 카드: 가로 4열에 맞춰 크기 축소 */
      .qr-grid:not(.large) .qr-card {
        break-inside:avoid; page-break-inside:avoid;
        min-height:0 !important; padding:3px !important;
        border:1px solid #cbd5e1 !important; box-sizing:border-box;
      }
      /* 소화기 QR 이미지: A4 4열(194mm/4≈48mm)에 맞게 약 36mm */
      .qr-grid:not(.large) .qr-img {
        width:calc((100vw - 16mm) / 4 - 12px) !important;
        height:calc((100vw - 16mm) / 4 - 12px) !important;
        max-width:40mm !important; max-height:40mm !important;
      }
      .qr-card { break-inside:avoid; border:1px solid #cbd5e1 !important; page-break-inside:avoid; }
      .qr-grid:not(.large) .qr-meta { font-size:8px !important; margin-top:2px !important; line-height:1.1; }
      .qr-meta { display:block !important; }
      .qr-meta .meta-blank { border-bottom:1px solid #94a3b8 !important; }
    }
  </style>
</head>
<body>

  <aside class="side-card">

  <section class="content-card">
    <div class="summary-bar">
      <div>
        <h1 class="summary-title" id="pageTitle">QR 코드 관리</h1>
        <div class="summary-sub" id="pageSub">설비별 QR을 조회하고, 미등록 QR도 바로 확인할 수 있습니다.</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/extinguisher-modal-host.js"></script>
<script src="/js/hydrant-modal-host.js"></script>
<script src="/js/receiver-modal-host.js"></script>
<script src="/js/pump-modal-host.js"></script>
<script src="/js/csrf.js"></script>
<script src="/js/common-nav.js"></script>
<script>
(function () {
  const API_BASE = '/fire-api';
  const EQUIPMENT = {
    ext: { key: 'ext', label: '소화기', listKey: 'extinguishers', qrType: 'ext', large: false },
    hyd: { key: 'hyd', label: '소화전', listKey: 'hydrants', qrType: 'hyd', large: true },
    rcv: { key: 'rcv', label: '수신기', listKey: 'receivers', qrType: 'rcv', large: true },
    pmp: { key: 'pmp', label: '소방펌프', listKey: 'pumps', qrType: 'pmp', large: true },
    spk: { key: 'spk', label: '스프링클러', listKey: 'sprinklers', qrType: 'spk', large: true }
  };

  let currentUser = null;
  let currentEquip = 'ext';
  let latestListData = {};
  let buildingFloors = [];  /* [{buildingId, buildingName, floors:[{floorId,floorName},...]}] */
  let isFireAdmin = false; /* FIRE_ADMIN 아이디 기반 권한 */

  function escHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function authHeaders(extra) {
    return { ...(extra || {}) };
  }

  async function apiFetch(url, opts = {}) {
    try {
      if (window.FireWebCsrf?.isMutation?.(opts.method)) {
        await window.FireWebCsrf.ensureToken();
      }
      const headers = window.FireWebCsrf?.headers(authHeaders(opts.headers), opts.method) || authHeaders(opts.headers);
      const res = await fetch(url, { ...opts, headers });
      if (res.status === 401) {
        localStorage.removeItem('fireweb_user');
        localStorage.removeItem('fw_user');
        (window.FireWebCsrf?.goLogin||function(){location.href='/index.html'})();
        return null;
      }
      if (res.status === 403) {
        window.location.href = '/fire-map.html';
        return null;
      }
      return res.json();
    } catch (err) {
      console.error('[QR] apiFetch error:', url, err);
      return null;
    }
  }

  function loadCurrentUser() {
    try {
      currentUser = JSON.parse(localStorage.getItem('fireweb_user') || localStorage.getItem('fw_user') || 'null');
    } catch (_) {
      currentUser = null;
    }
    return currentUser;
  }

  function canManageUser() {
    return currentUser?.canManage !== false;
  }

  function canAccessQr() {
    return isFireAdmin;
  }

  async function loadFireAdminPermission() {
    try {
      const res = await apiFetch('/api/codes/lookup/FIRE_PERM');
      if (res?.data) {
        const fireAdmin = res.data.find(d => d.code === 'FIRE_ADMIN');
        if (fireAdmin?.extraValue1) {
          const ids = fireAdmin.extraValue1.split(',').map(s => s.trim());
          isFireAdmin = ids.includes(currentUser?.loginId);
        }
      }
    } catch(e) { console.warn('FIRE_ADMIN 권한 조회 실패', e); }
  }

  function qrImgUrl(type, id) {
    return API_BASE + '/qr/image?type=' + encodeURIComponent(type) + '&id=' + encodeURIComponent(id);
  }

  function isTextSearchEquip() {
    return currentEquip === 'rcv' || currentEquip === 'pmp';
  }

  function getKeywordValue() {
    return String(document.getElementById('filterKeyword')?.value || '').trim().toLowerCase();
  }

  function matchesKeyword(item, keyword) {
    if (!keyword) return true;
    return String(item?.buildingName || '').toLowerCase().includes(keyword);
  }

  function updateFilterMode() {
    const buildingBox = document.getElementById('filterBuilding')?.closest('.filter-box');
    const floorBox = document.getElementById('filterFloor')?.closest('.filter-box');
    const keywordBox = document.getElementById('keywordFilterBox');
    if (!buildingBox || !floorBox || !keywordBox) return;
    const textMode = isTextSearchEquip();
    buildingBox.hidden = textMode;
    floorBox.hidden = textMode;
    keywordBox.hidden = !textMode;
    if (textMode) {
      document.getElementById('filterBuilding').value = '';
      document.getElementById('filterFloor').value = '';
    } else {
      document.getElementById('filterKeyword').value = '';
    }
  }

  function registeredCardHtml(type, qrKey, buildingName, floorName, itemId, extraMeta) {
    var meta = '';
    if (buildingName) {
      meta = escHtml(buildingName);
      if (floorName) meta += ' / ' + escHtml(floorName);
    }
    if (extraMeta) meta += (meta ? ' / ' : '') + escHtml(extraMeta);
    return '' +
      '<div class="qr-card" data-qr-type="' + escHtml(type) + '" data-qr-id="' + escHtml(String(itemId || '')) + '" style="cursor:pointer;">' +
      '  <div class="qr-card-row">' +
      '    <div class="qr-img"><img alt="QR" src="' + qrImgUrl(type, qrKey) + '" loading="lazy" /></div>' +
      '    <div class="qr-meta">' + (meta || '-') + '</div>' +
      '  </div>' +
      '</div>';
  }

  function unregisteredCardHtml(type, qrKey) {
    return '' +
      '<div class="qr-card">' +
      '  <div class="qr-card-row">' +
      '    <div class="qr-img"><img alt="QR" src="' + qrImgUrl(type, qrKey) + '" loading="lazy" /></div>' +
      '    <div class="qr-meta">건물 : <span class="meta-blank">&nbsp;</span></div>' +
      '  </div>' +
      '</div>';
  }

  function renderMenu() {
    const menu = document.getElementById('equipMenu');
    if (!menu) return;
    menu.innerHTML = Object.values(EQUIPMENT).map((item) => {
      const count = Array.isArray(latestListData[item.listKey]) ? latestListData[item.listKey].length : 0;
      return '' +
        '<button type="button" class="equip-btn' + (currentEquip === item.key ? ' active' : '') + '" data-equip="' + item.key + '">' +
        '  <span>' + item.label + '</span>' +
        '  <span class="count">' + count + '건</span>' +
        '</button>';
    }).join('');
  }

  function renderCurrentSection(unregisteredList) {
    const conf = EQUIPMENT[currentEquip];
    const registeredWrap = document.getElementById('registeredWrap');
    const unregisteredSection = document.getElementById('unregisteredSection');
    const unregisteredWrap = document.getElementById('unregisteredWrap');
    const gridClass = conf.large ? 'qr-grid large' : 'qr-grid';
    const gridEquipKey = conf.key || currentEquip;

    /* 미등록 QR이 있으면 미등록만 표시, 등록된 설비는 숨김 */
    if (Array.isArray(unregisteredList) && unregisteredList.length) {
      registeredWrap.className = '';
      registeredWrap.style.display = 'none';
      registeredWrap.innerHTML = '';
      unregisteredSection.style.display = '';
      unregisteredWrap.className = gridClass;
      unregisteredWrap.dataset.equipKey = gridEquipKey;
      registeredWrap.removeAttribute('data-equip-key');
      unregisteredWrap.innerHTML = unregisteredList.map(function (qrKey) {
        return unregisteredCardHtml(conf.key, qrKey);
      }).join('');
    } else {
      /* 미등록 QR 수량 0이면 등록된 설비 QR 표시 */
      const rawItems = Array.isArray(latestListData[conf.listKey]) ? latestListData[conf.listKey] : [];
      const keyword = getKeywordValue();
      const items = isTextSearchEquip() ? rawItems.filter(function (item) { return matchesKeyword(item, keyword); }) : rawItems;
      registeredWrap.style.display = '';
      unregisteredSection.style.display = 'none';
      unregisteredWrap.innerHTML = '';
      unregisteredWrap.removeAttribute('data-equip-key');
      if (!items.length) {
        registeredWrap.className = 'empty-state';
        registeredWrap.removeAttribute('data-equip-key');
        registeredWrap.innerHTML = '조회된 ' + conf.label + ' QR이 없습니다.';
      } else {
        registeredWrap.className = gridClass;
        registeredWrap.dataset.equipKey = gridEquipKey;
        registeredWrap.innerHTML = items.map(function (item) {
          var qrKey = item.qrKey || item.noteKey || '';
          var itemId = item.extinguisherId || item.hydrantId || item.receiverId || item.pumpId || item.sprinklerId || '';
          var extraMeta = '';
          if (currentEquip === 'ext') extraMeta = item.note || '';
          else if (currentEquip === 'hyd') extraMeta = item.locationDescription || '';
          else if (currentEquip === 'spk') extraMeta = item.note || '';
          else extraMeta = item.locationDescription || '';
          return registeredCardHtml(conf.key, qrKey, item.buildingName, item.floorName, itemId, extraMeta);
        }).join('');
      }
    }
  }

  async function loadFilters() {
    try {
      const res = await apiFetch(API_BASE + '/maps/building-floors');
      buildingFloors = (res && res.data) ? res.data : [];
      const buildingSel = document.getElementById('filterBuilding');
      buildingSel.innerHTML = '<option value="">전체</option>';
      buildingFloors.forEach(function (b) {
        var opt = document.createElement('option');
        opt.value = b.buildingId;
        opt.textContent = b.buildingName;
        buildingSel.appendChild(opt);
      });
      updateFloorOptions();
    } catch (err) {
      console.error('[QR] loadFilters error:', err);
    }
    return true;
  }

  function updateFloorOptions() {
    var floorSel = document.getElementById('filterFloor');
    var selectedBuilding = document.getElementById('filterBuilding').value;
    var prevFloor = floorSel.value;
    floorSel.innerHTML = '<option value="">전체</option>';
    var floors = [];
    if (selectedBuilding) {
      var found = buildingFloors.find(function (b) { return String(b.buildingId) === String(selectedBuilding); });
      if (found && Array.isArray(found.floors)) floors = found.floors;
    } else {
      /* 전체 선택 시: 모든 건물의 층을 중복 없이 합산 */
      var seen = {};
      buildingFloors.forEach(function (b) {
        if (!Array.isArray(b.floors)) return;
        b.floors.forEach(function (f) {
          if (!seen[f.floorId]) {
            seen[f.floorId] = true;
            floors.push(f);
          }
        });
      });
    }
    floors.forEach(function (f) {
      var opt = document.createElement('option');
      opt.value = f.floorId;
      opt.textContent = f.floorName;
      floorSel.appendChild(opt);
    });
    /* 이전 선택 유지 시도 */
    if (prevFloor) {
      var exists = Array.from(floorSel.options).some(function (o) { return o.value === prevFloor; });
      floorSel.value = exists ? prevFloor : '';
    }
  }

  async function loadData() {
    try {
      const buildingId = document.getElementById('filterBuilding').value;
      const floorId = document.getElementById('filterFloor').value;
      const unregisteredCount = Math.max(0, Math.min(500, parseInt(document.getElementById('unregisteredCount').value || '0', 10) || 0));
      const listParams = new URLSearchParams();
      if (!isTextSearchEquip()) {
        if (buildingId) listParams.set('buildingId', buildingId);
        if (floorId) listParams.set('floorId', floorId);
      }
      const listRes = await apiFetch(API_BASE + '/qr/list' + (listParams.toString() ? ('?' + listParams.toString()) : ''));
      if (listRes && listRes.data) {
        latestListData = listRes.data;
      }
      renderMenu();

      let unregisteredList = [];
      if (unregisteredCount > 0) {
        const countParams = new URLSearchParams({
          extCount: currentEquip === 'ext' ? String(unregisteredCount) : '0',
          hydCount: currentEquip === 'hyd' ? String(unregisteredCount) : '0',
          receiverCount: currentEquip === 'rcv' ? String(unregisteredCount) : '0',
          pumpCount: currentEquip === 'pmp' ? String(unregisteredCount) : '0',
          sprinklerCount: currentEquip === 'spk' ? String(unregisteredCount) : '0'
        });
        const unregisteredRes = await apiFetch(API_BASE + '/qr/unregistered-serials?' + countParams.toString());
        if (unregisteredRes?.data) {
          if (currentEquip === 'ext') unregisteredList = unregisteredRes.data.unregisteredExtSerials || [];
          if (currentEquip === 'hyd') unregisteredList = unregisteredRes.data.unregisteredHydSerials || [];
          if (currentEquip === 'rcv') unregisteredList = unregisteredRes.data.unregisteredReceiverSerials || [];
          if (currentEquip === 'pmp') unregisteredList = unregisteredRes.data.unregisteredPumpSerials || [];
          if (currentEquip === 'spk') unregisteredList = unregisteredRes.data.unregisteredSprinklerSerials || [];
        }
      }

      renderCurrentSection(unregisteredList);
    } catch (err) {
      console.error('[QR] loadData error:', err);
      renderMenu();
      renderCurrentSection([]);
    }
  }

  function valHtml(v) {
    return v === null || v === undefined || v === '' ? '-' : escHtml(v);
  }

  function fmtDate(v) {
    return v ? escHtml(String(v).slice(0, 10)) : '-';
  }

  function fmtTime(v) {
    return v ? escHtml(String(v).slice(0, 5)) : '-';
  }

  function fmtCoord(x, y) {
    if (x === null || x === undefined || y === null || y === undefined || x === '' || y === '') return '-';
    return Number(x).toFixed(2) + ', ' + Number(y).toFixed(2);
  }

  function sprinklerStatusBadge(d) {
    if (!d?.lastInspectionDate) return '<span class="spk-qr-status spk-qr-muted">미점검</span>';
    return d.lastIsFaulty ? '<span class="spk-qr-status spk-qr-bad">불량</span>' : '<span class="spk-qr-status spk-qr-ok">정상</span>';
  }

  function sprinklerHistoryRow(row) {
    const badge = row?.isFaulty ? '<span class="spk-qr-status spk-qr-bad">불량</span>' : '<span class="spk-qr-status spk-qr-ok">양호</span>';
    return '<tr>' +
      '<td>' + fmtDate(row?.inspectionDate) + '</td>' +
      '<td>' + fmtTime(row?.inspectionTime) + '</td>' +
      '<td>' + valHtml(row?.inspectorName) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td class="text-danger small">' + valHtml(row?.faultReason) + '</td>' +
      '<td>' + valHtml(row?.note) + '</td>' +
      '</tr>';
  }

  async function resolveSprinklerPlanImage(d) {
    if (!d?.buildingId || !d?.floorId) return '';
    try {
      const params = new URLSearchParams({ buildingId:String(d.buildingId), floorId:String(d.floorId) });
      const res = await apiFetch(API_BASE + '/maps/floor-data?' + params.toString());
      return res?.data?.planImagePath || '';
    } catch (err) {
      console.warn('[QR] sprinkler map load failed', err);
      return '';
    }
  }

  async function openSprinklerDetail(id) {
    const modalEl = document.getElementById('spkQrDetailModal');
    const body = document.getElementById('spkQrDetailBody');
    if (!modalEl || !body) return;
    body.innerHTML = '<div class="text-center text-muted py-5">스프링클러 상세 정보를 불러오는 중...</div>';
    bootstrap.Modal.getOrCreateInstance(modalEl).show();

    const res = await apiFetch(API_BASE + '/sprinklers/' + encodeURIComponent(id));
    const d = res?.data;
    if (!d) {
      body.innerHTML = '<div class="empty-state">스프링클러 상세 정보를 불러오지 못했습니다.</div>';
      return;
    }

    const planImagePath = await resolveSprinklerPlanImage(d);
    const imagePath = d.imagePath || '/images/sprinkler.png';
    const qrKey = String(d.qrKey || '').trim();
    const qrUrl = qrKey ? (API_BASE + '/qr/image?type=spk&id=' + encodeURIComponent(qrKey)) : '';
    const hasMarker = planImagePath && d.x !== null && d.x !== undefined && d.y !== null && d.y !== undefined;
    const markerHtml = hasMarker ? '<div class="spk-qr-map-marker" style="left:' + Number(d.x) + '%;top:' + Number(d.y) + '%;"></div>' : '';
    const historyRows = Array.isArray(d.inspections) && d.inspections.length
      ? d.inspections.map(sprinklerHistoryRow).join('')
      : '<tr><td colspan="6" class="text-center text-muted py-4">등록된 점검 이력이 없습니다.</td></tr>';

    body.innerHTML = `
      <div class="container-fluid">
        <div class="row g-4">
          <div class="col-lg-6 d-flex flex-column gap-3">
            <section class="spk-qr-section" aria-label="스프링클러 기본 정보">
              <div class="spk-qr-section-title"><strong>기본 정보</strong><span>${valHtml(d.serialNumber)}</span></div>
              <div class="spk-qr-detail-grid">
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">관리번호</div><div class="spk-qr-detail-value">${valHtml(d.serialNumber)}</div></div>
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">건물 / 층</div><div class="spk-qr-detail-value">${valHtml(d.buildingName)} / ${valHtml(d.floorName)}</div></div>
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">도면 좌표</div><div class="spk-qr-detail-value">${fmtCoord(d.x, d.y)}</div></div>
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">상태</div><div class="spk-qr-detail-value">${sprinklerStatusBadge(d)} ${d.inspectionRequired ? '<span class="spk-qr-status spk-qr-warn ms-1">점검필요</span>' : ''}</div></div>
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">비고</div><div class="spk-qr-detail-value">${valHtml(d.note)}</div></div>
              </div>
            </section>
            <section class="spk-qr-section" aria-label="스프링클러 점검 정보">
              <div class="spk-qr-section-title"><strong>점검 정보</strong><span>최근 상태</span></div>
              <div class="spk-qr-detail-grid">
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">최종점검</div><div class="spk-qr-detail-value">${fmtDate(d.lastInspectionDate)} ${d.lastInspectorName ? '/ ' + escHtml(d.lastInspectorName) : ''}</div></div>
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">고장사유</div><div class="spk-qr-detail-value">${valHtml(d.lastFaultReason)}</div></div>
                <div class="spk-qr-detail-item"><div class="spk-qr-detail-label">점검비고</div><div class="spk-qr-detail-value">${valHtml(d.lastInspectionNote)}</div></div>
              </div>
            </section>
            <section class="spk-qr-section" aria-label="스프링클러 점검 이력">
              <div class="spk-qr-section-title"><strong>점검 이력</strong><span>읽기 전용</span></div>
              <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead class="table-dark"><tr><th>점검일</th><th>시간</th><th>점검자</th><th>결과</th><th>고장사유</th><th>비고</th></tr></thead><tbody>${historyRows}</tbody></table></div>
            </section>
          </div>
          <div class="col-lg-6 d-flex flex-column gap-3">
            <section class="spk-qr-section" aria-label="스프링클러 이미지">
              <div class="spk-qr-section-title"><strong>이미지</strong><span>대표 이미지</span></div>
              <div class="spk-qr-media-box"><img class="spk-qr-equipment-img" src="${escHtml(imagePath)}" alt="스프링클러 이미지" onerror="this.src='/images/sprinkler.png'"></div>
            </section>
            <section class="spk-qr-section" aria-label="스프링클러 도면 위치">
              <div class="spk-qr-section-title"><strong>도면 위치</strong></div>
              ${planImagePath ? `<div class="spk-qr-map-canvas"><img src="${escHtml(planImagePath)}" alt="도면">${markerHtml}</div>` : '<div class="empty-state">등록된 도면을 찾을 수 없습니다.</div>'}
            </section>
            ${qrUrl ? `<section class="spk-qr-section" aria-label="스프링클러 QR"><div class="spk-qr-section-title"><strong>QR</strong><span>${escHtml(qrKey)}</span></div><div class="spk-qr-media-box"><img src="${qrUrl}" alt="스프링클러 QR" style="width:180px;height:180px;"></div></section>` : ''}
          </div>
        </div>
      </div>`;
  }

  function openQrDetails(type, id) {
    if (!type || !id) return;
    if (type === 'ext') {
      window.FireWebExtinguisherModal?.open({ mode: 'details', id });
      return;
    }
    if (type === 'hyd') {
      window.FireWebHydrantModal?.open({ mode: 'details', id });
      return;
    }
    if (type === 'rcv') {
      window.FireWebReceiverModal?.open({ mode: 'details', id });
      return;
    }
    if (type === 'spk') {
      openSprinklerDetail(id);
      return;
    }
    window.FireWebPumpModal?.open({ mode: 'details', id });
  }

  function printCurrentQrSection() {
    window.print();
  }

  function bindEvents() {
    document.getElementById('btnApply')?.addEventListener('click', loadData);
    document.getElementById('btnPrint')?.addEventListener('click', printCurrentQrSection);
    document.getElementById('equipMenu')?.addEventListener('click', (event) => {
      const btn = event.target.closest('.equip-btn[data-equip]');
      if (!btn) return;
      currentEquip = btn.dataset.equip;
      updateFilterMode();
      loadData();
    });
    document.getElementById('filterBuilding')?.addEventListener('change', function () {
      updateFloorOptions();
    });
    document.getElementById('filterKeyword')?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        loadData();
      }
    });
    document.addEventListener('click', (event) => {
      const card = event.target.closest('.qr-card[data-qr-type][data-qr-id]');
      if (!card) return;
      openQrDetails(card.dataset.qrType, card.dataset.qrId);
    });
  }

  function renderNav() {
    const area = document.getElementById('navAccountArea');
    if (!area) return;
    const username = currentUser?.displayName || currentUser?.username || '';
    if (!username) {
      area.innerHTML = '<li class="nav-item"><a class="nav-link account-link" href="#" onclick="(window.FireWebCsrf&amp;&amp;window.FireWebCsrf.goLogin||function(){location.href=&#39;/index.html&#39;})();return false;">로그인</a></li>';
      return;
    }
    area.innerHTML = '' +
      '<li class="nav-item dropdown">' +
      '  <a class="nav-link dropdown-toggle account-link" href="#" data-bs-toggle="dropdown">' + escHtml(username) + '</a>' +
      '  <ul class="dropdown-menu dropdown-menu-end">' +
      '    <li><a class="dropdown-item" href="#" id="btnLogout">로그아웃</a></li>' +
      '  </ul>' +
      '</li>';
    document.getElementById('btnLogout')?.addEventListener('click', () => window.FireWebNav?.logout?.());
  }

  async function init() {
    loadCurrentUser();
    if (!currentUser) {
      (window.FireWebCsrf?.goLogin||function(){location.href='/index.html'})();
      return;
    }
    await loadFireAdminPermission();
    if (!canAccessQr()) {
      window.location.href = '/fire-map.html';
      return;
    }
    renderNav();
    renderMenu();
    bindEvents();
    await loadFilters();
    updateFilterMode();
    await loadData();
  }

  window.FireWebNav?.mount?.();
  init();
})();
</script>
</body>
</html>
