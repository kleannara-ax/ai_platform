<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>에어컨 QR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--brand:#2563eb;--brand2:#0f766e;--ink:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#dbeafe 0%,#f8fafc 42%,#fff 100%);color:var(--ink)}.mobile-shell{width:min(100%,560px);margin:0 auto;min-height:100vh;padding:18px 16px 28px}.hero{border-radius:28px;background:linear-gradient(135deg,#2563eb 0%,#0f766e 100%);color:#fff;padding:24px 20px;box-shadow:0 18px 40px rgba(37,99,235,.26)}.hero .eyebrow{font-size:.86rem;font-weight:900;opacity:.78}.hero h1{font-size:1.62rem;font-weight:950;margin:.25rem 0 .35rem}.hero p{margin:0;color:rgba(255,255,255,.78);font-weight:700;line-height:1.45}.cardx{border:0;border-radius:24px;background:#fff;box-shadow:0 16px 36px rgba(15,23,42,.08);overflow:hidden}.cardx+.cardx{margin-top:14px}.cardx .card-body{padding:18px}.section-title{font-size:.95rem;font-weight:950;color:#1e293b;margin-bottom:12px}.info-grid{display:grid;gap:9px}.info-row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:#f8fafc}.info-row span:first-child{font-size:.8rem;font-weight:900;color:var(--muted);flex:0 0 92px}.info-row span:last-child{font-weight:900;text-align:right;word-break:break-word}.form-label{font-weight:900;color:#334155}.form-control,.form-select{border-radius:16px;border-color:#cbd5e1;min-height:48px}.btn-main{border:0;border-radius:18px;min-height:54px;font-weight:950;background:linear-gradient(135deg,#2563eb,#0f766e);box-shadow:0 14px 28px rgba(37,99,235,.22)}.empty{padding:26px 14px;border-radius:20px;background:#fff;text-align:center;color:var(--muted);font-weight:800}.history{display:grid;gap:8px}.history-item{padding:11px 12px;border-radius:14px;background:#f8fafc}.history-item strong{display:block;font-size:.9rem}.history-item span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}.success-box{border-radius:24px;background:#ecfdf5;color:#166534;padding:22px;text-align:center;font-weight:900}.preview{max-width:100%;border-radius:16px;margin-top:10px;display:none}.hint{font-size:.86rem;color:#64748b;font-weight:800;margin-top:6px;line-height:1.45}.qr-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;word-break:break-all;color:#475569}
  </style>
</head>
<body>
<main class="mobile-shell">
  <section class="hero mb-3"><div class="eyebrow">설비관리시스템 모바일 QR</div><h1 id="pageTitle">에어컨 QR</h1><p id="pageDesc">등록된 QR은 점검 처리, 미등록 QR은 신규 에어컨 등록으로 연결됩니다.</p></section>
  <section id="stateBox" class="empty">설비 정보를 불러오는 중...</section>
  <section id="content" style="display:none"></section>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const qrKey = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let submitting = false, buildingFloors = [];
  function setState(html,danger=false){$('stateBox').className='empty'+(danger?' text-danger':'');$('stateBox').innerHTML=html;$('stateBox').style.display='block';$('content').style.display='none'}
  function show(html){$('stateBox').style.display='none';$('content').innerHTML=html;$('content').style.display='block'}
  function row(label,value){return `<div class="info-row"><span>${esc(label)}</span><span>${esc(value||'-')}</span></div>`}
  function fmtDateTime(v){return v?String(v).replace('T',' ').slice(0,16):'-'}
  function today(){return new Date().toISOString().slice(0,10)}
  async function loadBuildingFloors(){try{const r=await fetch('/fire-api/maps/building-floors');const j=await r.json();buildingFloors=Array.isArray(j?.data)?j.data:[]}catch(_){buildingFloors=[]}}
  function buildingOptions(){return '<option value="">선택</option>'+buildingFloors.map(b=>`<option value="${esc(b.buildingId)}">${esc(b.buildingName)}</option>`).join('')}
  function floorOptions(buildingId){const b=buildingFloors.find(x=>String(x.buildingId)===String(buildingId));const floors=b&&Array.isArray(b.floors)?b.floors:[];return '<option value="">선택</option>'+floors.map(f=>`<option value="${esc(f.floorId)}">${esc(f.floorName)}</option>`).join('')}
  function attachPreview(inputId,imgId){$(inputId)?.addEventListener('change',()=>{const f=$(inputId).files?.[0], img=$(imgId); if(!f){img.style.display='none';img.removeAttribute('src');return} img.src=URL.createObjectURL(f);img.style.display='block'})}

  function getAuthToken(){
    const keys=['fireweb_user','fw_user','auth'];
    for(const k of keys){
      try{const raw=localStorage.getItem(k)||sessionStorage.getItem(k); if(!raw)continue; const obj=JSON.parse(raw); const t=obj?.token||obj?.accessToken||obj?.access_token||obj?.data?.accessToken; if(t&&String(t).split('.').length===3)return String(t)}catch(_){ }
    }
    for(const k of ['fireweb_token','fw_token','accessToken','token']){const t=localStorage.getItem(k)||sessionStorage.getItem(k); if(t&&String(t).split('.').length===3)return String(t)}
    return ''
  }
  function authHeaders(){const t=getAuthToken(); return t?{'Authorization':'Bearer '+t}:{}}
  function renderLoginRequired(){
    $('pageTitle').textContent='로그인 필요'; $('pageDesc').textContent='미등록 QR 최초 등록은 로그인 후에만 가능합니다.';
    const returnUrl=encodeURIComponent(location.pathname);
    show(`<article class="cardx"><div class="card-body text-center"><div class="section-title">최초 등록 권한 확인</div><p class="text-muted fw-bold mb-3">이 QR은 아직 설비에 연결되지 않았습니다.<br>관리자 또는 권한 있는 사용자로 로그인한 뒤 등록해 주세요.</p><a class="btn btn-primary btn-main w-100" href="/index.html?returnUrl=${returnUrl}">로그인하러 가기</a></div></article>`)
  }
  function addMapCssOnce(){
    if(document.getElementById('mobileMapCss'))return;
    const style=document.createElement('style'); style.id='mobileMapCss'; style.textContent=`.map-select-box{border:1px solid #dbe4ef;border-radius:18px;padding:12px;background:#f8fafc}.map-viewport{position:relative;width:100%;height:280px;overflow:hidden;border-radius:16px;background:#e2e8f0;touch-action:none;user-select:none}.map-content{position:absolute;left:0;top:0;transform-origin:0 0}.map-content img{display:block;max-width:none;width:100%;height:auto;-webkit-user-drag:none;user-select:none}.map-marker{position:absolute;width:20px;height:20px;border:4px solid #ef4444;background:#fff;border-radius:999px;box-shadow:0 0 0 4px rgba(239,68,68,.22);transform:translate(-50%,-50%);display:none;pointer-events:none}.coord-pill{display:inline-flex;margin-top:8px;padding:7px 10px;border-radius:999px;background:#e0f2fe;color:#075985;font-weight:900;font-size:.82rem}.map-help{font-size:.78rem;color:#64748b;font-weight:800;margin-top:8px;line-height:1.35}`; document.head.appendChild(style)
  }
  async function loadPlanForSelection(){
    const buildingId=$('buildingId')?.value, floorId=$('floorId')?.value;
    const box=$('mapSelectBox'); if(!box)return;
    $('x').value=''; $('y').value=''; if($('mapMarker'))$('mapMarker').style.display='none';
    if(!buildingId||!floorId){box.style.display='none';return}
    try{
      const r=await fetch('/fire-api/maps/floor-data?buildingId='+encodeURIComponent(buildingId)+'&floorId='+encodeURIComponent(floorId));
      const j=await r.json().catch(()=>null); const path=j?.data?.planImagePath;
      if(!path){box.style.display='block'; $('mapViewport').style.display='none'; $('coordText').textContent='선택한 건물/층에 등록된 도면이 없습니다.'; return}
      box.style.display='block'; $('mapViewport').style.display='block'; $('planImage').src=path; $('coordText').textContent='도면에서 설비 위치를 터치하세요.'; setupMapSelector();
    }catch(_){box.style.display='block'; $('mapViewport').style.display='none'; $('coordText').textContent='도면을 불러오지 못했습니다.'}
  }
  function setupMapSelector(){
    addMapCssOnce();
    const viewport=$('mapViewport'), content=$('mapContent'), img=$('planImage'), marker=$('mapMarker'); if(!viewport||!content||!img||!marker)return;
    let scale=1, tx=0, ty=0, mode='', startX=0, startY=0, startTx=0, startTy=0, startDist=0, startScale=1, moved=false;
    function fit(){const vw=viewport.clientWidth||1; const iw=img.naturalWidth||vw; const ih=img.naturalHeight||180; content.style.width=vw+'px'; content.style.height=(vw*ih/iw)+'px'; scale=1; tx=0; ty=0; apply()}
    function apply(){content.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
    function dist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.hypot(dx,dy)}
    function selectAt(clientX,clientY){const vr=viewport.getBoundingClientRect(); const w=img.clientWidth||content.clientWidth, h=img.clientHeight||content.clientHeight; const lx=(clientX-vr.left-tx)/scale, ly=(clientY-vr.top-ty)/scale; if(lx<0||ly<0||lx>w||ly>h)return; const x=Math.max(0,Math.min(100,lx/w*100)), y=Math.max(0,Math.min(100,ly/h*100)); $('x').value=x.toFixed(4); $('y').value=y.toFixed(4); marker.style.left=x+'%'; marker.style.top=y+'%'; marker.style.display='block'; $('coordText').textContent=`선택 위치: X ${x.toFixed(2)}%, Y ${y.toFixed(2)}%`}
    img.onload=fit; if(img.complete)fit();
    viewport.ontouchstart=e=>{if(e.touches.length===2){mode='pinch';startDist=dist(e.touches);startScale=scale;startTx=tx;startTy=ty;moved=false}else if(e.touches.length===1){mode='one';startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTx=tx;startTy=ty;moved=false}};
    viewport.ontouchmove=e=>{if(mode==='pinch'&&e.touches.length===2){e.preventDefault();const next=Math.max(1,Math.min(5,startScale*(dist(e.touches)/Math.max(1,startDist))));scale=next;moved=true;apply()}else if(mode==='one'&&e.touches.length===1&&scale>1){e.preventDefault();const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;tx=startTx+dx;ty=startTy+dy;apply()}};
    viewport.ontouchend=e=>{if(mode==='one'&&!moved&&e.changedTouches?.length){selectAt(e.changedTouches[0].clientX,e.changedTouches[0].clientY)} mode=''};
    viewport.onclick=e=>{if(e.pointerType==='touch')return; selectAt(e.clientX,e.clientY)};
  }
  function validateSelectedLocation(){const viewport=$('mapViewport'), img=$('planImage'); if(viewport&&viewport.style.display!=='none'&&img?.getAttribute('src')&&(!$('x')?.value||!$('y')?.value)){alert('도면에서 설비 위치를 터치해 주세요.');return false} return true}
  function renderFault(d){
    $('pageTitle').textContent='에어컨 점검'; $('pageDesc').textContent='외부 점검자가 이름과 정상 작동 여부만 입력해 점검 완료를 처리합니다.';
    const info=row('에어컨 ID',d.equipmentCode)+row('식별 No.',d.serialNumber)+row('건물 / 층',[d.buildingName,d.floorName].filter(Boolean).join(' / '))+row('종류',d.equipmentType)+row('제조사',d.manufacturer)+row('상세 위치',d.locationDescription);
    const history=Array.isArray(d.recentFaultReports)?d.recentFaultReports:[];
    const historyHtml=history.length?history.map(h=>`<div class="history-item"><strong>${esc(fmtDateTime(h.createdAt))} 점검</strong><span>${esc(h.reporterName||'점검자 정보 없음')}</span><span>작동 상태: ${esc(h.inspectionResult||h.faultDescription||'-')}</span></div>`).join(''):'<div class="text-muted fw-bold">최근 점검 내역이 없습니다.</div>';
    show(`<article class="cardx mb-3"><div class="card-body"><div class="section-title">설비 정보</div><div class="info-grid">${info}</div></div></article><article class="cardx mb-3"><div class="card-body"><div class="section-title">에어컨 점검</div><form id="faultForm"><div class="mb-3"><label class="form-label" for="reporterName">점검자 이름 <span class="text-danger">*</span></label><input class="form-control" id="reporterName" name="reporterName" autocomplete="name" required placeholder="이름을 입력하세요"></div><div class="mb-3"><label class="form-label d-block">에어컨이 정상 작동 합니까?<br><span class="text-muted small">냉풍 및 실내 온도 하강 확인</span> <span class="text-danger">*</span></label><div class="d-grid gap-2"><label class="form-control d-flex align-items-center gap-2"><input type="radio" name="inspectionResult" value="정상" required> 정상</label><label class="form-control d-flex align-items-center gap-2"><input type="radio" name="inspectionResult" value="비정상" required> 비정상</label></div></div><button type="submit" class="btn btn-primary btn-main w-100" id="btnSubmit">점검 저장</button></form></div></article><article class="cardx"><div class="card-body"><div class="section-title">최근 점검 내역</div><div class="history">${historyHtml}</div></div></article>`);
    $('faultForm').addEventListener('submit', submitFault);
  }
  async function renderRegister(){
    if(!getAuthToken()){renderLoginRequired();return}
    $('pageTitle').textContent='에어컨 등록'; $('pageDesc').textContent='미등록 QR입니다. 로그인 사용자만 최초 등록할 수 있습니다.';
    await loadBuildingFloors(); addMapCssOnce();
    show(`<article class="cardx"><div class="card-body"><div class="section-title">미등록 QR 등록</div><div class="hint mb-2">QR 키: <span class="qr-key">${esc(qrKey)}</span></div><div class="hint mb-3">에어컨 ID는 등록 시 <b>AC-000001</b> 형식으로 자동 생성됩니다.</div><form id="registerForm"><div class="mb-3"><label class="form-label" for="serialNumber">식별 No. <span class="text-danger">*</span></label><input class="form-control" id="serialNumber" name="serialNumber" required maxlength="50" placeholder="현장 식별 No.를 입력하세요"></div><div class="row g-2"><div class="col-6 mb-3"><label class="form-label" for="buildingId">건물 <span class="text-danger">*</span></label><select class="form-select" id="buildingId" name="buildingId" required>${buildingOptions()}</select></div><div class="col-6 mb-3"><label class="form-label" for="floorId">층 <span class="text-danger">*</span></label><select class="form-select" id="floorId" name="floorId" required><option value="">건물 선택</option></select></div></div><input type="hidden" id="x" name="x"><input type="hidden" id="y" name="y"><div class="mb-3" id="mapSelectBox" style="display:none"><label class="form-label">도면 위치 선택</label><div class="map-select-box"><div class="map-viewport" id="mapViewport"><div class="map-content" id="mapContent"><img id="planImage" alt="층 도면"><div class="map-marker" id="mapMarker"></div></div></div><div class="coord-pill" id="coordText">도면에서 설비 위치를 터치하세요.</div><div class="map-help">두 손가락으로 확대/축소하고, 확대 상태에서 한 손가락으로 이동할 수 있습니다. 위치를 탭하면 좌표가 자동 저장됩니다.</div></div></div><div class="mb-3"><label class="form-label" for="equipmentType">에어컨 종류 <span class="text-danger">*</span></label><select class="form-select" id="equipmentType" name="equipmentType" required><option value="시스템">시스템</option><option value="벽걸이">벽걸이</option><option value="스탠드형">스탠드형</option></select></div><div class="mb-3"><label class="form-label" for="manufacturer">제조사</label><input class="form-control" id="manufacturer" name="manufacturer" maxlength="100"></div><div class="mb-3"><label class="form-label" for="locationDescription">상세 위치</label><input class="form-control" id="locationDescription" name="locationDescription" maxlength="200"></div><div class="row g-2"><div class="col-6 mb-3"><label class="form-label" for="outdoorUnitCount">실외기 대수</label><input class="form-control" type="number" min="1" max="2" id="outdoorUnitCount" name="outdoorUnitCount" value="1"></div><div class="col-6 mb-3"><label class="form-label" for="manufactureDate">설치/제조일</label><input class="form-control" type="date" id="manufactureDate" name="manufactureDate" value="${today()}"></div></div><div class="mb-3"><label class="form-label" for="photo">대표 사진</label><input class="form-control" type="file" id="photo" name="photo" accept="image/*" capture="environment"><div class="hint">선택 시 등록과 동시에 대표 사진으로 저장됩니다.</div><img id="photoPreview" class="preview" alt="대표 사진 미리보기"></div><button type="submit" class="btn btn-primary btn-main w-100" id="btnRegister">에어컨 등록하기</button></form></div></article>`);
    $('buildingId').addEventListener('change',()=>{$('floorId').innerHTML=floorOptions($('buildingId').value);loadPlanForSelection()}); $('floorId').addEventListener('change',loadPlanForSelection); attachPreview('photo','photoPreview'); $('registerForm').addEventListener('submit',submitRegister);
  }
  async function submitFault(e){e.preventDefault();if(submitting)return;if(!$('reporterName').value.trim()){alert('점검자 이름을 입력하세요.');return}if(!document.querySelector('input[name="inspectionResult"]:checked')){alert('에어컨 작동 상태를 선택하세요.');return}submitting=true;$('btnSubmit').disabled=true;$('btnSubmit').textContent='저장 중...';try{const res=await fetch('/facility-api/mobile/air-conditioners/'+encodeURIComponent(qrKey)+'/fault-reports',{method:'POST',body:new FormData(e.currentTarget)});const json=await res.json().catch(()=>null);if(!res.ok||json?.success===false){alert(json?.message||'점검 저장에 실패했습니다.');return}show('<div class="success-box"><div class="fs-4 mb-2">점검 저장 완료</div><div>에어컨 점검 결과가 저장되었습니다.</div></div>')}catch(_){alert('점검 저장 중 오류가 발생했습니다.')}finally{submitting=false;if($('btnSubmit'))$('btnSubmit').disabled=false}}
  async function submitRegister(e){e.preventDefault();if(submitting)return;if(!getAuthToken()){renderLoginRequired();return}if(!validateSelectedLocation())return;submitting=true;$('btnRegister').disabled=true;$('btnRegister').textContent='등록 중...';try{const res=await fetch('/facility-api/mobile/air-conditioners/'+encodeURIComponent(qrKey)+'/register',{method:'POST',headers:authHeaders(),body:new FormData(e.currentTarget)});const json=await res.json().catch(()=>null);if(res.status===401||res.status===403){alert('로그인 후 등록할 수 있습니다.');renderLoginRequired();return}if(!res.ok||json?.success===false){alert(json?.message||'에어컨 등록에 실패했습니다.');return}show('<div class="success-box"><div class="fs-4 mb-2">등록 완료</div><div>QR에 에어컨이 연결되었습니다. 잠시 후 점검 화면으로 전환됩니다.</div></div>');setTimeout(load,900)}catch(_){alert('에어컨 등록 중 오류가 발생했습니다.')}finally{submitting=false;if($('btnRegister'))$('btnRegister').disabled=false}}
  async function load(){if(!qrKey){setState('QR 키가 비어 있습니다.',true);return}try{const res=await fetch('/facility-api/mobile/air-conditioners/by-key?key='+encodeURIComponent(qrKey));const json=await res.json().catch(()=>null);if(res.ok&&json?.success!==false){renderFault(json.data||{});return}const msg=String(json?.message||''); if(msg.includes('찾을 수 없습니다')){await renderRegister();return} setState(esc(msg||'설비 정보를 찾을 수 없습니다.'),true)}catch(_){setState('설비 정보를 불러오지 못했습니다.',true)}}
  load();
})();
</script>
</body>
</html>
