<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>에어컨 고장 접수</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--brand:#2563eb;--brand2:#0f766e;--bg:#eef6ff;--ink:#0f172a;--muted:#64748b;}
    *{box-sizing:border-box} body{margin:0;font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#dbeafe 0%,#f8fafc 42%,#fff 100%);color:var(--ink)}
    .mobile-shell{width:min(100%,560px);margin:0 auto;min-height:100vh;padding:18px 16px 28px;}
    .hero{border-radius:28px;background:linear-gradient(135deg,#2563eb 0%,#0f766e 100%);color:#fff;padding:24px 20px;box-shadow:0 18px 40px rgba(37,99,235,.26)}
    .hero .eyebrow{font-size:.86rem;font-weight:900;opacity:.78}.hero h1{font-size:1.62rem;font-weight:950;margin:.25rem 0 .35rem}.hero p{margin:0;color:rgba(255,255,255,.78);font-weight:700;line-height:1.45}
    .cardx{border:0;border-radius:24px;background:#fff;box-shadow:0 16px 36px rgba(15,23,42,.08);overflow:hidden}.cardx + .cardx{margin-top:14px}.cardx .card-body{padding:18px}
    .section-title{font-size:.95rem;font-weight:950;color:#1e293b;margin-bottom:12px}.info-grid{display:grid;gap:9px}.info-row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:#f8fafc}.info-row span:first-child{font-size:.8rem;font-weight:900;color:var(--muted);flex:0 0 92px}.info-row span:last-child{font-weight:900;text-align:right;word-break:break-word}.form-label{font-weight:900;color:#334155}.form-control{border-radius:16px;border-color:#cbd5e1;min-height:48px}.btn-main{border:0;border-radius:18px;min-height:54px;font-weight:950;background:linear-gradient(135deg,#2563eb,#0f766e);box-shadow:0 14px 28px rgba(37,99,235,.22)}
    .empty{padding:26px 14px;border-radius:20px;background:#fff;text-align:center;color:var(--muted);font-weight:800}.history{display:grid;gap:8px}.history-item{padding:11px 12px;border-radius:14px;background:#f8fafc}.history-item strong{display:block;font-size:.9rem}.history-item span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}.success-box{border-radius:24px;background:#ecfdf5;color:#166534;padding:22px;text-align:center;font-weight:900}.preview{max-width:100%;border-radius:16px;margin-top:10px;display:none}
  </style>
</head>
<body>
<main class="mobile-shell">
  <section class="hero mb-3">
    <div class="eyebrow">설비관리시스템 모바일 QR</div>
    <h1>에어컨 고장 접수</h1>
    <p>QR이 부착된 에어컨의 고장 내용을 현장에서 바로 접수합니다.</p>
  </section>

  <section id="stateBox" class="empty">설비 정보를 불러오는 중...</section>

  <section id="content" style="display:none">
    <article class="cardx mb-3">
      <div class="card-body">
        <div class="section-title">설비 정보</div>
        <div class="info-grid" id="equipmentInfo"></div>
      </div>
    </article>

    <article class="cardx mb-3">
      <div class="card-body">
        <div class="section-title">고장 접수</div>
        <form id="faultForm">
          <div class="mb-3">
            <label class="form-label" for="reporterName">접수자 이름</label>
            <input class="form-control" id="reporterName" name="reporterName" autocomplete="name" placeholder="선택 입력">
          </div>
          <div class="mb-3">
            <label class="form-label" for="reporterPhone">연락처</label>
            <input class="form-control" id="reporterPhone" name="reporterPhone" inputmode="tel" autocomplete="tel" placeholder="선택 입력">
          </div>
          <div class="mb-3">
            <label class="form-label" for="faultDescription">고장 내용 <span class="text-danger">*</span></label>
            <textarea class="form-control" id="faultDescription" name="faultDescription" rows="5" required placeholder="예: 냉방이 되지 않음, 물 샘, 소음 발생 등"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label" for="photo">현장 사진</label>
            <input class="form-control" type="file" id="photo" name="photo" accept="image/*" capture="environment">
            <img id="photoPreview" class="preview" alt="선택 사진 미리보기">
          </div>
          <button type="submit" class="btn btn-primary btn-main w-100" id="btnSubmit">고장 접수하기</button>
        </form>
      </div>
    </article>

    <article class="cardx">
      <div class="card-body">
        <div class="section-title">최근 접수 내역</div>
        <div id="historyWrap" class="history"></div>
      </div>
    </article>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const qrKey = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let submitting = false;

  function setState(html, danger=false){ $('stateBox').className = 'empty' + (danger ? ' text-danger' : ''); $('stateBox').innerHTML = html; $('stateBox').style.display='block'; $('content').style.display='none'; }
  function showContent(){ $('stateBox').style.display='none'; $('content').style.display='block'; }
  function row(label, value){ return `<div class="info-row"><span>${esc(label)}</span><span>${esc(value || '-')}</span></div>`; }
  function fmtDateTime(v){ if(!v) return '-'; return String(v).replace('T',' ').slice(0,16); }

  async function load(){
    if(!qrKey){ setState('QR 키가 비어 있습니다.', true); return; }
    try{
      const res = await fetch('/facility-api/mobile/air-conditioners/by-key?key=' + encodeURIComponent(qrKey));
      const json = await res.json().catch(() => null);
      if(!res.ok || json?.success === false){ setState(esc(json?.message || '설비 정보를 찾을 수 없습니다.'), true); return; }
      const d = json.data || {};
      $('equipmentInfo').innerHTML = row('식별 No.', d.serialNumber) + row('건물 / 층', [d.buildingName, d.floorName].filter(Boolean).join(' / ')) + row('종류', d.equipmentType) + row('제조사', d.manufacturer) + row('상세 위치', d.locationDescription);
      const history = Array.isArray(d.recentFaultReports) ? d.recentFaultReports : [];
      $('historyWrap').innerHTML = history.length ? history.map(h => `<div class="history-item"><strong>${esc(fmtDateTime(h.createdAt))} 접수</strong><span>${esc(h.faultDescription)}</span></div>`).join('') : '<div class="text-muted fw-bold">최근 접수 내역이 없습니다.</div>';
      showContent();
    }catch(e){ setState('설비 정보를 불러오지 못했습니다.', true); }
  }

  $('photo')?.addEventListener('change', () => {
    const file = $('photo').files?.[0];
    const img = $('photoPreview');
    if(!file){ img.style.display='none'; img.removeAttribute('src'); return; }
    img.src = URL.createObjectURL(file); img.style.display='block';
  });

  $('faultForm')?.addEventListener('submit', async event => {
    event.preventDefault();
    if(submitting) return;
    const desc = $('faultDescription').value.trim();
    if(!desc){ alert('고장 내용을 입력하세요.'); return; }
    submitting = true; $('btnSubmit').disabled = true; $('btnSubmit').textContent = '접수 중...';
    try{
      const fd = new FormData(event.currentTarget);
      const res = await fetch('/facility-api/mobile/air-conditioners/' + encodeURIComponent(qrKey) + '/fault-reports', { method:'POST', body: fd });
      const json = await res.json().catch(() => null);
      if(!res.ok || json?.success === false){ alert(json?.message || '고장 접수에 실패했습니다.'); return; }
      $('content').innerHTML = '<div class="success-box"><div class="fs-4 mb-2">접수 완료</div><div>에어컨 고장 내용이 접수되었습니다.</div></div>';
      showContent();
    }catch(e){ alert('고장 접수 중 오류가 발생했습니다.'); }
    finally{ submitting = false; $('btnSubmit') && ($('btnSubmit').disabled = false); }
  });

  load();
})();
</script>
</body>
</html>
