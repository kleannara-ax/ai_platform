<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>정수기 소독 완료</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--brand:#16a34a;--brand2:#0891b2;--bg:#ecfeff;--ink:#0f172a;--muted:#64748b;}
    *{box-sizing:border-box} body{margin:0;font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#ccfbf1 0%,#f8fafc 42%,#fff 100%);color:var(--ink)}
    .mobile-shell{width:min(100%,560px);margin:0 auto;min-height:100vh;padding:18px 16px 28px;}
    .hero{border-radius:28px;background:linear-gradient(135deg,#16a34a 0%,#0891b2 100%);color:#fff;padding:24px 20px;box-shadow:0 18px 40px rgba(22,163,74,.24)}
    .hero .eyebrow{font-size:.86rem;font-weight:900;opacity:.78}.hero h1{font-size:1.62rem;font-weight:950;margin:.25rem 0 .35rem}.hero p{margin:0;color:rgba(255,255,255,.8);font-weight:700;line-height:1.45}
    .cardx{border:0;border-radius:24px;background:#fff;box-shadow:0 16px 36px rgba(15,23,42,.08);overflow:hidden}.cardx + .cardx{margin-top:14px}.cardx .card-body{padding:18px}
    .section-title{font-size:.95rem;font-weight:950;color:#1e293b;margin-bottom:12px}.info-grid{display:grid;gap:9px}.info-row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:#f8fafc}.info-row span:first-child{font-size:.8rem;font-weight:900;color:var(--muted);flex:0 0 92px}.info-row span:last-child{font-weight:900;text-align:right;word-break:break-word}.form-label{font-weight:900;color:#334155}.form-control{border-radius:16px;border-color:#cbd5e1;min-height:48px}.btn-main{border:0;border-radius:18px;min-height:54px;font-weight:950;background:linear-gradient(135deg,#16a34a,#0891b2);box-shadow:0 14px 28px rgba(22,163,74,.22)}
    .empty{padding:26px 14px;border-radius:20px;background:#fff;text-align:center;color:var(--muted);font-weight:800}.history{display:grid;gap:8px}.history-item{padding:11px 12px;border-radius:14px;background:#f8fafc}.history-item strong{display:block;font-size:.9rem}.history-item span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}.success-box{border-radius:24px;background:#ecfdf5;color:#166534;padding:22px;text-align:center;font-weight:900}.preview{max-width:100%;border-radius:16px;margin-top:10px;display:none}.hint{font-size:.86rem;color:#64748b;font-weight:800;margin-top:6px;line-height:1.45}
  </style>
</head>
<body>
<main class="mobile-shell">
  <section class="hero mb-3">
    <div class="eyebrow">설비관리시스템 모바일 QR</div>
    <h1>정수기 소독 완료</h1>
    <p>소독 작업 완료 후 사진을 촬영해 수기 서명 대신 완료 기록을 남깁니다.</p>
  </section>

  <section id="stateBox" class="empty">설비 정보를 불러오는 중...</section>

  <section id="content" style="display:none">
    <article class="cardx mb-3">
      <div class="card-body">
        <div class="section-title">설비 정보</div>
        <div class="info-grid" id="equipmentInfo"></div>
      </div>
    </article>

    <article class="cardx mb-3">
      <div class="card-body">
        <div class="section-title">소독 완료 처리</div>
        <form id="disinfectionForm">
          <div class="mb-3">
            <label class="form-label" for="workerName">작업자 이름 <span class="text-danger">*</span></label>
            <input class="form-control" id="workerName" name="workerName" autocomplete="name" required placeholder="이름을 입력하세요">
          </div>
          <div class="mb-3">
            <label class="form-label" for="disinfectionDate">소독 완료일</label>
            <input class="form-control" type="date" id="disinfectionDate" name="disinfectionDate">
          </div>
          <div class="mb-3">
            <label class="form-label" for="photo">완료 사진 <span class="text-danger">*</span></label>
            <input class="form-control" type="file" id="photo" name="photo" accept="image/*" capture="environment" required>
            <div class="hint">정수기 소독 완료 상태가 보이도록 현장에서 바로 촬영해 주세요.</div>
            <img id="photoPreview" class="preview" alt="선택 사진 미리보기">
          </div>
          <div class="mb-3">
            <label class="form-label" for="note">비고</label>
            <textarea class="form-control" id="note" name="note" rows="3" placeholder="특이사항이 있으면 입력하세요"></textarea>
          </div>
          <button type="submit" class="btn btn-success btn-main w-100" id="btnSubmit">소독 완료 처리</button>
        </form>
      </div>
    </article>

    <article class="cardx">
      <div class="card-body">
        <div class="section-title">최근 소독 완료 내역</div>
        <div id="historyWrap" class="history"></div>
      </div>
    </article>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const qrKey = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let submitting = false;

  function setState(html, danger=false){ $('stateBox').className = 'empty' + (danger ? ' text-danger' : ''); $('stateBox').innerHTML = html; $('stateBox').style.display='block'; $('content').style.display='none'; }
  function showContent(){ $('stateBox').style.display='none'; $('content').style.display='block'; }
  function row(label, value){ return `<div class="info-row"><span>${esc(label)}</span><span>${esc(value || '-')}</span></div>`; }
  function today(){ return new Date().toISOString().slice(0,10); }

  async function load(){
    $('disinfectionDate').value = today();
    if(!qrKey){ setState('QR 키가 비어 있습니다.', true); return; }
    try{
      const res = await fetch('/facility-api/mobile/water-purifiers/by-key?key=' + encodeURIComponent(qrKey));
      const json = await res.json().catch(() => null);
      if(!res.ok || json?.success === false){ setState(esc(json?.message || '설비 정보를 찾을 수 없습니다.'), true); return; }
      const d = json.data || {};
      $('equipmentInfo').innerHTML = row('식별 No.', d.serialNumber) + row('건물 / 층', [d.buildingName, d.floorName].filter(Boolean).join(' / ')) + row('종류', d.equipmentType) + row('설치일', d.manufactureDate || '-') + row('비고', d.note);
      const history = Array.isArray(d.recentDisinfections) ? d.recentDisinfections : [];
      $('historyWrap').innerHTML = history.length ? history.map(h => `<div class="history-item"><strong>${esc(h.disinfectionDate)} 완료</strong><span>${esc(h.workerName || '-')} ${h.note ? ' / ' + esc(h.note) : ''}</span></div>`).join('') : '<div class="text-muted fw-bold">최근 소독 완료 내역이 없습니다.</div>';
      showContent();
    }catch(e){ setState('설비 정보를 불러오지 못했습니다.', true); }
  }

  $('photo')?.addEventListener('change', () => {
    const file = $('photo').files?.[0];
    const img = $('photoPreview');
    if(!file){ img.style.display='none'; img.removeAttribute('src'); return; }
    img.src = URL.createObjectURL(file); img.style.display='block';
  });

  $('disinfectionForm')?.addEventListener('submit', async event => {
    event.preventDefault();
    if(submitting) return;
    if(!$('workerName').value.trim()){ alert('작업자 이름을 입력하세요.'); return; }
    if(!$('photo').files?.length){ alert('완료 사진을 촬영하거나 선택하세요.'); return; }
    submitting = true; $('btnSubmit').disabled = true; $('btnSubmit').textContent = '저장 중...';
    try{
      const fd = new FormData(event.currentTarget);
      const res = await fetch('/facility-api/mobile/water-purifiers/' + encodeURIComponent(qrKey) + '/disinfections', { method:'POST', body: fd });
      const json = await res.json().catch(() => null);
      if(!res.ok || json?.success === false){ alert(json?.message || '소독 완료 처리에 실패했습니다.'); return; }
      $('content').innerHTML = '<div class="success-box"><div class="fs-4 mb-2">완료 저장</div><div>정수기 소독 완료 사진과 기록이 저장되었습니다.</div></div>';
      showContent();
    }catch(e){ alert('소독 완료 처리 중 오류가 발생했습니다.'); }
    finally{ submitting = false; $('btnSubmit') && ($('btnSubmit').disabled = false); }
  });

  load();
})();
</script>
</body>
</html>
