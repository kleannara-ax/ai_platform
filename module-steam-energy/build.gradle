// ============================================================
// module-steam-energy: 스팀에너지관리 모듈
// 패키지: com.company.module.steamenergy
// URL Prefix: /steam-energy-api/**
// DB Table: steam_* 49개 (sql/module-steam-energy/01_schema.sql)
// ============================================================

dependencies {
    // core 공통 클래스 참조 (컴파일 전용: 순환 의존 방지)
    compileOnly project(':core')

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 규격: 업무 모듈은 SecurityConfig/JWT 를 구현하지 않는다.
    // @PreAuthorize 등 core 권한 체계를 쓰기 위한 컴파일 참조만 둔다.
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Jackson (JSON)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // POI: 엑셀 가져오기/내보내기
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':core')   // 테스트에서 core 의 BusinessException 등을 쓰기 위해 (테스트 범위만)
    testRuntimeOnly 'com.h2database:h2'
}

// spring-boot 플러그인 미적용 서브모듈: plain jar만 생성
jar {
    enabled = true
}
