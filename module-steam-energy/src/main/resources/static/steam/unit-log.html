<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>원단위 일지</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/common.css?v=20260526-responsive-fix" />  <link rel="stylesheet" href="css/page-unit.css?v=20260520-split2-applied" />

  <link rel="stylesheet" href="css/inc-design.css?v=20260526-responsive-fix" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <script src="/steam/js/platform-iframe-compat.js?v=20260824-auth1"></script>
</head>
<body class="landing-body" data-page-kind="unit-log">
  <main class="landing-main" aria-label="작업 영역">
    <div class="landing-canvas">
      <div class="landing-page-header">
        <h1>원단위 일지</h1>
        <p>좌측 하위 메뉴를 클릭하면 기존에 사용하던 표 구조가 각각의 개별 페이지에서 열립니다.</p>
      </div>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const group = document.querySelector(".sidebar-group-flat");
      const toggle = document.querySelector(".sidebar-parent-toggle");
      if (!group || !toggle) return;
      const key = "steamlog:sidebar:daily-log";
      const isOpen = localStorage.getItem(key) === "1";
      group.classList.toggle("is-open", isOpen);
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      toggle.addEventListener("click", () => {
        const nextOpen = group.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", nextOpen ? "true" : "false");
        localStorage.setItem(key, nextOpen ? "1" : "0");
      });
    });
  </script>
  <script src="/steam/js/grid-arrow-nav.js?v=20260428-grid-arrow"></script>
</body>
</html>
