<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>폐합성소각로 운전일지</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/common.css?v=20260825-wil10" />
  <link rel="stylesheet" href="css/inc-design.css?v=20260825-wil10" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <style>
    /* 유동상 운전일지(fluidized-daily-log)와 같은 서식 — 스팀 모듈 페이지 공통 */
    body.landing-body[data-page-kind="waste-incinerator-log"] {
      background: var(--inc-bg-page);
      font-family: "Inter", "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: var(--inc-text);
      height: auto; min-height: 100vh; align-items: stretch; overflow: visible;
    }
    body.landing-body[data-page-kind="waste-incinerator-log"] .landing-main {
      padding: 24px 22px 24px 26px; overflow: visible; height: auto; min-height: auto;
    }
    body.landing-body[data-page-kind="waste-incinerator-log"] .landing-canvas {
      padding: 0; min-width: 0; overflow: visible; background: transparent; box-shadow: none;
    }
    body.platform-embedded[data-page-kind="waste-incinerator-log"] { height: 100vh !important; overflow: auto !important; }
    html.platform-embedded { overflow: hidden !important; }
    body.landing-body.embedded-mode[data-page-kind="waste-incinerator-log"] .sidebar-shell { display: none !important; }
    body.landing-body.embedded-mode[data-page-kind="waste-incinerator-log"] .landing-main { padding: 0; }

    /* ── 시트 탭 ─────────────────────────────────────────── */
    .wil-tabs { display: flex; gap: 6px; margin: 0 0 8px; flex-wrap: wrap; }
    .wil-tab {
      border: 1px solid rgba(120,181,217,.5); border-radius: 9px; background: #fff; color: #3d6786;
      padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .wil-tab:hover:not(:disabled) { background: #f2f9ff; }
    .wil-tab.is-active { background: linear-gradient(180deg,#2f6fb3 0%,#1f4f82 100%); border-color: #1f4f82; color: #fff; }
    .wil-tab:disabled { opacity: .45; cursor: default; }

    /* ── 표 카드 ─────────────────────────────────────────── */
    .wil-sheet {
      background: #fff; border: 1px solid var(--inc-border-card); border-radius: var(--inc-radius-card);
      box-shadow: var(--inc-shadow-card); padding: 12px 14px 14px; max-width: none;
    }
    .wil-scroll { overflow: auto; max-height: calc(100vh - 230px); }

    table.wil-table { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12px; }
    .wil-table th, .wil-table td {
      border-right: 1px solid rgba(120,181,217,.62); border-bottom: 1px solid rgba(120,181,217,.62);
      padding: 0; height: 26px; text-align: center; vertical-align: middle; white-space: nowrap; overflow: hidden;
    }
    .wil-table tr > :first-child { border-left: 1px solid rgba(120,181,217,.62); }
    .wil-table thead th { border-top: 1px solid rgba(120,181,217,.62); }
    .wil-table thead th {
      background: #eaf3fb; font-weight: 700; color: #173a54; padding: 3px 4px; position: sticky; top: 0; z-index: 3;
    }
    .wil-table th.group-col {
      background: #eaf3fb; font-weight: 800; color: #173a54; position: sticky; left: 0; z-index: 2;
    }
    .wil-table th.item-col {
      background: #f2f8fd; font-weight: 700; color: #3d6786; position: sticky; z-index: 2;
    }
    .wil-table thead th.group-col, .wil-table thead th.item-col { z-index: 5; }
    .wil-table td input {
      width: 100%; box-sizing: border-box; border: 0; background: #fff; padding: 2px 5px;
      font: inherit; font-size: 12px; line-height: 18px; color: #173a54; text-align: right; outline: none;
    }
    .wil-table td input:hover { background: #f2f9ff; }
    .wil-table td input:focus { background: #fff; box-shadow: inset 0 0 0 2px rgba(47,111,179,.35); }
    .wil-table td input.is-edited { background: #fff7e6 !important; }
    .wil-table td.calc { background: var(--inc-bg-computed); color: #24406b; font-weight: 700; padding: 2px 5px; text-align: right; }
    .wil-table tr.sum-row th.group-col, .wil-table tr.sum-row th.item-col { background: #f7f2dd; }
    .wil-table tr.sum-row td.calc { background: #fdf8e6; color: #6b5615; }
    .wil-table td.total-cell, .wil-table th.total-head {
      background: #fdf8e6; color: #6b5615; font-weight: 700; padding: 2px 5px; text-align: right;
    }


    .wil-gap { height: 12px; }
    .wil-note { margin: 0 0 8px; font-size: 12px; color: #5b7f9c; }

    /* 날짜가 행으로 내려가는 시트 (스팀량(적산), 외부반입) */
    .wil-table-rows th.group-col { left: 0; }
    /* 그룹(폐#1) + 항목(적산량/생산량) 두 줄 헤더를 함께 고정 — top 은 JS 가 지정 */
    .wil-table-rows thead th { position: sticky; z-index: 4; }
    .wil-table-rows thead th.group-col { z-index: 6; }
    .wil-table-rows thead th[rowspan] { z-index: 6; }
    .wil-table-rows tbody th.group-col { background: #f2f8fd; font-weight: 700; color: #3d6786; }
    .wil-table-rows tr.sum-row th.group-col { background: #f7f2dd; color: #6b5615; }

    .wil-msg { min-width: 74px; font-size: 12px; font-weight: 700; }
    .wil-msg.ok { color: #16a34a; } .wil-msg.err { color: #dc2626; }
    #wilSave:disabled { opacity: .5; cursor: default; }
    body.wil-dirty #wilSave { box-shadow: 0 0 0 3px rgba(220,38,38,.25); }
  </style>
  <script src="/steam/js/platform-iframe-compat.js?v=20260916-auth3"></script>
</head>
<body class="landing-body" data-page-kind="waste-incinerator-log">
  <main class="landing-main">
    <div class="landing-canvas landing-canvas-table">
      <div class="inc-header">
        <div class="inc-header-title">
          <h1>폐합성소각로 운전일지</h1>
        </div>
        <div class="inc-toolbar">
          <select id="wilYear" aria-label="연도"></select>
          <select id="wilMonth" aria-label="월"></select>
          <button type="button" id="wilReload" class="btn-secondary">조회</button>
          <button type="button" id="wilSave" disabled>저장</button>
          <button type="button" id="wilUpload" class="btn-secondary">엑셀 업로드</button>
          <button type="button" id="wilDownload" class="btn-secondary">엑셀 다운로드</button>
          <input type="file" id="wilUploadFile" accept=".xlsx,.xls,.xlsm" hidden />
          <span class="wil-msg" id="wilMsg"></span>
        </div>
      </div>

      <div class="wil-tabs" id="wilTabs"></div>
      <div id="wilPanels"></div>

    </div>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).get("embedded") === "1") {
      document.body.classList.add("embedded-mode");
    }
  </script>
  <script src="/steam/js/waste-incinerator-log-pages.js?v=20260825-wil10"></script>
  <script src="/steam/js/grid-arrow-nav.js?v=20260428-grid-arrow"></script>
</body>
</html>
