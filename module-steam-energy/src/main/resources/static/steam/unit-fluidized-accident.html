<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&#xC0AC;&#xACE0;&#xC774;&#xB825;</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/common.css?v=20260608-sticky3" />  <link rel="stylesheet" href="css/page-fluidized.css?v=20260608-sticky3" />

  <link rel="stylesheet" href="css/inc-design.css?v=20260608-sticky3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <style>
    html,
    body.landing-body[data-page-kind="fluidized-accident"] {
      overflow-x: auto;
      overflow-y: auto;
    }

    body.landing-body[data-page-kind="fluidized-accident"] {
      height: auto;
      min-height: 100vh;
      align-items: stretch;
      overflow: visible;
    }

    body.landing-body[data-page-kind="fluidized-accident"] .sidebar-shell {
      position: sticky;
      top: 0;
      align-self: flex-start;
      height: 100vh;
      min-height: 100vh;
    }

    body.landing-body[data-page-kind="fluidized-accident"] .landing-main.accident-workspace {
      padding: 24px 18px 18px 26px;
      overflow: visible;
      height: auto;
      min-height: 100vh;
    }

    body.landing-body[data-page-kind="fluidized-accident"] .landing-canvas.accident-canvas {
      padding: 14px;
      min-width: 0;
      overflow: visible;
    }

    body.landing-body[data-page-kind="fluidized-accident"] .landing-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    body.landing-body[data-page-kind="fluidized-accident"] .landing-page-copy {
      padding-left: 18px;
      align-self: center;
      flex: 0 0 auto;
      min-width: 0;
    }

    .accident-header-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1 1 auto;
      min-width: 0;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: thin;
      white-space: nowrap;
    }

    .accident-left-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .accident-top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 0 0 auto;
      flex-wrap: nowrap;
    }

    .accident-header-actions .landing-filter-box {
      flex: 0 0 auto;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-accident"] {
      display: block;
      min-height: auto;
      overflow: visible;
      background: transparent;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-accident"] .sidebar-shell {
      display: none !important;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-accident"] .landing-page-header {
      display: flex !important;
      margin-bottom: 12px;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-accident"] .landing-page-copy {
      display: none !important;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-accident"] .landing-main.accident-workspace {
      padding: 0;
      min-height: auto;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-accident"] .landing-canvas.accident-canvas {
      padding: 0;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }

    /* 카드/래퍼 자체 overflow 해제 → thead sticky(top:0) 가 body 기준 동작. */
    body.landing-body[data-page-kind="fluidized-accident"] .accident-card,
    body.landing-body[data-page-kind="fluidized-accident"] #accidentTableWrap {
      overflow: visible !important;
    }
    /* 셸 iframe: body 를 고정 높이의 단일 스크롤 컨테이너로 → thead sticky 동작 */
    body.platform-embedded[data-page-kind="fluidized-accident"] {
      height: 100vh !important;
      overflow: auto !important;
    }
    html.platform-embedded { overflow: hidden !important; }

    .accident-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .accident-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      flex: 0 0 auto;
    }

    .accident-card {
      border: 1px solid rgba(120, 181, 217, 0.24);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 24px rgba(23, 65, 95, 0.08);
      overflow-x: auto;
      overflow-y: visible;
    }

    .accident-title {
      margin: 0;
      padding: 14px 16px 6px;
      font-size: 15px;
      font-weight: 800;
      color: #173a54;
    }

    .accident-table-wrap {
      padding: 0 0 12px;
    }

    .accident-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      line-height: 1.45;
      color: #173a54;
    }

    .accident-table th,
    .accident-table td {
      border: 1px solid rgba(159, 190, 212, 0.72);
      padding: 6px 5px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .accident-table thead th {
      background: #dff2ff;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .accident-table .sticky-col {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #eef8ff;
    }

    .accident-table .sticky-col-2 {
      position: sticky;
      left: 42px;
      z-index: 4;
      background: #eef8ff;
    }

    .accident-table thead .sticky-col,
    .accident-table thead .sticky-col-2 {
      z-index: 8;
      background: #dff2ff;
    }

    .accident-table .date-col {
      width: 100px;
      min-width: 100px;
      max-width: 100px;
      font-weight: 800;
    }

    .accident-table .drag-col {
      width: 42px;
      min-width: 40px;
      max-width: 45px;
    }

    .accident-table .no-col {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      font-weight: 700;
    }

    .accident-table .wide-col {
      width: 350px;
      min-width: 300px;
    }

    .accident-table .mid-col {
      width: 72px;
      min-width: 72px;
      max-width: 90px;
    }

    .accident-table .note-col {
      width: 70px;
      min-width: 70px;
      max-width: 70px;
    }

    .accident-table .action-col {
      width: 42px;
      min-width: 40px;
      max-width: 45px;
    }

    .accident-table tbody tr.summary-row td,
    .accident-table tbody tr.summary-row th {
      background: #f6f1d8;
      font-weight: 800;
    }

    .accident-input,
    .accident-select {
      width: 100%;
      min-width: 0;
      border: 1px solid #b7d7ef;
      border-radius: 8px;
      background: #eef8ff;
      padding: 7px 8px;
      color: #173a54;
      font: inherit;
      font-weight: 700;
      box-sizing: border-box;
    }

    .accident-input.wide-input {
      min-width: 0;
    }

    .accident-input.mid-input {
      min-width: 0;
    }

    .accident-button {
      border: 1px solid rgba(72, 126, 161, 0.18);
      border-radius: 10px;
      background: linear-gradient(180deg, #f7fbff 0%, #e8f3fb 100%);
      color: #173a54;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(23, 65, 95, 0.08);
    }

    .accident-delete-button {
      width: 100%;
      border: 1px solid rgba(183, 111, 111, 0.22);
      border-radius: 8px;
      background: #fff4f4;
      color: #8a3f3f;
      padding: 7px 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .accident-drag-handle {
      width: 100%;
      border: 1px solid rgba(72, 126, 161, 0.18);
      border-radius: 8px;
      background: #eef6fc;
      color: #173a54;
      padding: 7px 8px;
      font: inherit;
      font-weight: 700;
      cursor: grab;
    }

    .accident-row.is-dragging {
      opacity: 0.45;
    }

    .accident-row.drop-before {
      box-shadow: inset 0 3px 0 #56a7e2;
    }

    .accident-row.drop-after {
      box-shadow: inset 0 -3px 0 #56a7e2;
    }
  </style>
  <script src="/steam/js/platform-iframe-compat.js?v=20260916-auth3"></script>
</head>
<body class="landing-body" data-page-kind="fluidized-accident">
  <main class="landing-main accident-workspace">
    <div class="landing-canvas landing-canvas-table accident-canvas">
      <div class="landing-page-header">
        <div class="landing-page-copy">
          <h1>&#xC0AC;&#xACE0;&#xC774;&#xB825;</h1>
        </div>
        <div class="accident-header-actions">
          <div class="accident-left-actions">
            <div class="accident-tabs" id="accidentTabs"></div>
            <div class="accident-top-actions" id="accidentTopActions"></div>
          </div>
          <div class="landing-filter-box" aria-label="&#xC870;&#xD68C; &#xC5F0;&#xB3C4;">
            <span class="landing-filter-title">&#xC870;&#xD68C;</span>
            <select id="filterYear"></select>
            <button type="button" class="landing-filter-action" id="filterSubmit">&#xC870;&#xD68C;</button>
          </div>
        </div>
      </div>

      <section class="accident-card">
        <h3 class="accident-title" id="accidentPanelTitle">&#xC0AC;&#xACE0;&#xC774;&#xB825;</h3>
        <div class="accident-table-wrap" id="accidentTableWrap"></div>
      </section>
    </div>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).get("embedded") === "1") {
      document.body.classList.add("embedded-mode");
    }
  </script>
  <script src="/steam/js/excel-upload-errors.js?v=20260608-sticky3"></script>
  <script src="/steam/js/unit-fluidized-accident-pages.js?v=20260608-sticky3"></script>
  <script src="/steam/js/fluidized-excel-controls.js?v=20260608-sticky3"></script>
  <script src="/steam/js/grid-arrow-nav.js?v=20260608-sticky3"></script>
</body>
</html>
