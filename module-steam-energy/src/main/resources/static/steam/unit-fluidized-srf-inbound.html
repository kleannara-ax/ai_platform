<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRF 입고내역</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/common.css?v=20260608-sticky3" />  <link rel="stylesheet" href="css/page-fluidized.css?v=20260608-sticky3" />

  <link rel="stylesheet" href="css/inc-design.css?v=20260608-sticky3" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <style>
    html,
    body.landing-body[data-page-kind="fluidized-srf-inbound"] {
      overflow-x: auto;
      overflow-y: auto;
    }

    body.landing-body[data-page-kind="fluidized-srf-inbound"] {
      height: auto;
      min-height: 100vh;
      align-items: stretch;
      overflow: visible;
    }

    body.landing-body[data-page-kind="fluidized-srf-inbound"] .sidebar-shell {
      position: sticky;
      top: 0;
      align-self: flex-start;
      height: 100vh;
      min-height: 100vh;
    }

    body.landing-body[data-page-kind="fluidized-srf-inbound"] .landing-main.srf-inbound-workspace {
      padding: 24px 18px 18px 26px;
      overflow: visible;
      height: auto;
      min-height: 100vh;
    }

    body.landing-body[data-page-kind="fluidized-srf-inbound"] .landing-canvas.srf-inbound-canvas {
      padding: 14px;
      min-width: 0;
      overflow: visible;
    }

    body.landing-body[data-page-kind="fluidized-srf-inbound"] .landing-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    body.landing-body[data-page-kind="fluidized-srf-inbound"] .landing-page-copy {
      padding-left: 18px;
      padding-top: 12px;
      align-self: center;
      flex: 1 1 auto;
      min-width: 0;
    }

    .srf-header-actions {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      flex: 0 0 auto;
      padding-top: 8px;
      min-width: 0;
    }

    .srf-table-card {
      border: 1px solid rgba(120, 181, 217, 0.24);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 24px rgba(23, 65, 95, 0.08);
      overflow-x: auto;
      overflow-y: visible;
    }

    .srf-table-title {
      margin: 0;
      padding: 14px 16px 6px;
      font-size: 15px;
      font-weight: 800;
      color: #173a54;
    }

    .srf-table-wrap {
      padding: 0 0 4px;
    }

    .srf-workbook-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
      line-height: 1.45;
      color: #173a54;
    }

    .srf-workbook-table th,
    .srf-workbook-table td {
      border: 1px solid rgba(159, 190, 212, 0.72);
      padding: 6px 5px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .srf-workbook-table thead th {
      background: #dff2ff;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .srf-workbook-table .sticky-col {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #eef8ff;
    }

    .srf-workbook-table .sticky-col-2 {
      position: sticky;
      left: 0px;
      z-index: 4;
      background: #eef8ff;
    }

    .srf-workbook-table thead .sticky-col,
    .srf-workbook-table thead .sticky-col-2 {
      z-index: 8;
      background: #dff2ff;
    }

    .srf-workbook-table .product-col {
      min-width: 92px;
      font-weight: 800;
    }

    .srf-workbook-table .date-col {
      width: 40px !important;
      min-width: 40px !important;
      max-width: 50px !important;
      font-weight: 700;
    }

    .srf-workbook-table tbody tr.is-selected td,
    .srf-workbook-table tbody tr.is-selected th {
      background: #fffbe7;
    }

    .srf-workbook-table tbody tr.summary-row td,
    .srf-workbook-table tbody tr.summary-row th {
      background: #f6f1d8;
      font-weight: 800;
    }

    .srf-workbook-table tbody tr.rate-row td,
    .srf-workbook-table tbody tr.rate-row th {
      background: #eff7ee;
      font-weight: 800;
    }

    .srf-workbook-table tbody tr.cost-row td,
    .srf-workbook-table tbody tr.cost-row th {
      background: #f7efe2;
      font-weight: 800;
    }

    .srf-input {
      width: 100%;
      min-width: 86px;
      border: 1px solid #b7d7ef;
      border-radius: 8px;
      background: #eef8ff;
      padding: 7px 8px;
      text-align: right;
      color: #173a54;
      font: inherit;
      font-weight: 700;
      box-sizing: border-box;
    }

    .srf-input:focus {
      outline: 2px solid rgba(86, 167, 226, 0.26);
      border-color: #66b7e7;
      background: #f8fcff;
    }

    .srf-calc {
      display: block;
      min-width: 86px;
      border-radius: 8px;
      background: #f4f7fa;
      padding: 7px 8px;
      text-align: right;
      font-weight: 700;
      color: #486172;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-srf-inbound"] {
      display: block;
      min-height: auto;
      overflow: visible;
      background: transparent;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-srf-inbound"] .sidebar-shell,
    body.landing-body.embedded-mode[data-page-kind="fluidized-srf-inbound"] .landing-page-header {
      display: none !important;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-srf-inbound"] .landing-main.srf-inbound-workspace {
      padding: 0;
      min-height: auto;
    }

    body.landing-body.embedded-mode[data-page-kind="fluidized-srf-inbound"] .landing-canvas.srf-inbound-canvas {
      padding: 0;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }

    /* 카드/래퍼의 자체 overflow 를 해제해 thead 의 sticky(top:0) 가 body
       (실제 스크롤 컨테이너) 기준으로 동작하도록 한다. 가로 스크롤은 body 가
       처리하고, 첫 열은 sticky-col 로 고정 유지. */
    body.landing-body[data-page-kind="fluidized-srf-inbound"] .srf-table-card,
    body.landing-body[data-page-kind="fluidized-srf-inbound"] #srfInboundTableWrap {
      overflow: visible !important;
    }
    /* 셸 iframe(/steam/...) 안에서는 compat.js 가 body 를 overflow:auto 로 만들지만
       높이를 안 줘서 body 가 콘텐츠만큼 커져 실제로는 html/iframe 이 스크롤된다.
       → body 에 높이를 고정해 body 가 단일 스크롤 컨테이너가 되어야 thead sticky 가
       동작한다. (스크롤바는 body 하나) */
    body.platform-embedded[data-page-kind="fluidized-srf-inbound"] {
      height: 100vh !important;
      overflow: auto !important;
    }
    html.platform-embedded { overflow: hidden !important; }

.srf-workbook-table td:not(.product-col):not(.date-col),
.srf-workbook-table th:not(.product-col):not(.date-col) {
  width: clamp(80px, 7vw, 150px) !important;
  min-width: 80px !important;
  max-width: 150px !important;
}

.srf-input {
  min-width: 0 !important;
}

/* 품명 컬럼 완전 제거 */

.srf-workbook-table .product-col {
  width: 0 !important;
  min-width: 0 !important;
  max-width: 0 !important;

  padding: 0 !important;
  border: 0 !important;

  overflow: hidden;
  font-size: 0;

  visibility: collapse;
}

  </style>
  <script src="/steam/js/platform-iframe-compat.js?v=20260916-auth3"></script>
</head>
<body class="landing-body" data-page-kind="fluidized-srf-inbound">
  <main class="landing-main srf-inbound-workspace">
    <div class="landing-canvas landing-canvas-table srf-inbound-canvas">
      <div class="landing-page-header">
        <div class="landing-page-copy">
          <h1 id="srfInboundPageTitle">SRF 입고내역</h1>
        </div>
        <div class="srf-header-actions">
          <div class="landing-filter-box" aria-label="조회 연월">
            <span class="landing-filter-title">조회</span>
            <select id="filterYear"></select>
            <span class="filter-dot">.</span>
            <select id="filterMonth"></select>
            <button type="button" class="landing-filter-action" id="filterSubmit">조회</button>
          </div>
          <div class="landing-filter-box landing-upload-box" aria-label="SRF 엑셀 업로드">
            <span class="landing-filter-title">&#xC5D1;&#xC140;</span>
            <button type="button" class="landing-filter-action" id="srfExcelUpload">&#xC5C5;&#xB85C;&#xB4DC;</button>
            <input type="file" id="srfExcelFileInput" accept=".xls,.xlsx,.xlsm" hidden />
          </div>
        </div>
      </div>

      <section class="srf-table-card">
        <h3 class="srf-table-title">4. SRF입고내역</h3>
        <div class="srf-table-wrap" id="srfInboundTableWrap"></div>
      </section>
    </div>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).get("embedded") === "1") {
      document.body.classList.add("embedded-mode");
    }
  </script>
  <script src="/steam/js/excel-upload-errors.js?v=20260608-sticky3"></script>
  <script src="/steam/js/unit-fluidized-srf-inbound-pages.js?v=20260608-sticky3"></script>
  <script src="/steam/js/fluidized-excel-controls.js?v=20260608-sticky3"></script>
  <script src="/steam/js/grid-arrow-nav.js?v=20260608-sticky3"></script>
</body>
</html>
